<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI HOT 仪表盘 · 日报 / 周报</title>
<style>
  :root{--bg:#0b0e14;--bg2:#11151f;--card:#161b27;--card2:#1b2230;--txt:#e6e9ef;--mut:#9aa4b2;--line:#222a38;--accent:#6366f1;--wx:#07c160;--up:#f97316;--fav:#fcd34d;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(1200px 600px at 80% -10%,#1a2138 0%,var(--bg) 55%) fixed;color:var(--txt);line-height:1.6;padding-bottom:64px}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px}
  .hero{padding:40px 0 22px}
  .kicker{color:var(--mut);font-size:13px;letter-spacing:.18em;text-transform:uppercase}
  .hero h1{font-size:clamp(26px,5vw,42px);font-weight:800;margin:8px 0 4px;background:linear-gradient(90deg,#a5b4fc,#67e8f9,#fcd34d);-webkit-background-clip:text;background-clip:text;color:transparent}
  .meta{color:var(--mut);font-size:14px;margin-top:4px}.meta b{color:var(--txt)}
  .lead{margin-top:10px;font-size:14px;color:#cbd5e1;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:10px 14px}
  .lead .tag{color:var(--accent);font-weight:700;margin-right:6px}
  .stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-top:20px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;border-top:3px solid var(--c);transition:.18s}
  .stat-n{display:block;font-size:24px;font-weight:800;color:var(--c)}
  .stat-l{display:block;font-size:12px;color:var(--mut);margin-top:3px}
  /* 功能1：可点击的统计卡片（count>0），count=0 置灰不可点 */
  .stat.clickable{cursor:pointer}
  .stat.clickable:hover{transform:translateY(-2px);border-color:var(--c);box-shadow:0 8px 24px -12px var(--c)}
  .stat.disabled{opacity:.45;cursor:default}
  /* 功能1：版块跳转高亮闪烁 */
  .block.flash{animation:secflash 1.6s ease}
  @keyframes secflash{0%,100%{box-shadow:none}15%,45%{box-shadow:0 0 0 3px var(--c),0 0 40px -8px var(--c);border-radius:14px}}
  .bar{position:sticky;top:0;z-index:30;background:rgba(11,14,20,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin:14px 0 24px}
  .bar-in{display:flex;gap:8px;flex-wrap:wrap;align-items:center;max-width:1180px;margin:0 auto;padding:10px 20px}
  .tab{font-weight:700;font-size:14px;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--mut);cursor:pointer;transition:.18s}
  .tab.active{color:#0b0e14;background:linear-gradient(90deg,#a5b4fc,#67e8f9);border-color:transparent}
  /* 功能2：收藏 tab */
  .tab.fav{border-color:rgba(252,211,77,.4);color:var(--fav)}
  .tab.fav.active{color:#0b0e14;background:linear-gradient(90deg,#fcd34d,#f59e0b)}
  .tab.fav .fav-n{font-size:11px;background:rgba(252,211,77,.18);border-radius:999px;padding:1px 7px;margin-left:5px}
  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
  .fchip{font-size:12.5px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card2);color:var(--mut);cursor:pointer;transition:.18s}
  .fchip.on{color:var(--txt);border-color:var(--accent);background:#1e2436}
  .fchip.wx.on{color:#062; border-color:var(--wx);background:#0c2a18}
  #q{background:var(--card2);border:1px solid var(--line);border-radius:999px;color:var(--txt);padding:6px 12px;font-size:12.5px;outline:none}
  .block{margin-bottom:36px;scroll-margin-top:64px}
  .bh{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:9px;border-bottom:1px solid var(--line)}
  .bh .dot{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c)}
  .bh h2{font-size:19px;font-weight:700}.bh .c{margin-left:auto;font-size:13px;color:var(--mut)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  .card{position:relative;background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:16px;padding:17px 17px 15px;display:flex;flex-direction:column;min-height:165px;transition:.18s;overflow:hidden}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c);opacity:.85}
  .card.wx::before{background:var(--wx)}
  .card:hover{transform:translateY(-3px);border-color:var(--c);box-shadow:0 10px 30px -12px var(--c)}
  .card.wx:hover{border-color:var(--wx);box-shadow:0 10px 30px -12px var(--wx)}
  /* 功能2：有更新的追踪卡片橙色高亮边框 */
  .card.updated{border-color:var(--up)}
  .ct{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .num{font-size:12.5px;font-weight:800;color:#0b0e14;background:#a5b4fc;border-radius:8px;padding:2px 8px;min-width:32px;text-align:center}
  .card.wx .num{background:#6ee7b7}
  .source{font-size:11.5px;color:var(--mut);background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:2px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .source.wx{color:#7ee2a8;border-color:#0c3a22}
  .time{margin-left:auto;font-size:11px;color:var(--mut)}
  .title{font-size:16px;font-weight:700;line-height:1.4;margin-bottom:7px}
  .title a{color:var(--txt);text-decoration:none}.title a:hover{color:#a5b4fc;text-decoration:underline;text-decoration-color:var(--accent)}
  .card.wx .title a:hover{color:#6ee7b7}
  .summary{font-size:13px;color:var(--mut);flex:1;margin-bottom:13px}
  /* 功能2：卡片底部行（阅读原文 + 追踪按钮） */
  .card-foot{display:flex;align-items:center;gap:8px;margin-top:auto}
  .read{font-size:12.5px;font-weight:600;color:#a5b4fc;text-decoration:none;border:1px solid var(--accent);border-radius:9px;padding:5px 11px;transition:.18s}
  .read:hover{background:var(--accent);color:#0b0e14}
  .card.wx .read{color:#6ee7b7;border-color:var(--wx)}.card.wx .read:hover{background:var(--wx);color:#04130b}
  .track-btn{margin-left:auto;font-size:12px;font-weight:600;color:var(--mut);background:transparent;border:1px solid var(--line);border-radius:9px;padding:5px 11px;cursor:pointer;transition:.18s;white-space:nowrap}
  .track-btn:hover{color:var(--fav);border-color:var(--fav)}
  .track-btn.on{color:#0b0e14;background:var(--fav);border-color:var(--fav)}
  /* 功能2：UPDATE 徽章（橙红渐变 + 脉冲），点击展开相关进展 */
  .update-badge{position:absolute;top:10px;right:10px;font-size:10.5px;font-weight:800;letter-spacing:.06em;color:#fff;background:linear-gradient(90deg,#f97316,#ef4444);border:none;border-radius:999px;padding:3px 10px;cursor:pointer;animation:uppulse 1.6s infinite;z-index:2}
  @keyframes uppulse{0%,100%{box-shadow:0 0 0 0 rgba(249,115,22,.55)}50%{box-shadow:0 0 0 7px rgba(249,115,22,0)}}
  .update-panel{display:none;margin:0 0 10px;border:1px solid #7c2d12;background:#1c1310;border-radius:10px;padding:8px 11px;font-size:12px}
  .update-panel.open{display:block}
  .update-panel .up-title{color:#fdba74;font-weight:700;margin-bottom:5px}
  .up-item{display:block;color:#cbd5e1;text-decoration:none;padding:4px 0;border-top:1px dashed #3f2212;line-height:1.45}
  .up-item:first-of-type{border-top:none}
  .up-item:hover{color:#fdba74}
  .up-item .up-time{color:var(--mut);font-size:11px;margin-left:6px;white-space:nowrap}
  /* 功能2：收藏夹视图 */
  .fav-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .fav-head h2{font-size:19px;font-weight:700}
  .fav-status{font-size:12.5px;color:var(--mut)}
  .fav-clear{margin-left:auto;font-size:12px;font-weight:600;color:#fca5a5;background:transparent;border:1px solid #7f1d1d;border-radius:9px;padding:5px 12px;cursor:pointer;transition:.18s}
  .fav-clear:hover{background:#7f1d1d;color:#fee2e2}
  .fav-grid{display:grid;grid-template-columns:1fr;gap:14px}
  .fav-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--mut);margin:6px 0 4px}
  .kw-chip{font-size:11px;color:#c4b5fd;background:rgba(139,92,246,.14);border:1px solid rgba(139,92,246,.35);border-radius:999px;padding:1px 8px}
  .untrack-btn{font-size:11.5px;font-weight:600;color:var(--mut);background:transparent;border:1px solid var(--line);border-radius:8px;padding:3px 10px;cursor:pointer;transition:.18s;white-space:nowrap}
  .untrack-btn:hover{color:#fca5a5;border-color:#7f1d1d}
  .mpnote{margin:10px 0 0;font-size:12.5px;color:var(--wx)}
  .foot{border-top:1px solid var(--line);margin-top:22px;padding-top:18px;color:var(--mut);font-size:12.5px;text-align:center}
  .foot a{color:#67e8f9;text-decoration:none}
  @media(max-width:720px){.stats{grid-template-columns:repeat(3,1fr)}.hero{padding:30px 0 16px}.filters{margin-left:0;width:100%}}
</style>
</head>

</div>

.com/OpenAIDevs/status/2087242829076791392","source":"X：OpenAI Developers (@OpenAIDevs)","sourceType":"aihot","category":"产品发布/更新","publishedAt":"2026-08-11T18:20:44.000Z","mpName":null,"num":43,"timeText":"8/12 02:20"},{"id":"aihot:cmsqj4ly004izroxvzl349s3r","title":"Claude in Chrome 侧边栏升级为 Claude Cowork 会话","summary":"Claude in Chrome 浏览器扩展的侧边栏现已升级为 Claude Cowork 会话，对话会保存至历史记录，技能和连接器可在浏览器中工作，且任务可在桌面、网页和移动端应用间无缝切换。","url":"https://claude.com/blog/cowork-chrome-side-panel","source":"Claude：Blog（网页）","sourceType":"aihot","category":"产品发布/更新","publishedAt":"2026-08-11T16:00:00.000Z","mpName":null,"num":49,"timeText":"8/12 00:00"},{"id":"aihot:cmsow47ob08oarohd6vhpqrwt","title":"Gemini 助力 Database Migration Service 加速 PostgreSQL 迁移","summary":"Google Cloud 在 Database Migration Service（DMS）中推出由 Gemini 驱动的 AI 辅助代码转换，可将 Oracle 或 SQL Server 的存储过程、触发器和自定义函数转换为 PostgreSQL PL/pgSQL 代码。","url":"https://cloud.google.com/blog/products/databases/accelerate-postgresql-migrations-with-gemini-in-dms","source":"Google Cloud：Databases（RSS）","sourceType":"aihot","category":"产品发布/更新","publishedAt":"2026-08-11T16:00:00.000Z","mpName":null,"num":51,"timeText":"8/12 00:00"},{"id":"aihot:cmso95agg0ig3rofwaqvy9crw","title":"ZCode全面升级：Goal、Subagents、Remote Control与闲时任务四大功能上线","summary":"ZCode针对GLM深度优化，今日上线Goal、Subagents、Remote Control与闲时任务四大功能。在Z.ai Code Bench测试中，GLM-5.2搭配ZCode较搭配Claude Code任务整体通过率高2.39%；ZCode缓存命中率超98%，叠加1.5倍限时额度加成后，GLM Coding Plan整体使用量接近常规额度的1.8倍。","url":"https://mp.weixin.qq.com/s?__biz=MzkyMzI3NzQ0Mg%3D%3D&mid=2247494052&idx=1&sn=ee3ab3d0f4550e9120927c53a27522c9","source":"公众号：智谱（GLM）","sourceType":"wechat","category":"产品发布/更新","publishedAt":"2026-08-11T05:52:25.000Z","mpName":null,"num":60,"timeText":"8/11 13:52"}]},{"label":"AI泛娱乐新闻","count":0,"items":[]},{"label":"行业动态","count":11,"items":[{"id":"aihot:cmsuto7hk0912rouhodiiywlk","title":"Cursor 正式被 SpaceX 收购","summary":"Cursor 已被 SpaceX 正式收购，完成自 4 月启动的收购流程。借助 SpaceX 全球最大规模的 GPU 集群，Cursor 将构建更强且运行成本更低的模型，并以更低价格向客户提供更强大的模型。本周三发布的 Grok 4.6 是双方合作成果的早期体现。","url":"https://cursor.com/blog/joining-spacex","source":"Hacker News 热门（buzzing.cc 中文翻译）","sourceType":"aihot","category":"行业动态","publishedAt":"2026-08-15T20:05:54.703Z","mpName":null,"num":3,"timeText":"昨天 04:05"},{"id":"aihot:cmst2gs6d02lmro06sb7as7av","title":"OpenAI and Anthropic in price war as Chinese AI rivals gain ground","summary":"","url":"https://arstechnica.com/ai/2026/08/openai-and-anthropic-in-price-war-as-chinese-ai-rivals-gain-ground","source":"Ars Technica：AI（RSS）","sourceType":"aihot","category":"行业动态","publishedAt":"2026-08-14T14:27:14.000Z","mpName":null,"num":7,"timeText":"8/14 22:27"},{"id":"aihot:cmst3joqo03pwro0658o4g1m3","title":"Cursor 正式被 SpaceX 收购","summary":"Cursor 已被 SpaceX 正式收购，完成自 4 月启动的收购流程。合并后 Cursor 将获得全球最大 GPU 集群，以构建更强且运行成本更低的模型，从而以更低价格向客户提供更强大的模型。本周三发布的 Grok 4.6 是双方合作成果的早期体现。","url":"https://cursor.com/blog/joining-spacex","source":"Cursor Blog","sourceType":"aihot","category":"行业动态","publishedAt":"2026-08-14T12:00:00.000Z","mpName":null,"num":8,"timeText":"8/14 20:00"},{"id":"aihot:cmstc3u8j02xhro0xf5o1ouas","title":"Claude 文本水印机制如何运作","summary":"未来 Claude 模型生成的文本将包含水印，用于判断文本由 Claude 撰写的可能性，这是 Anthropic 为遵守欧盟《AI 法案》而实施的变更。该方法基于 Google DeepMind 的 SynthID-Text 技术，对输出质量、创造力和可读性无实际影响，读者无法区分水印文本与普通文本，且不增加额外 token 或成本。","url":"https://www.anthropic.com/news/claude-text-watermark","source":"Anthropic：Newsroom（网页）","sourceType":"aihot","category":"行业动态","publishedAt":"2026-08-13T16:00:00.000Z","mpName":null,"num":18,"timeText":"8/14 00:00"},{"id":"aihot:cmspo193n05q2rojeue8j2k5a","title":"Research Gold 号称\"100%人类撰写、绝不使用AI\"，实则全程由AI驱动","summary":"面向医学研究者的网站 Research Gold 宣称其服务\"100%由人类撰写、绝不使用AI\"，并列出多名博士审稿人。但调查发现，这些审稿人系AI生成、并不存在；部分真实方法学家的身份和照片未经许可被挪用。致电该公司时，自称\"Sarah\"的AI助手坚称自己是真人，邮件与聊天回复也均为AI生成。","url":"https://www.404media.co/company-offering-100-human-written-never-ai-peer-review-is-entirely-ai","source":"Hacker News 热门（buzzing.cc 中文翻译）","sourceType":"aihot","category":"行业动态","publishedAt":"2026-08-12T05:41:30.137Z","mpName":null,"num":34,"timeText":"8/12 13:41"},{"id":"aihot:cmsp2lgxo03xjrortthctedzu","title":"ChatGPT 与 Gemini 双双突破 10 亿用户","summary":"OpenAI 与 Google 的聊天机器人均跨过 10 亿用户门槛。OpenAI 在 8 月 6 日的博文中披露 ChatGPT 月活用户超 10 亿，Google CEO 皮查伊则宣布 Gemini 月活达 10 亿，成为其史上增长最快的产品。OpenAI 称 ChatGPT 在 7 月周活用户已达 10 亿，而 Gemini 在 2 月月活为 7.5 亿，增长势头更猛。","url":"https://www.theverge.com/ai-artificial-intelligence/978113/chatgpt-gemini-1-billion-users","source":"The Verge：AI（RSS）","sourceType":"aihot","category":"行业动态","publishedAt":"2026-08-11T19:41:42.000Z","mpName":null,"num":40,"timeText":"8/12 03:41"},{"id":"aihot:cmsoydypn029yro3yvsi036au","title":"研究人员发现可读取ChatGPT等模型加密推理过程的API漏洞","summary":"Alexander Panfilov团队发现OpenAI、Anthropic、Google等主要AI提供商API存在漏洞，可读取推理模型的加密思考过程。扫描约7000条公开会话发现62个API密钥、33个邮箱和33个密码。通过越狱，Anthropic的Haiku 4.5可逐字转写Opus 4.8的原始推理；解码10000条推理轨迹的API成本约720美元。","url":"https://the-decoder.com/but-marinade-and-leaked-passwords-are-what-researchers-found-in-chatgpts-hidden-reasoning","source":"The Decoder：AI News（RSS）","sourceType":"aihot","category":"行业动态","publishedAt":"2026-08-11T17:38:49.000Z","mpName":null,"num":44,"timeText":"8/12 01:38"},{"id":"aihot:cmsoxh6oa0a3drohdskp7cb9u","title":"Gemini月活破10亿，成谷歌增长最快产品","summary":"每月已有超过 10 亿人使用 @Geminiapp 激发新想法、完成工作。这是我们有史以来增长最快的产品，也是第 14 个达到 10 亿用户里程碑的产品。\n\n感谢 @JoshWoodward 和整个 Gemini 团队，也感谢每一位与我们同行的伙伴--未来还有更多精彩！","url":"https://x.com/sundarpichai/status/2087222656819241292","source":"X：Sundar Pichai (@sundarpichai)","sourceType":"aihot","category":"行业动态","publishedAt":"2026-08-11T17:00:34.000Z","mpName":null,"num":45,"timeText":"8/12 01:00"},{"id":"aihot:cmsostkpq05iurohd30b8ubmy","title":"消息称英伟达开发万亿参数开源 AI 模型 Nemotron 4，目标挑战全球顶级","summary":"英伟达正在研发新一代开源 AI 模型系列 Nemotron 4，规模最大的模型预计至少拥有 1 万亿个参数，旨在与全球最先进的开源模型竞争。英伟达尚未确定发布日期，最终训练也未完成，员工认为该模型最早可能在今年秋末准备就绪。此举意在通过开放模型生态扩大 AI 应用范围，并推动市场对其 GPU 算力的需求。","url":"https://www.ithome.com/0/988/524.htm","source":"IT之家（RSS）","sourceType":"aihot","category":"行业动态","publishedAt":"2026-08-11T14:54:16.000Z","mpName":null,"num":52,"timeText":"8/11 22:54"},{"id":"aihot:cmso58oqr0b7trofwl3dcmz7y","title":"消息称 Anthropic 最快今年 9 月上市，向投资者淡化 AI 模型竞争等挑战","summary":"Anthropic 正与潜在投资者接触，为可能成为史上规模最大的 IPO 做准备，计划今年 9 月或 10 月初正式上市。公司估值高达 9，650 亿美元，年化收入已超 470 亿美元，并淡化来自中国 AI 企业的竞争影响。Anthropic 还计划拓展 AI 在医疗和生物学领域的应用，但尚未公布具体 IPO 定价方案。","url":"https://www.ithome.com/0/988/239.htm","source":"IT之家（RSS）","sourceType":"aihot","category":"行业动态","publishedAt":"2026-08-11T03:57:53.000Z","mpName":null,"num":63,"timeText":"8/11 11:57"},{"id":"aihot:cmsnrwnsb0i1erohfuhfjc4q6","title":"英伟达联合六大机构融资5000亿美元建AI工厂","summary":"英伟达宣布与Apollo、BlackRock、Blackstone、Brookfield、Goldman Sachs和KKR合作，建立独立融资平台，动员超5000亿美元第三方资本支持AI基础设施建设。","url":"https://x.com/JensenHuang/status/2086934705207959965","source":"X：Jensen Huang (@JensenHuang)","sourceType":"aihot","category":"行业动态","publishedAt":"2026-08-10T21:56:21.000Z","mpName":null,"num":67,"timeText":"8/11 05:56"}]},{"label":"论文研究","count":7,"items":[{"id":"aihot:cmsvptx2m061frovmjoavsi0l","title":"新兴多智能体系统的模式与问题","summary":"随着AI智能体在共享代码库、市场等社会系统中承担更多任务，智能体间的真实交互将激增，其交互量可能超过人机交互。Anthropic实验显示，协调式智能体群在2700万token运行中发现266个漏洞，远超独立并行方法的21个，但两者互补性明显。智能体虽擅长工具使用，但在长期协作与协调方面仍面临挑战。","url":"https://www.anthropic.com/research/multiagent-systems","source":"Hacker News 热门（buzzing.cc 中文翻译）","sourceType":"aihot","category":"论文研究","publishedAt":"2026-08-16T11:17:57.393Z","mpName":null,"num":2,"timeText":"昨天 19:17"},{"id":"aihot:cmsuaf2hr05zgroe0y1e7275v","title":"AI生成书籍正淹没亚马逊，并拉低人类作者的单书收入","summary":"一项对14，419本自出版电子书的分析显示，AI生成书籍正以数量而非质量挤占人类作者市场，即便未检测到AI文本的书籍，单书收入也在下滑。2023年Q1至2026年Q1，书目总量增长38.3倍，而季度收入仅增长8.9倍；在八个类型中，七个类型的无AI文本书籍单书收入下降。","url":"https://the-decoder.com/ai-generated-books-are-flooding-amazon-and-tanking-sales-for-human-authors","source":"The Decoder：AI News（RSS）","sourceType":"aihot","category":"论文研究","publishedAt":"2026-08-15T11:00:50.000Z","mpName":null,"num":4,"timeText":"8/15 19:00"},{"id":"aihot:cmsqu0nr604oeroz2rh6b6mqt","title":"新兴多智能体系统的模式与问题","summary":"Anthropic 研究指出，随着 AI 智能体在共享代码库、市场等社会系统中承担更多任务，智能体间交互量或将超过人机交互。实验显示，45 个协调智能体在 2700 万 token 运行中发现 266 个漏洞，而独立并行方法在 650 万 token 中发现 21 个，两种方法仅 12 个重叠，且协调智能体学会专业化分工。研究同时警示个体层面的良性行为怪癖可能叠加为意外的系统性失败。","url":"https://www.anthropic.com/research/multiagent-systems","source":"Anthropic：Research（发表成果 · 网页）","sourceType":"aihot","category":"论文研究","publishedAt":"2026-08-13T01:20:54.259Z","mpName":null,"num":26,"timeText":"8/13 09:20"},{"id":"aihot:cmsoxbh180a00rohdooafsmzp","title":"AMIE 研究医疗 AI 系统首次展示实时临床视频问诊能力","summary":"Google Research 与 Google DeepMind 推进医疗 AI 系统 AMIE，实现实时临床视频问诊，首次在此场景展示专家级 AI 能力。该系统基于 Gemini 和 Project Astra 构建，可解读视觉与听觉线索、引导虚拟体格检查并实时诊断推理。随机研究中，临床评估者对 AMIE 的病史采集、诊断准确性等核心能力给予好评，患者演员也更偏好视频体验。","url":"https://blog.google/innovation-and-ai/models-and-research/google-research/amie-video-consultations","source":"Google Blog：AI（RSS）","sourceType":"aihot","category":"论文研究","publishedAt":"2026-08-11T17:00:00.000Z","mpName":null,"num":46,"timeText":"8/12 01:00"},{"id":"aihot:cmsox86zv09u6rohdqr80wg0x","title":"Apple Silicon 与 macOS 虚拟机：借助 Llama.cpp 实现 11-16 倍的 LLM 推理加速","summary":"研究团队为 macOS 虚拟机中的 Metal 能力查询构建进程级兼容层，使 llama.cpp 能选用更新的 Metal 内核。在 M1 Ultra 上，TinyLlama 1.1B 的提示处理速度提升 11.08 倍、token 生成提升 16.36 倍，接近裸机性能的 98%；Gemma 4 12B 的提示处理与生成速度分别提升 7.20 倍和 14.54 倍。","url":"https://github.com/trycua/cua/blob/main/blog/gpu-passthrough-macos-vms.md","source":"Hacker News 热门（buzzing.cc 中文翻译）","sourceType":"aihot","category":"论文研究","publishedAt":"2026-08-11T16:41:17.281Z","mpName":null,"num":47,"timeText":"8/12 00:41"},{"id":"aihot:cmsqe6mat01bsroli3hw71nz7","title":"空货架还是丢钥匙？Google 研究：Recall 是参数化事实性的瓶颈","summary":"Google Research 提出知识画像框架，发现前沿 LLM（如 Gemini3、GPT-5）的事实编码接近饱和，但回忆（recall）能力不足，多数事实错误源于\"丢钥匙\"而非\"空货架\"。该框架将事实分为编码失败、回忆失败等五类画像，并配套推出 WikiProfile 基准，含 2，150 条维基百科事实，每条配 10 个问题，用于分别探测编码、回忆与识别能力。","url":"https://research.google/blog/empty-shelves-or-lost-keys-recall-is-the-bottleneck-for-parametric-factuality","source":"Google Research：Blog（网页）","sourceType":"aihot","category":"论文研究","publishedAt":"2026-08-11T16:00:00.000Z","mpName":null,"num":50,"timeText":"8/12 00:00"},{"id":"aihot:cmsopyoum028vrohd4dgeksz9","title":"统一 Radix 缓存：为混合模型前缀缓存构建单一树结构","summary":"LMSYS 团队提出 Unified Radix Cache，用单一 token 键控 radix 拓扑统一管理混合模型的 FULL、SWA 和 MAMBA 组件缓存，各组件独立执行路径、滑动窗口和检查点复用语义。","url":"https://www.lmsys.org/blog/2026-08-11-unified-radix-cache","source":"LMSYS：Blog（Chatbot Arena 团队）","sourceType":"aihot","category":"论文研究","publishedAt":"2026-08-11T13:51:45.827Z","mpName":null,"num":54,"timeText":"8/11 21:51"}]},{"label":"技巧与观点","count":19,"items":[{"id":"aihot:cmswesk6a0r2hrovml2edcl2c","title":"Qwen 3.8 27B 表现出色，但默认推理强度过高导致过度思考","summary":"阿里 Qwen 实验室发布 Apache 2 许可的 27B 参数视觉大模型 Qwen 3.8 27B，官方基准显示其超越前代 Qwen 3.6 27B 及闭源 Qwen 3.7-Plus。","url":"https://simonwillison.net/2026/Aug/16/qwen-38-27b","source":"Simon Willison 博客","sourceType":"aihot","category":"技巧与观点","publishedAt":"2026-08-16T22:00:39.000Z","mpName":null,"num":1,"timeText":"今天 06:00"},{"id":"aihot:cmssf79uf05rwrod09r9ocb2w","title":"蚂蚁百灵与 ASystem 团队打通单机 Agentic RL 后训练闭环","summary":"蚂蚁百灵与 ASystem 团队合作，用 Ling-3.0-tiny 和 AReno 在 DGX Spark 上跑通单机 Agentic RL 后训练闭环。以井字棋为最小验证任务，用 GSPO 算法训练 400 步后，rollout/rewards_mean 从约 -0.5 升至 0.4，response_len 降至约 850 tokens，工具调用与动作选择趋于稳定。","url":"https://mp.weixin.qq.com/s?__biz=MzkyODk2MDQwNw%3D%3D&mid=2247487525&idx=1&sn=b9def9117e34b45fce50ab76eeed726c","source":"公众号：蚂蚁百灵（Ling）","sourceType":"wechat","category":"技巧与观点","publishedAt":"2026-08-14T04:00:00.000Z","mpName":null,"num":12,"timeText":"8/14 12:00"},{"id":"aihot:cmst4z2qp05boro06ce7kxtgd","title":"2026年夏季开源模型生态观察：中国前沿模型规模领先，AMD与NVIDIA主导发布量","summary":"2026年1至8月，Hugging Face公开模型仓库从243万增至296万，但85.6%的模型下载量不足200次，1.5%的仓库占据99.2%下载量。中国实验室月度最大开源模型参数规模在754B至2.78万亿之间，美国实验室七个月中五个月低于130B。AMD与NVIDIA各发布超200个新模型仓库，成为发布开源模型最多的机构。","url":"https://huggingface.co/blog/state-of-open-models-summer-2026","source":"Hugging Face：Blog（RSS）","sourceType":"aihot","category":"技巧与观点","publishedAt":"2026-08-14T00:00:00.000Z","mpName":null,"num":13,"timeText":"8/14 08:00"},{"id":"aihot:cmss6lsb701tsroib0kxz9q8q","title":"从0到1带你速通DeepSeek Harness。","summary":"","url":"https://mp.weixin.qq.com/s?__biz=MzIyMzA5NjEyMA%3D%3D&mid=2647685238&idx=1&sn=c3159dba0dd5a141f8dd726fd474e6e2","source":"公众号：数字生命卡兹克","sourceType":"wechat","category":"技巧与观点","publishedAt":"2026-08-13T23:58:00.000Z","mpName":null,"num":14,"timeText":"8/14 07:58"},{"id":"aihot:cmss20h5g02uxroh6q6r1nqu9","title":"Claude 接管应用日常维护：388 个 PR 的实践","summary":"Boris Cherny 尝试让 Claude 接管其应用的日常维护，通过 Slack 频道运行崩溃模糊测试、重复代码统一、死代码移除等日常任务。数周内自动开出 388 个 PR，其中 180 个经 Claude Code Review 和人工审核后合并。Claude 通常一次就能改对，出错时可通过调整例程次日改进。","url":"https://x.com/bcherny/status/2088014489438621990","source":"X：Boris Cherny (@bcherny)","sourceType":"aihot","category":"技巧与观点","publishedAt":"2026-08-13T21:27:02.000Z","mpName":null,"num":15,"timeText":"8/14 05:27"},{"id":"aihot:cmsruetoy027hrozeecu4ixrc","title":"GPT-5.6 构建者指南：如何以更低成本实现前沿智能体性能","summary":"GPT-5.6 模型家族以更低成本实现前沿级智能体性能，并新增推理持久化、原生多智能体编排和程序化工具调用等 API 能力。在 ARC-AGI-3 上，启用保留推理和压缩后，Sol 得分从 13.3% 跃升至 38.3%，且输出 token 减少约 6 倍。Luna 在 BrowseComp 上以 84.04% 的得分追平 GPT-5.5（84.36%），成本从 $33.27 降至 $1.33。","url":"https://openai.com/index/builders-guide-to-gpt-5-6","source":"OpenAI：官网动态（RSS · 排除企业/客户案例）","sourceType":"aihot","category":"技巧与观点","publishedAt":"2026-08-13T11:00:00.000Z","mpName":null,"num":23,"timeText":"8/13 19:00"},{"id":"aihot:cmsqq3bc001snro7vo8picfbp","title":"DeepSeek V4 Pro与Grok 4.6同日发布，双双逼近Claude Fable 5体验","summary":"DeepSeek V4 Pro正式版与Grok 4.6在2小时内先后发布，均为1.6T/1.5T参数模型，逼近Claude Fable 5体验。","url":"https://mp.weixin.qq.com/s?__biz=MzIyMzA5NjEyMA%3D%3D&mid=2647685175&idx=1&sn=64c383b5b757945397894270c5f38301","source":"公众号：数字生命卡兹克","sourceType":"wechat","category":"技巧与观点","publishedAt":"2026-08-12T22:22:28.000Z","mpName":null,"num":27,"timeText":"8/13 06:22"},{"id":"aihot:cmsqgeo2e02cvroxvpnycl2zi","title":"AutoGPT 如何用 AGENTS.md 和技能门控管理 AI 生成的拉取请求","summary":"AutoGPT 维护者发现，AI 智能体不会主动阅读文档，因此将指令放在 AGENTS.md 和技能文件中，并置于代码目录旁。他们通过强制 PR 模板、测试计划、CI 覆盖率门槛和 CLA 签名等门控机制，将智能体提交的 PR 从\"不可用\"转变为\"可用但不符合路线图\"。其中 CLA 签名因需浏览器和 OAuth 流程，被用作区分人类与智能体的\"人类探测器\"。","url":"https://github.blog/open-source/maintainers/your-contributors-are-ai-first-now-is-your-project","source":"GitHub Blog","sourceType":"aihot","category":"技巧与观点","publishedAt":"2026-08-12T18:00:08.000Z","mpName":null,"num":28,"timeText":"8/13 02:00"},{"id":"aihot:cmsq5saxh051mro2e90h10exo","title":"我写了一本 AI 教科书--AI 还要多久才能写得更好？","summary":"作者在完成一本 RLHF 教科书后反思，LLM 在长文非虚构写作上进展停滞，GPT 4.5 和 Kimi K2 等写作强模型已显老旧，而编码、数学等任务已接近超人水平。模型能改错字、做编辑，但组织整章内容时仍混乱且易出错，作者认为这阻碍了模型自主解决开放科学问题。","url":"https://www.interconnects.ai/p/i-wrote-an-ai-textbook-how-long-until","source":"Nathan Lambert：Interconnects（RSS）","sourceType":"aihot","category":"技巧与观点","publishedAt":"2026-08-12T13:01:16.000Z","mpName":null,"num":31,"timeText":"8/12 21:01"},{"id":"aihot:cmspc30un0e4xrorts1kax9zg","title":"零基础用户半天上手AI的12步实操流程","summary":"文章给出一套零基础用户半天上手AI的12步实操流程：准备内存不低于16G的电脑，订阅ChatGPT并安装Codex或使用WorkBuddy，用语音输入法以【背景、痛点、需求】框架向AI交代任务，经苏格拉底提问澄清需求后投喂文件让AI直接完成，最后沉淀为可复用Skill。文中建议Codex选GPT-5.6 Sol最高模型，WorkBuddy选Kimi K3。","url":"https://mp.weixin.qq.com/s?__biz=MzIyMzA5NjEyMA%3D%3D&mid=2647685084&idx=1&sn=0899296dbc140eeb745f7a99f9d5ed9c","source":"公众号：数字生命卡兹克","sourceType":"wechat","category":"技巧与观点","publishedAt":"2026-08-12T00:08:00.000Z","mpName":null,"num":35,"timeText":"8/12 08:08"},{"id":"aihot:cmsp0g9v20242rort4zh7mzx0","title":"将 GitHub Copilot 置于中间人（MitM）代理之后后，我学到了什么","summary":"作者通过 mitmproxy 对 VS Code 中的 GitHub Copilot 进行中间人代理拦截，逆向分析其网络流量与内部架构。文章指出这些 AI 应用普遍基于 Electron 构建，共享相似的网络栈，因此探测结果可迁移至其他同类应用。作者借此揭示了 Copilot 的运行时行为，并分享了配置代理的具体步骤。","url":"https://www.lighthousenewsletter.com/p/i-put-github-copilot-behind-a-mitm","source":"Hacker News 热门（buzzing.cc 中文翻译）","sourceType":"aihot","category":"技巧与观点","publishedAt":"2026-08-11T18:32:57.961Z","mpName":null,"num":42,"timeText":"8/12 02:32"},{"id":"aihot:cmsowxh6d09rrrohdkhpckhpi","title":"Ryan Green const SECTION_COLORS = {"模型发布/更新":"#6366f1","产品发布/更新":"#10b981","AI泛娱乐新闻":"#ec4899","行业动态":"#f59e0b","论文研究":"#f43f5e","技巧与观点":"#06b6d4"};
const API_BASE = "https://aihot.virxact.com";
let state = { view:"daily", src:null, q:"" };

function esc(s){return (s||"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ================= 功能2：追踪存储层（AGENT.md 规范：localStorage + file:// 降级内存） ================= */
const TRACK_KEY = "aihot_tracked";
let memStore = null, useMem = false;
function loadTracked(){
  try { return JSON.parse(localStorage.getItem(TRACK_KEY) || "{}"); }
  catch(e){ useMem = true; return memStore || {}; }
}
function saveTracked(t){
  if(useMem){ memStore = t; return; }
  try { localStorage.setItem(TRACK_KEY, JSON.stringify(t)); }
  catch(e){ useMem = true; memStore = t; }
}
let tracked = loadTracked();

/* 全局条目索引：id(带 aihot: 前缀) -> item，供追踪时回查原始数据 */
const ID_MAP = {};
["daily","weekly"].forEach(v => DATA[v].sections.forEach(s => s.items.forEach(i => { ID_MAP[i.id] = i; })));

/* ================= 功能2：自动提词（去停用词，取权重最高的 2-3 个实体词） ================= */
const STOP_WORDS = new Set(["的","了","在","和","与","及","发布","推出","开源","上线","新增","支持","全面","正式","全新","重磅","升级","更新","宣布","完成","开放","首发","最新","首个","模型","系统","平台","功能","服务","项目","团队","公司","官方","版本","相关","进行","实现","提供","包括"]);
function extractKeywords(item){
  const text = (item.title||"") + " " + (item.summary||"");
  const eng = text.match(/[A-Za-z][A-Za-z0-9]*(?:[.\-][A-Za-z0-9]+)*(?:\s+[A-Za-z0-9]+)?/g) || [];
  const chn = text.match(/[\u4e00-\u9fa5]{2,6}/g) || [];
  const score = {};
  eng.concat(chn).forEach(w=>{
    if(w.length < 2 || STOP_WORDS.has(w)) return;
    score[w] = (score[w]||0) + w.length + 1;
  });
  return Object.keys(score).sort((a,b)=>score[b]-score[a]).slice(0,3);
}

/* ================= 功能2：实时拉取 aihot API（后台静默，失败降级快照） ================= */
let liveItems = null, liveStatus = "idle"; /* idle | loading | ok | fail */
async function fetchLive(){
  liveStatus = "loading";
  try {
    let items = [], cursor = null;
    for(let i=0;i<3;i++){
      const url = API_BASE + "/api/public/items?limit=50" + (cursor ? "&cursor=" + encodeURIComponent(cursor) : "");
      const r = await fetch(url);
      if(!r.ok) throw new Error("HTTP " + r.status);
      const d = await r.json();
      items = items.concat(d.items || []);
      if(!d.hasNext || !d.nextCursor) break;
      cursor = d.nextCursor;
    }
    liveItems = items; liveStatus = "ok";
  } catch(e){ liveItems = null; liveStatus = "fail"; }
  applyUpdates();
}
function snapshotItems(){
  const out = [];
  ["daily","weekly"].forEach(v => DATA[v].sections.forEach(s => s.items.forEach(i => out.push(i))));
  return out;
}
const rawId = id => String(id||"").replace(/^aihot:/,"");
function fmtLiveTime(iso){
  try{
    const d = new Date(new Date(iso).getTime() + 8*3600*1000);
    const now = new Date(Date.now() + 8*3600*1000);
    const hm = String(d.getUTCHours()).padStart(2,"0") + ":" + String(d.getUTCMinutes()).padStart(2,"0");
    const sameDay = d.toDateString() === now.toDateString();
    const yest = new Date(now.getTime() - 86400000).toDateString() === d.toDateString();
    if(sameDay) return "今天 " + hm;
    if(yest) return "昨天 " + hm;
    return (d.getUTCMonth()+1) + "/" + d.getUTCDate() + " " + hm;
  }catch(e){ return ""; }
}

/* ================= 功能2：匹配相关进展 + 同条更新检测 ================= */
const matchCache = {}; /* id -> {changed:bool, related:[...]} */
function computeMatches(){
  const pool = (liveItems && liveItems.length) ? liveItems : snapshotItems().map(i=>({id:rawId(i.id), title:i.title, summary:i.summary, url:i.url, source:i.source, publishedAt:i.publishedAt}));
  Object.keys(tracked).forEach(id=>{
    const tr = tracked[id];
    const kws = tr.keywords || [];
    const related = [];
    const rid = rawId(id);
    pool.forEach(it=>{
      if(rawId(it.id) === rid) return;
      const hay = ((it.title||"") + " " + (it.summary||"")).toLowerCase();
      if(kws.some(k=>hay.includes(k.toLowerCase()))) related.push(it);
    });
    related.sort((a,b)=>new Date(b.publishedAt||0) - new Date(a.publishedAt||0));
    const cur = pool.find(it=>rawId(it.id)===rid);
    const changed = !!(cur && cur.summary && tr.lastSummary && cur.summary !== tr.lastSummary);
    matchCache[id] = { changed, related: related.slice(0,3) };
    tr.relatedMatches = matchCache[id].related.map(r=>({id:r.id,title:r.title,url:r.url,source:r.source,publishedAt:r.publishedAt}));
  });
  saveTracked(tracked);
}
function applyUpdates(){ computeMatches(); render(); }

/* ================= 功能2：追踪 / 取消追踪 ================= */
function toggleTrack(id){
  if(tracked[id]){
    delete tracked[id]; delete matchCache[id];
  } else {
    const it = ID_MAP[id]; if(!it) return;
    tracked[id] = {
      title: it.title, summary: it.summary, category: it.category, url: it.url,
      source: it.source, sourceType: it.sourceType || "aihot",
      publishedAt: it.publishedAt || "", timeText: it.timeText || "",
      trackedAt: new Date().toISOString(), lastSummary: it.summary,
      keywords: extractKeywords(it), relatedMatches: []
    };
    computeMatches();
  }
  saveTracked(tracked); render();
}
function clearTracked(){
  if(!Object.keys(tracked).length) return;
  if(!confirm("确定清空全部追踪的新闻吗？")) return;
  tracked = {}; saveTracked(tracked); render();
}

/* ================= 渲染：卡片 HTML（主视图与收藏夹复用） ================= */
function updatePanelHTML(id){
  const m = matchCache[id];
  if(!m || (!m.related.length && !m.changed)) return "";
  const rows = m.related.map(r=>
    '<a class="up-item" href="' + esc(r.url) + '" target="_blank" rel="noopener noreferrer">' + esc(r.title) +
    '<span class="up-time">' + esc(r.source || "") + " · " + fmtLiveTime(r.publishedAt) + '</span></a>'
  ).join("");
  const changedNote = m.changed ? '<div style="color:#fdba74;padding:4px 0">该新闻摘要已更新（有新进展写回原条目）</div>' : '';
  return '<button class="update-badge" type="button">UPDATE</button>' +
    '<div class="update-panel"><div class="up-title">相关最新进展' + (liveStatus==="ok" ? "（实时）" : "（快照数据）") + '</div>' + changedNote + rows + '</div>';
}
function cardHTML(i, n, ctx){
  const wx = i.sourceType==="wechat";
  const isTracked = !!tracked[i.id];
  const m = matchCache[i.id];
  const hasUpdate = isTracked && m && (m.related.length || m.changed);
  const badge = ctx==="fav" ? updatePanelHTML(i.id) : (hasUpdate ? updatePanelHTML(i.id) : "");
  const title = i.url
    ? '<a href="' + esc(i.url) + '" target="_blank" rel="noopener noreferrer">' + esc(i.title) + '</a>'
    : esc(i.title);
  const read = i.url
    ? '<a class="read" href="' + esc(i.url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
    : '<span class="read" style="opacity:.55">原文待核验</span>';
  return '<article class="card ' + (wx?'wx':'') + ' ' + (hasUpdate?'updated':'') + '" style="--c:' + (SECTION_COLORS[i.category]||'#64748b') + '">' +
    badge +
    '<div class="ct">' + (ctx==="fav" ? '' : '<span class="num">' + String(n).padStart(2,'0') + '</span>') +
      '<span class="' + (wx?'source wx':'source') + '">' + esc(i.source) + '</span>' +
      '<span class="time">' + esc(i.timeText || fmtLiveTime(i.publishedAt)) + '</span></div>' +
    '<h3 class="title">' + title + '</h3>' +
    '<p class="summary">' + esc(i.summary) + '</p>' +
    (ctx==="fav" ? '<div class="fav-meta">追踪于 ' + esc(String(tracked[i.id].trackedAt||"").slice(0,10)) +
      ' · 关键词：' + ((tracked[i.id].keywords||[]).map(k=>'<span class="kw-chip">'+esc(k)+'</span>').join("") || "无") + '</div>' : '') +
    '<div class="card-foot">' + read +
      (ctx==="fav"
        ? '<button class="untrack-btn" type="button" data-id="' + esc(i.id) + '">取消追踪 ✕</button>'
        : '<button class="track-btn ' + (isTracked?'on':'') + '" type="button" data-id="' + esc(i.id) + '">' + (isTracked ? "已追踪 ✓" : "☆ 追踪") + '</button>') +
    '</div></article>';
}

/* ================= 渲染主流程 ================= */
function render(){
  const favN = Object.keys(tracked).length;
  document.getElementById("favCount").textContent = favN;
  if(state.view==="fav"){ renderFav(); return; }
  const p = DATA[state.view];
  document.getElementById("title").textContent = state.view==="daily" ? "AI 日报" : "AI 周报";
  document.getElementById("meta").innerHTML = `${p.range.label} · 共 <b>${p.total}</b> 条 · 六版块 · 生成于 北京时间 ${p.generatedAt.slice(11,16)}`;
  const lead = document.getElementById("lead");
  if(state.view==="daily" && p.lead){ lead.style.display="block"; lead.innerHTML = `<span class="tag">今日头条</span>${esc(p.lead)}`; }
  else lead.style.display="none";
  document.getElementById("mpnote").textContent = p.mpStatus.note ? "公众号：" + p.mpStatus.note : "";
  /* 功能1：统计卡片 count>0 可点击跳转，count=0 置灰 */
  document.getElementById("stats").innerHTML = p.stats.map(s=>{
    const clickable = s.count > 0;
    return `<div class="stat ${clickable?'clickable':'disabled'}" data-label="${esc(s.label)}" style="--c:${SECTION_COLORS[s.label]||'#64748b'}" ${clickable?'title="点击跳转到该版块"':''}><span class="stat-n">${s.count}</span><span class="stat-l">${s.label}</span></div>`;
  }).join("");
  const q = state.q.toLowerCase();
  let sectionsHtml = ""; let total=0;
  p.sections.forEach(sec=>{
    let items = sec.items;
    if(state.src==="wechat") items = items.filter(i=>i.sourceType==="wechat");
    if(q) items = items.filter(i=>(i.title||"").toLowerCase().includes(q)||(i.summary||"").toLowerCase().includes(q));
    if(!items.length) return;
    let n=0; const cards = items.map(i=>{ n++; total++; return cardHTML(i, n, "main"); }).join("");
    sectionsHtml += `<section class="block" data-label="${esc(sec.label)}" style="--c:${SECTION_COLORS[sec.label]||'#64748b'}">
      <header class="bh"><span class="dot"></span><h2>${sec.label}</h2><span class="c">${items.length} 条</span></header>
      <div class="grid">${cards}</div></section>`;
  });
  document.getElementById("sections").innerHTML = sectionsHtml || `<p style="color:var(--mut)">无匹配内容。</p>`;
  document.getElementById("ftotal").textContent = total;
}
function renderFav(){
  const q = state.q.toLowerCase();
  let list = Object.keys(tracked).map(id=>({id, ...tracked[id]}));
  list.sort((a,b)=>(b.trackedAt||"").localeCompare(a.trackedAt||""));
  if(q) list = list.filter(t=>(t.title||"").toLowerCase().includes(q)||(t.summary||"").toLowerCase().includes(q));
  const status = document.getElementById("favStatus");
  if(liveStatus==="loading") status.textContent = "正在获取最新动态…";
  else if(liveStatus==="ok") status.textContent = "最新动态已更新（实时 API）";
  else if(liveStatus==="fail") status.textContent = "实时接口不可用，已按快照数据匹配";
  else status.textContent = "";
  const box = document.getElementById("favList");
  if(!list.length){
    box.innerHTML = '<p style="color:var(--mut)">还没有追踪任何新闻。回到日报/周报，点击卡片上的「☆ 追踪」即可收藏并自动跟踪最新进展。</p>';
    return;
  }
  box.innerHTML = list.map(t=>cardHTML(t, 0, "fav")).join("");
}

/* ================= 功能1：点击统计卡片跳转到对应版块 ================= */
function jumpToSection(label){
  const el = document.querySelector('.block[data-label="' + label + '"]');
  if(!el) return;
  el.scrollIntoView({behavior:"smooth", block:"start"});
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
}

/* ================= 事件绑定（委托，避免重渲染后失效） ================= */
document.addEventListener("click", e=>{
  const tb = e.target.closest(".track-btn");
  if(tb){ toggleTrack(tb.dataset.id); return; }
  const ub = e.target.closest(".untrack-btn");
  if(ub){ toggleTrack(ub.dataset.id); return; }
  const bd = e.target.closest(".update-badge");
  if(bd){ const panel = bd.parentElement.querySelector(".update-panel"); if(panel) panel.classList.toggle("open"); return; }
  const st = e.target.closest(".stat.clickable");
  if(st){ jumpToSection(st.dataset.label); return; }
});
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  t.classList.add("active"); state.view=t.dataset.view;
  const fav = state.view==="fav";
  document.getElementById("favView").style.display = fav ? "" : "none";
  document.getElementById("sections").style.display = fav ? "none" : "";
  document.getElementById("hero").style.display = fav ? "none" : "";
  render();
});
document.querySelector(".fchip.wx").onclick=function(){ this.classList.toggle("on"); state.src=this.classList.contains("on")?"wechat":null; render(); };
document.getElementById("q").oninput=function(){ state.q=this.value; render(); };
document.getElementById("favClear").onclick = clearTracked;

render();
fetchLive(); /* 开页即后台拉取最新动态，完成后自动更新追踪徽章 */
</script>
</body>
</html>
