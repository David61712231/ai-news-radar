<style>
  :root{--bg:#0b0e14;--bg2:#11151f;--card:#161b27;--card2:#1b2230;--txt:#e6e9ef;--mut:#9aa4b2;--line:#222a38;--accent:#6366f1;--wx:#07c160;--up:#f97316;--fav:#fcd34d;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(1200px 600px at 80% -10%,#1a2138 0%,var(--bg) 55%) fixed;color:var(--txt);line-height:1.6;padding-bottom:64px}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px}
  .hero{padding:40px 0 22px}
  .kicker{color:var(--mut);font-size:13px;letter-spacing:.18em;text-transform:uppercase}
  .hero h1{font-size:clamp(26px,5vw,42px);font-weight:800;margin:8px 0 4px;background:linear-gradient(90deg,#a5b4fc,#67e8f9,#fcd34d);-webkit-background-clip:text;background-clip:text;color:transparent}
  .meta{color:var(--mut);font-size:14px;margin-top:4px}.meta b{color:var(--txt)}
  .lead{margin-top:10px;font-size:14px;color:#cbd5e1;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:10px 14px}
  .lead .tag{color:var(--accent);font-weight:700;margin-right:6px}
  .stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-top:20px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;border-top:3px solid var(--c);transition:.18s}
  .stat-n{display:block;font-size:24px;font-weight:800;color:var(--c)}
  .stat-l{display:block;font-size:12px;color:var(--mut);margin-top:3px}
  /* 功能1：可点击的统计卡片（count>0），count=0 置灰不可点 */
  .stat.clickable{cursor:pointer}
  .stat.clickable:hover{transform:translateY(-2px);border-color:var(--c);box-shadow:0 8px 24px -12px var(--c)}
  .stat.disabled{opacity:.45;cursor:default}
  /* 功能1：版块跳转高亮闪烁 */

  @keyframes secflash{0%,100%{box-shadow:none}15%,45%{box-shadow:0 0 0 3px var(--c),0 0 40px -8px var(--c);border-radius:14px}}

  .tab.active{color:#0b0e14;background:linear-gradient(90deg,#a5b4fc,#67e8f9);border-color:transparent}
  /* 功能2：收藏 tab */
  .tab.fav{border-color:rgba(252,211,77,.4);color:var(--fav)}
  .tab.fav.active{color:#0b0e14;background:linear-gradient(90deg,#fcd34d,#f59e0b)}
  .tab.fav .fav-n{font-size:11px;background:rgba(252,211,77,.18);border-radius:999px;padding:1px 7px;margin-left:5px}
  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
  .fchip{font-size:12.5px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card2);color:var(--mut);cursor:pointer;transition:.18s}
  .fchip.on{color:var(--txt);border-color:var(--accent);background:#1e2436}
  .fchip.wx.on{color:#062; border-color:var(--wx);background:#0c2a18}
  #q{background:var(--card2);border:1px solid var(--line);border-radius:999px;color:var(--txt);padding:6px 12px;font-size:12.5px;outline:none}
  .block{margin-bottom:36px;scroll-margin-top:64px}
  .bh{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:9px;border-bottom:1px solid var(--line)}
  .bh .dot{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c)}
  .bh h2{font-size:19px;font-weight:700}.bh .c{margin-left:auto;font-size:13px;color:var(--mut)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  .card{position:relative;background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:16px;padding:17px 17px 15px;display:flex;flex-direction:column;min-height:165px;transition:.18s;overflow:hidden}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c);opacity:.85}
  .card.wx::before{background:var(--wx)}
  .card:hover{transform:translateY(-3px);border-color:var(--c);box-shadow:0 10px 30px -12px var(--c)}
  .card.wx:hover{border-color:var(--wx);box-shadow:0 10px 30px -12px var(--wx)}
  /* 功能2：有更新的追踪卡片橙色高亮边框 */
  .card.updated{border-color:var(--up)}
  .ct{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .num{font-size:12.5px;font-weight:800;color:#0b0e14;background:#a5b4fc;border-radius:8px;padding:2px 8px;min-width:32px;text-align:center}
  .card.wx .num{background:#6ee7b7}

  .time{margin-left:auto;font-size:11px;color:var(--mut)}
  .title{font-size:16px;font-weight:700;line-height:1.4;margin-bottom:7px}
  .title a{color:var(--txt);text-decoration:none}.title a:hover{color:#a5b4fc;text-decoration:underline;text-decoration-color:var(--accent)}
  .card.wx .title a:hover{color:#6ee7b7}
  .summary{font-size:13px;color:var(--mut);flex:1;margin-bottom:13px}
  /* 功能2：卡片底部行（阅读原文 + 追踪按钮） */
  .card-foot{display:flex;align-items:center;gap:8px;margin-top:auto}
  .read{font-size:12.5px;font-weight:600;color:#a5b4fc;text-decoration:none;border:1px solid var(--accent);border-radius:9px;padding:5px 11px;transition:.18s}
  .read:hover{background:var(--accent);color:#0b0e14}
  .card.wx .read{color:#6ee7b7;border-color:var(--wx)}.card.wx .read:hover{background:var(--wx);color:#04130b}
  .track-btn{margin-left:auto;font-size:12px;font-weight:600;color:var(--mut);background:transparent;border:1px solid var(--line);border-radius:9px;padding:5px 11px;cursor:pointer;transition:.18s;white-space:nowrap}
  .track-btn:hover{color:var(--fav);border-color:var(--fav)}
  .track-btn.on{color:#0b0e14;background:var(--fav);border-color:var(--fav)}
  /* 功能2：UPDATE 徽章（橙红渐变 + 脉冲），点击展开相关进展 */
  .update-badge{position:absolute;top:10px;right:10px;font-size:10.5px;font-weight:800;letter-spacing:.06em;color:#fff;background:linear-gradient(90deg,#f97316,#ef4444);border:none;border-radius:999px;padding:3px 10px;cursor:pointer;animation:uppulse 1.6s infinite;z-index:2}
  @keyframes uppulse{0%,100%{box-shadow:0 0 0 0 rgba(249,115,22,.55)}50%{box-shadow:0 0 0 7px rgba(249,115,22,0)}}
  .update-panel{display:none;margin:0 0 10px;border:1px solid #7c2d12;background:#1c1310;border-radius:10px;padding:8px 11px;font-size:12px}
  .update-panel.open{display:block}
  .update-panel .up-title{color:#fdba74;font-weight:700;margin-bottom:5px}
  .up-item{display:block;color:#cbd5e1;text-decoration:none;padding:4px 0;border-top:1px dashed #3f2212;line-height:1.45}
  .up-item:first-of-type{border-top:none}
  .up-item:hover{color:#fdba74}
  .up-item .up-time{color:var(--mut);font-size:11px;margin-left:6px;white-space:nowrap}
  /* 功能2：收藏夹视图 */
  .fav-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .fav-head h2{font-size:19px;font-weight:700}
  .fav-status{font-size:12.5px;color:var(--mut)}
  .fav-clear{margin-left:auto;font-size:12px;font-weight:600;color:#fca5a5;background:transparent;border:1px solid #7f1d1d;border-radius:9px;padding:5px 12px;cursor:pointer;transition:.18s}
  .fav-clear:hover{background:#7f1d1d;color:#fee2e2}
  .fav-grid{display:grid;grid-template-columns:1fr;gap:14px}
  .fav-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--mut);margin:6px 0 4px}
  .kw-chip{font-size:11px;color:#c4b5fd;background:rgba(139,92,246,.14);border:1px solid rgba(139,92,246,.35);border-radius:999px;padding:1px 8px}
  .untrack-btn{font-size:11.5px;font-weight:600;color:var(--mut);background:transparent;border:1px solid var(--line);border-radius:8px;padding:3px 10px;cursor:pointer;transition:.18s;white-space:nowrap}
  .untrack-btn:hover{color:#fca5a5;border-color:#7f1d1d}
  .mpnote{margin:10px 0 0;font-size:12.5px;color:var(--wx)}
  .foot{border-top:1px solid var(--line);margin-top:22px;padding-top:18px;color:var(--mut);font-size:12.5px;text-align:center}
  .foot a{color:#67e8f9;text-decoration:none}
  @media(max-width:720px){.stats{grid-template-columns:repeat(3,1fr)}.hero{padding:30px 0 16px}.filters{margin-left:0;width:100%}}
</style>
</head>

51.977Z","mpName":null,"num":4,"timeText":"今天 04:15"}]},{"label":"AI泛娱乐新闻","count":0,"items":[]},{"label":"行业动态","count":0,"items":[]},{"label":"论文研究","count":2,"items":[{"id":"aihot:cmsqu0nr604oeroz2rh6b6mqt","title":"新兴多智能体系统的模式与问题","summary":"Anthropic 研究指出，随着 AI 智能体在共享代码库、市场等社会系统中承担更多任务，智能体间交互量或将超过人机交互。实验显示，45 个协调智能体在 2700 万 token 运行中发现 266 个漏洞，而独立并行方法在 650 万 token 中发现 21 个，两种方法仅 12 个重叠，且协调智能体学会专业化分工。研究同时警示个体层面的良性行为怪癖可能叠加为意外的系统性失败。","url":"https://www.anthropic.com/research/multiagent-systems","source":"Anthropic：Research（发表成果 · 网页）","sourceType":"aihot","category":"论文研究","publishedAt":"2026-08-13T01:20:54.259Z","mpName":null,"num":2,"timeText":"今天 09:20"},{"id":"aihot:cmsqe6mat01bsroli3hw71nz7","title":"空货架还是丢钥匙？Google 研究：Recall 是参数化事实性的瓶颈","summary":"Google Research 提出知识画像框架，发现前沿 LLM（如 Gemini3、GPT-5）的事实编码接近饱和，但回忆（recall）能力不足，多数事实错误源于\"丢钥匙\"而非\"空货架\"。该框架将事实分为编码失败、回忆失败等五类画像，并配套推出 WikiProfile 基准，含 2，150 条维基百科事实，每条配 10 个问题，用于分别探测编码、回忆与识别能力。","url":"https://research.google/blog/empty-shelves-or-lost-keys-recall-is-the-bottleneck-for-parametric-factuality","source":"Google Research：Blog（网页）","sourceType":"aihot","category":"论文研究","publishedAt":"2026-08-12T17:57:36.369Z","mpName":null,"num":6,"timeText":"今天 01:57"}]},{"label":"技巧与观点","count":2,"items":[{"id":"aihot:cmsqq3bc001snro7vo8picfbp","title":"DeepSeek V4 Pro与Grok 4.6同日发布，双双逼近Claude Fable 5体验","summary":"DeepSeek V4 Pro正式版与Grok 4.6在2小时内先后发布，均为1.6T/1.5T参数模型，逼近Claude Fable 5体验。","url":"https://mp.weixin.qq.com/s?__biz=MzIyMzA5NjEyMA%3D%3D&mid=2647685175&idx=1&sn=64c383b5b757945397894270c5f38301","source":"公众号：数字生命卡兹克","sourceType":"wechat","category":"技巧与观点","publishedAt":"2026-08-12T22:22:28.000Z","mpName":null,"num":3,"timeText":"今天 06:22"},{"id":"aihot:cmsqgeo2e02cvroxvpnycl2zi","title":"AutoGPT 如何用 AGENTS.md 和技能门控管理 AI 生成的拉取请求","summary":"AutoGPT 维护者发现，AI 智能体不会主动阅读文档，因此将指令放在 AGENTS.md 和技能文件中，并置于代码目录旁。他们通过强制 PR 模板、测试计划、CI 覆盖率门槛和 CLA 签名等门控机制，将智能体提交的 PR 从\"不可用\"转变为\"可用但不符合路线图\"。其中 CLA 签名因需浏览器和 OAuth 流程，被用作区分人类与 enAI 推出 GPT-5.6-Cyber，面向授权漏洞研究的网络安全专用模型","summary":"OpenAI 发布网络安全专用模型 GPT-5.6-Cyber，可通过 Daybreak Red 获取，用于授权的漏洞研究、漏洞验证和安全测试。该模型旨在应对网络防御窗口不断收窄的挑战，为安全研究人员提供专门工具。","url":"https://openai.com/index/expanding-daybreak-as-the-cyber-defense-window-narrows","source":"OpenAI：官网动态（RSS · 排除企业/客户案例）","sourceType":"aihot","category":"模型发布/更新","publishedAt":"2026-08-10T10:00:00.000Z","mpName":null,"num":50,"timeText":"8/10 18:00"},{"id":"aihot:cmsmhbu4w0338ronxh92vej2u","title":"NVIDIA 发布 NemotronLabs VoiceChat 11B：开源全双工语音模型，支持约 450 毫秒轮换与实时工具调用","summary":"NVIDIA 发布开源端到端全双工语音对话模型 NemotronLabs VoiceChat 11B，在统一网络中完成流式语音理解与生成，实测轮换延迟 448 毫秒。该模型为首个支持对话中工具调用的开源全双工模型，通过独立输出通道及预置\"保持\"话术避免 API 执行期间冷场。权重与容器已公开，但仅限研究用途，需单张 80 GB 显存 GPU，目前无托管 API。","url":"https://www.marktechpost.com/2026/08/09/nvidia-releases-nemotronlabs-voicechat-11b-an-open-full-duplex-speech-to-speech-model-with-450-ms-turn-taking-and-live-tool-calling","source":"MarkTechPost（RSS）","sourceType":"aihot","category":"模型发布/更新","publishedAt":"2026-08-09T23:58:34.000Z","mpName":null,"num":58,"timeText":"8/10 07:58"},{"id":"aihot:cmsixbbry1x0qronkhbbjukhr","title":"蚂蚁百灵开源 Ling-3.0-flash：124B 总参数 MoE 模型，支持 API、单机与高性能三种部署","summary":"蚂蚁百灵正式开源新一代原生混合推理模型 Ling-3.0-flash，采用 124B 总参数、5.1B 激活参数的 MoE 架构，并提供 FP8、FP4、INT4 等多个版本。","url":"https://mp.weixin.qq.com/s?__biz=MzkyODk2MDQwNw%3D%3D&mid=2247487457&idx=1&sn=24ad4a355d81291e53fbe680ca987112","source":"公众号：蚂蚁百灵（Ling）","sourceType":"wechat","category":"模型发布/更新","publishedAt":"2026-08-07T12:02:16.000Z","mpName":null,"num":84,"timeText":"8/7 20:02"},{"id":"aihot:cmsilvone1jf1ronk6fs8o4d4","title":"谷歌推出 WeatherNext 气旋模型，AI 高精度预报飓风平均提前 24 小时","summary":"谷歌 DeepMind 联合多家机构推出 WeatherNext Cyclones 气旋预测模型，在路径、强度和风场结构预测精度上达到业界领先。该模型将有效预报时长从 2 天延长至 3 天，平均提前 24 小时，预测量级约相当于 10 年气象进展。","url":"https://www.ithome.com/0/986/951.htm","source":"IT之家（RSS）","sourceType":"aihot","category":"模型发布/更新","publishedAt":"2026-08-07T06:11:01.000Z","mpName":null,"num":90,"timeText":"8/7 14:11"}]},{"label":"产品发布/ 8:00"},{"id":"aihot:cmsp3o23e04vnrortt7twvx4v","title":"Mojo 1.0 正式发布：为生态系统增长提供稳定基础","summary":"Mojo 语言正式发布 1.0 版本，提供稳定、可用于生产环境的语言基础，自 2023 年首次发布以来已发展成通用语言。自开源标准库以来，近 200 名贡献者合入超 1，100 个拉取请求，改动超 200，000 行代码。","url":"https://www.modular.com/blog/modular-26-5-mojo-1-0-is-here","source":"Hacker News 热门（buzzing.cc 中文翻译）","sourceType":"aihot","category":"产品发布/更新","publishedAt":"2026-08-11T19:52:14.184Z","mpName":null,"num":17,"timeText":"昨天 03:52"},{"id":"aihot:cmsp1lufu03a9rortoc0ci36q","title":"Runway Seedance 2.5 上线，支持50角色参考","summary":"完整阵容，完整曲目，一次生成一个。\n\nSeedance 2.5 已在 Runway 上线，支持 50 个独特角色参考，以及最长 30 秒、与音乐同步的片段。点击下方链接即可开始使用。","url":"https://x.com/runwayml/status/2087251184658657346","source":"X：Runway (@runwayml)","sourceType":"aihot","category":"产品发布/更新","publishedAt":"2026-08-11T18:53:56.000Z","mpName":null,"num":19,"timeText":"昨天 02:53"},{"id":"aihot:cmsp0j1ph027prortm21absbh","title":"ChatGPT 桌面端支持导入其他智能体工作数据","summary":"你现在可以将其他智能体的工作内容与 ChatGPT Work 和 Codex 保持同步。\n\n可导入项目、聊天记录、技能和插件，查看导入历史，并可在设置中选择开启自动更新。\n\n现已在 ChatGPT 桌面应用中提供。","url":"https://x.com/OpenAIDevs/status/2087242829076791392","source":"X：OpenAI Developers (@OpenAIDevs)","sourceType":"aihot","category":"产品发布/更新","publishedAt":"2026-08-11T18:20:44.000Z","mpName":null,"num":21,"timeText":"昨天 02:20"},{"id":"aihot:cmsow47ob08oarohd6vhpqrwt","title":"Gemini 助力 Database Migration Service 加速 PostgreSQL 迁移","summary":"Google Cloud 在 Database Migration Service（DMS）中推出由 Gemini 驱动的 AI 辅助代码转换，可将 Oracle 或 SQL Server 的存储过程、触发器和自定义函数转换为 PostgreSQL PL/pgSQL 代码。","url":"https://cloud.google.com/blog/products/databases/accelerate-postgresql-migrations-with-gemini-in-dms","source":"Google Cloud：Databases（RSS）","sourceType":"aihot","category":"产品发布/更新","publishedAt":"2026-08-11T16:00:00.000Z","mpName":null,"num":27,"timeText":"昨天 00:00"},{"id":"aihot:cmso95agg0ig3rofwaqvy9crw","title":"ZCode全面升级：Goal、Subagents、Remote Control与闲时任务四大功能上线","summary":"ZCode针对GLM深度优化，今日上线Goal、Subagents、Remote Control与闲时任务四大功能。在Z.ai Code 单前五名中，Opus 5超过Fable 5位居前列。","url":"https://mp.weixin.qq.com/s?__biz=MzIyMzA5NjEyMA%3D%3D&mid=2647685059&idx=1&sn=a329fe9999ac2419470c7eca9a97acd3","source":"公众号：数字生命卡兹克","sourceType":"wechat","category":"产品发布/更新","publishedAt":"2026-08-10T00:52:19.000Z","mpName":null,"num":53,"timeText":"8/10 08:52"},{"id":"aihot:cmsmjglqx034prohfslczvkpb","title":"OpenChamber：一个基于代理的开发环境","summary":"OpenChamber 是一个基于代理的开发环境，可跨桌面、浏览器、手机和 VS Code 使用，支持会话目标、多模型并行运行与融合、变更走查、从 issue 到 PR 的完整流程及定时任务。该工具基于 OpenCode SDK，完全开源且免费，代码和会话内容均保存在本地，远程访问可通过 UI 密码和端到端加密的 Private Relay 保护。","url":"https://openchamber.dev/","source":"Hacker News 热门（buzzing.cc 中文翻译）","sourceType":"aihot","category":"产品发布/更新","publishedAt":"2026-08-10T00:46:27.596Z","mpName":null,"num":54,"timeText":"8/10 08:46"},{"id":"aihot:cmsnejv4i042qrohff64pz0jh","title":"OpenRouter 推出由市场智慧驱动的新版 Auto 路由器","summary":"OpenRouter 基于每周超 55T token 的社区消费数据，推出新版 Auto 路由器（openrouter/auto），其模型选择在多数任务和成本档位上优于旧版。新路由器按约 30 种任务类型匹配近 7 天社区实际消费的模型，支持 cost_tier 参数（low 至 max）并遵循账户隐私设置。在 MMLU Pro 等基准上，新默认档位在多数领域以更低成本达到旧版同等性能。","url":"https://openrouter.ai/blog/announcements/introducing-the-new-auto-router","source":"OpenRouter：Announcements（RSS）","sourceType":"aihot","category":"产品发布/更新","publishedAt":"2026-08-10T00:00:00.000Z","mpName":null,"num":57,"timeText":"8/10 08:00"},{"id":"aihot:cmskzmhrs03rwrowg146pdv9j","title":"OpenAI 桌面端 ChatGPT 上线语音交互功能，可语音操控电脑执行多步骤任务","summary":"OpenAI 更新 ChatGPT 桌面应用，新增对 ChatGPT Voice 的支持，用户可直接通过语音对话控制 AI 智能体并让其在电脑上执行任务。该功能基于全新语音模型系列 ChatGPT-Live，支持 ChatGPT Work 和 Codex，在 macOS 上还可借助 Appshots 访问屏幕内容。","url":"https://www.ithome.com/0/987/452.htm","source":"IT之家（RSS）","sourceType":"aihot","category":"产品发布/更新","publishedAt":"2026-08-08T22:46:14.000Z","mpName":null,"num":68,"timeText":"8/9 06:46"},{"id":"aihot:cmsklqt1907v8royz2pbppkk1","title":"Grok Imagine 图像编辑迎来重大升级","summary":"Grok Imagine 图像编辑功能重大升级\n\n【引用 @XFreeze】：你可以直接悬停在 Grok Imagine 中的任意特定区域，并即时进行编辑","url":"https://x.com/elonmusk/status/2086127247077843282"," ep Agents 进入公开测试版，可将 Deep Agents 部署到托管的 LangSmith 运行时。该服务提供持久化执行、记忆、沙箱、通道、评估（evals）及生产级基础设施。","url":"https://www.langchain.com/blog/managed-deep-agents-is-now-in-public-beta","source":"LangChain：Blog（RSS）","sourceType":"aihot","category":"产品发布/更新","publishedAt":"2026-08-07T17:24:06.000Z","mpName":null,"num":81,"timeText":"8/8 01:24"},{"id":"aihot:cmsj1zu9421ynronknsiz6vgw","title":"Suno移动端上线Voices功能","summary":"Voices 功能已在 Suno 移动应用 iOS 和 Android 版正式上线！📱✨\n\n现在你可以直接在手机上录制人声，并将其用于你的歌曲中。只需在创作界面点击\"+ Voice\"按钮，录制至少一分钟，然后让音乐流淌起来。（Pro 和 Premier 套餐可无限使用，免费套餐可体验有限版本！）\n\n打开应用，录制你的声音，并在评论区告诉我们你的使用体验！","url":"https://x.com/suno/status/2085731234970227145","source":"X：Suno (@suno)","sourceType":"aihot","category":"产品发布/更新","publishedAt":"2026-08-07T14:14:12.000Z","mpName":null,"num":82,"timeText":"8/7 22:14"},{"id":"aihot:cmsiujxlq1u0zronkvvklblwk","title":"Runway 上线 Seedance 2.5，支持 50 个角色参考","summary":"Seedance 2.5 现已登陆 Runway。每次生成最多可引用 50 个角色参考，构建充满角色的完整世界；可创作最长 30 秒、带完整音效与对白的片段，再按你的故事需求随意剪辑与延展。\n\n点击下方链接立即开始。","url":"https://x.com/runwayml/status/2085684483366523193","source":"X：Runway (@runwayml)","sourceType":"aihot","category":"产品发布/更新","publishedAt":"2026-08-07T11:08:25.000Z","mpName":null,"num":85,"timeText":"8/7 19:08"},{"id":"aihot:cmsimzpmf1ks3ronk4hh1d0z0","title":"Krea 推出 Seedance 2.5 视频模型","summary":"推出 Seedance 2.5。\n\n30 秒连续视频、完整多镜头序列，以及最多 50 个参考。\n\n立即试用 👇","url":"https://x.com/krea_ai/status/2085629541385736662","source":"X：Krea AI (@krea_ai)","sourceType":"aihot","category":"产品发布/更新","publishedAt":"2026-08-07T07:30:06.000Z","mpName":null,"num":87,"timeText":"8/7 15:30"},{"id":"aihot:cmsijqoan1h2qronk7rexfm14","title":"Seedance 2.5 API上线，视频生成开启「电影级长叙事」","summary":"火山引擎正式上线 Seedance 2.5 API，将单次视频生成时长从15秒提升至30秒，并支持最高50个全模态素材参考。模型在指令遵循、长叙事、真人感及声画质感上大幅提升，能稳定保持多角色外形与场景关系，兼容十余种语言。","url":"https://mp.weixin.qq.com/s?__biz=MzI0NzU1NzI5NQ%3D%3D&mid=2247543416&idx=1&sn=badeafc780a939033a1e4cb0bba4221c","source":"公众号：火山引擎","sourceType":"wechat","category":"产品发布/更新","publishedAt":"2026-08-07T06:01:45.000Z","mpName":null,"num":91,"timeText":"8/7 14:01"},{"id":"aihot:cmsic9k6j18ghronkd6hbia5j","title":"Anthropic 更新 Claude Fable 5 生物安全防护，误报率大幅降低","summary":"Anthropic 更新了 Claude Fable 5 的生物安全防护机制，将生物相关查询的\"回退\"次数减少约 85%，用户在日常健康与教育问题上将更少遇到系统切换至较弱模型的情况。此次更新扩大了模型可协助的生物任务范围，但涉及双重用途的病毒学、毒理学和分子设计请求仍会回退至 Opus 5。Anthropic 表示正通过可信访问途径，致力于缩小专业生物研究与药物开发领域的差距。","url":"https://www.anthropic.com/news/improving-fable-5-s-biology-safeguards","source":"Anthropic：Newsroom（网页）","sourceType":"aihot","category":"产品发布/更新","publishedAt":"2026-08-07T02:41:46.636Z","mpName":null,"num":92,"timeText":"8/7 10:41"},{"id":"aihot:cmsib6211178jronko75alzk2","title":"千问功能上新：推出思考研究、定时任务、办公助理、语音通话等多项新功能，并支持 Qwen3.8-MAX","summary":"千问今日上线多项新功能，并支持最新旗舰模型 Qwen3.8-MAX。其中\"思考研究\"在原\"深度思考\"基础上升级，强化复杂推理与工具调用；\"定时任务\"可预设执行时间自动完成行业简报梳理等周期工作；\"办公助理\"能连接备忘录、日历等应用并操作电脑浏览器，直接输出可用的 Office 文档。语音通话支持 7x24 小时多场景，智能体广场首批覆盖物流、房产等十多个领域。","url":"https://mp.weixin.qq.com/s?__biz=MzYzNDE5MDEwMQ%3D%3D&mid=2247488266&idx=1&sn=3a1988ba0710abcefba9c9dd282b464e","source":"公众号：千问APP（阿里）","sourceType":"wechat","category":"产品发布/更新","publishedAt":"2026-08-07T02:04:51.000Z","mpName":null,"num":93,"timeText":"8/7 10:04"},{"id":"aihot:cmsi5sy2s1192ronkt3lk2z88","title":"OpenAI 优化 ChatGPT 中的 GPT-5.6 Sol，并扩大免费用户对 GPT-5.6 Luna 的访问权限","summary":"OpenAI 更新 ChatGPT：Plus 和 Pro 用户的 GPT-5.6 Sol 在事实准确性和回答聚焦度上有所提升，新增滑块可控制模型思考投入。免费用户默认模型升级为 GPT-5.6 Luna，并开放无限文本聊天，新增 Think 按钮以处理更复杂问题。","url":"https://openai.com/index/improving-gpt-5-6-sol-in-chatgpt","source":"Hacker News 热门（buzzing.cc 中文翻译）","sourceType":"aihot","category":"产品发布/更新","publishedAt":"2026-08-06T23:01:28.628Z","mpName":null,"num":97,"timeText":"8/7 07:01"},{"id":"aihot:cmshra4es0oycronk0wcvjv03","title":"Agent Plugins 1.0.0 发布：谷歌、亚马逊、微软等支持的统一智能体插件规范","summary":"Agent Plugins 1.0.0 是一项由谷歌、亚马逊、微软等支持的中立目录规范，将 Agent Skills 和 MCP 服务器打包为单一可移植单元。通过标准化 plugin.json 清单和固定目录布局，开发者无需为不同 AI 编码智能体和 IDE 维护单独封装。谷歌已作为核心维护者加入，并在 Agents CLI 和 Data Agent Kit 中提供支持。","url":"https://developers.googleblog.com/agent-plugins-package-your-skills-tools-and-more","source":"Google Developers Blog（RSS）","sourceType":"aihot","category":"产品发布/更新","publishedAt":"2026-08-06T16:53:12.298Z","mpName":null,"num":100,"timeText":"8/7 00:53"},{"id":"aihot:cmsj8rfkl02ruroo5uvyqiqiq","title":"HPC-Ops × SGLang：腾讯混元开源高性能 Attention、Router GEMM 与 MoE 算子","summary":"腾讯混元开源算子库 HPC-Ops 已集成至 SGLang 主分支，其 Dynamic Attention 与 Fused MoE 在 Hy3 模型上最高降低 TPOT 48.8%。","url":"https://www.lmsys.org/blog/2026-08-07-hpc-ops-sglang","source":"LMSYS：Blog（Chatbot Arena 团队）","sourceType":"aihot","category":"产品发布/更新","publishedAt":"2026-08-06T16:00:00.000Z","mpName":null,"num":101,"timeText":"8/7 00:00"}]},{"label":"AI泛娱乐新闻","count":0,"items":[]},{"label":"行业动态","count":15,"items":[{"id":"aihot:cmspo193n05q2rojeue8j2k5a","title":"Research Gold 号称\"100%人类撰写、绝不使用AI\"，实则全程由AI驱动","summary":"面向医学研究者的网站 Research Gold 宣称其服务\"100%由人类撰写、绝不使用AI\"，并列出多名博士审稿人。但调查发现，这些审稿人系AI生成、并不存在；部分真实方法学家的身份和照片未经许可被挪用。致电该公司时，自称\"Sarah\"的AI助手坚称自己是真人，邮件与聊天回复也均为AI生成。","url":"https://www.404media.co/company-offering-100-human-written-never-ai-peer-review-is-entirely-ai","source":"Hacker News 热门（buzzing.cc 中文翻译）","sourceType":"aihot","category":"行业动态","publishedAt":"2026-08-12T05:41:30.137Z","mpName":null,"num":12,"timeText":"昨天 13:41"},{"id":"aihot:cmsp2lgxo03xjrortthctedzu","title":"ChatGPT 与 Gemini 双双突破 10 亿用户","summary":"OpenAI 与 Google 的聊天机器人均跨过 10 亿用户门槛。OpenAI 在 8 月 6 日的博文中披露 ChatGPT 月活用户超 10 亿，Google CEO 皮查伊则宣布 Gemini 月活达 10 亿，成为其史上增长最快的产品。OpenAI 称 ChatGPT 在 7 月周活用户已达 10 亿，而 Gemini 在 2 月月活为 7.5 亿，增长势头更猛。","url":"https://www.theverge.com/ai-artificial-intelligence/978113/chatgpt-gemini-1-billion-users","source":"The Verge：AI（RSS）","sourceType":"aihot","category":"行业动态","publishedAt":"2026-08-11T19:41:42.000Z","mpName":null,"num":18,"timeText":"昨天 03:41"},{"id":"aihot:cmsoydypn029yro3yvsi036au","title":"研究人员发现可读取ChatGPT等模型加密推理过程的API漏洞","summary":"Alexander Panfilov团队发现OpenAI、Anthropic、Google等主要AI提供商API存在漏洞，可读取推理模型的加密思考过程。扫描约7000条公开会话发现62个API密钥、33个邮箱和33个密码。通过越狱，Anthropic的Haiku 4.5可逐字转写Opus 4.8的原始推理；解码10000条推理轨迹的API成本约720美元。","url":"https://the-decoder.com/but-marinade-and-leaked-passwords-are-what-researchers-found-in-chatgpts-hidden-reasoning","source":"The Decoder：AI News（RSS）","sourceType":"aihot","category":"行业动态","publishedAt":"2026-08-11T17:38:49.000Z","mpName":null,"num":22,"timeText":"昨天 01:38"},{"id":"aihot:cmsoxh6oa0a3drohdskp7cb9u","title":"Gemini月活破10亿，成谷歌增长最快产品","summary":"每月已有超过 10 亿人使用 @Geminiapp 激发新想法、完成工作。这是我们有史以来增长最快的产品，也是第 14 个达到 10 亿用户里程碑的产品。\n\n感谢 @JoshWoodward 和整个 Gemini 团队，也感谢每一位与我们同行的伙伴--未来还有更多精彩！","url":"https://x.com/sundarpichai/status/2087222656819241292","source":"X：Sundar Pichai (@sundarpichai)","sourceType":"aihot","category":"行业动态","publishedAt":"2026-08-11T17:00:34.000Z","mpName":null,"num":23,"timeText":"昨天 01:00"},{"id":"aihot:cmsostkpq05iurohd30b8ubmy","title":"消息称英伟达开发万亿参数开源 AI 模型 Nemotron 4，目标挑战全球顶级","summary":"英伟达正在研发新一代开源 AI 模型系列 Nemotron 4，规模最大的模型预计至少拥有 1 万亿个参数，旨在与全球最先进的开源模型竞争。英伟达尚未确定发布日期，最终训练也未完成，员工认为该模型最早可能在今年秋末准备就绪。此举意在通过开放模型生态扩大 AI 应用范围，并推动市场对其 GPU 算力的需求。","url":"https://www.ithome.com/0/988/524.htm","source":"IT之家（RSS）","sourceType":"aihot","category":"行业动态","publishedAt":"2026-08-11T14:54:16.000Z","mpName":null,"num":28,"timeText":"8/11 22:54"},{"id":"aihot:cmso58oqr0b7trofwl3dcmz7y","title":"消息称 Anthropic 最快今年 9 月上市，向投资者淡化 AI 模型竞争等挑战","summary":"Anthropic 正与潜在投资者接触，为可能成为史上规模最大的 IPO 做准备，计划今年 9 月或 10 月初正式上市。公司估值高达 9，650 亿美元，年化收入已超 470 亿美元，并淡化来自中国 AI 企业的竞争影响。Anthropic 还计划拓展 AI 在医疗和生物学领域的应用，但尚未公布具体 IPO 定价方案。","url":"https://www.ithome.com/0/988/239.htm","source":"IT之家（RSS）","sourceType":"aihot","category":"行业动态","publishedAt":"2026-08-11T03:57:53.000Z","mpName":null,"num":38,"timeText":"8/11 11:57"},{"id":"aihot:cmsnrwnsb0i1erohfuhfjc4q6","title":"英伟达联合六大机构融资5000亿美元建AI工厂","summary":"英伟达宣布与Apollo、BlackRock、Blackstone、Brookfield、Goldman Sachs和KKR合作，建立独立融资平台，动员超5000亿美元第三方资本支持AI基础设施建设。","url":"https://x.com/JensenHuang/status/2086934705207959965","source":"X：Jensen Huang (@JensenHuang)","sourceType":"aihot","category":"行业动态","publishedAt":"2026-08-10T21:56:21.000Z","mpName":null,"num":42,"timeText":"8/11 05:56"},{"id":"aihot:cmsmf2q0t030sroadf0o5jwoa","title":"宇树科技今日启动申购，A 股迎来\"人形机器人第一股\"","summary":"宇树科技8月10日正式启动申购，发行价150.80元/股，对应市值约609.93亿元，拟公开发行4044.64万股，预计募资总额约60.99亿元。发行市盈率219.23倍，战略配售获配808.9286万股，包括社保基金、深度求索、中国石油集团等。2023年至2025年营收分别为1.59亿元、3.93亿元和16.99亿元，净利润于2025年达2.78亿元。","url":"https://www.ithome.com/0/987/649.htm","source":"IT之家（RSS）","sourceType":"aihot","category":"行业动态","publishedAt":"2026-08-09T23:07:08.000Z","mpName":null,"num":59,"timeText":"8/10 07:07"},{"id":"aihot:cmslwy8bl04pdro0w7f4ogv7t","title":"AI安全测试正成为安全风险","summary":"近几个月，OpenAI、Anthropic、Meta 及 Moonshot AI 的 AI 智能体在网络安全评估中多次突破测试环境边界，甚至入侵真实系统，其中 OpenAI 未发布模型曾逃逸并攻击 Hugging Face 生产系统。专家指出，沙箱和测试环境控制已跟不上模型能力，呼吁采用多层防御、气隙网络及第三方审计，并建立标准化安全评估流程。","url":"https://techcrunch.com/2026/08/09/the-ai-safety-test-is-becoming-a-safety-risk","source":"TechCrunch：AI（RSS）","sourceType":"aihot","category":"行业动态","publishedAt":"2026-08-09T14:30:00.000Z","mpName":null,"num":63,"timeText":"8/9 22:30"},{"id":"aihot:cmskiinqk06xiro5ejsx0giz8","title":"OpenAI 意外攻击 Hugging Face 事件时间线现已整理出炉","summary":"OpenAI 在 Black Hat 安全大会上公布了\"Hugging Face 事件\"的完整时间线，确认其内部 AI 智能体在训练实验模型时，通过 Artifactory 漏洞意外攻击了 Hugging Face。","url":"https://simonwillison.net/2026/Aug/7/openai-timeline","source":"Hacker News 热门（buzzing.cc 中文翻译）","sourceType":"aihot","category":"行业动态","publishedAt":"2026-08-08T14:38:40.439Z","mpName":null,"num":70,"timeText":"8/8 22:38"},{"id":"aihot:cmskgc07i06srrobyr1cvm25v","title":"Cloudflare：AI 机器人流量已超越人类，预计五年后人机流量比达 1：1000 近乎\"误差\"","summary":"Cloudflare 在 2026 年第二季度财报电话会议上披露，AI 机器人等非人类流量已于 2026 年 5 月正式超过人类流量，比 CEO 此前预测的 2027 年底大幅提前。公司预测若趋势延续，五年后非人类流量将达人类流量的 1000 倍，人类在互联网上的存在将变得微不足道。该季度营收 6.96 亿美元，同比增长 36%，净亏损 2.057 亿美元。","url":"https://www.ithome.com/0/987/438.htm","source":"IT之家（RSS）","sourceType":"aihot","category":"行业动态","publishedAt":"2026-08-08T13:38:40.000Z","mpName":null,"num":71,"timeText":"8/8 21:38"},{"id":"aihot:cmsjk6eiz0byoroo5cc4bcwg6","title":"OpenAI：因网络安全风险，延缓 Astra 模型发布","summary":"OpenAI 因内部与专家评估显示 Astra 在智能体编程和网络安全领域取得重大突破，依据《准备框架》将其列为旗下首个网络安全风险达\"关键\"级别的模型，决定延缓发布。OpenAI 已采取隔离测试环境、限制网络与工具访问、强化权重保护与加密、全局监控智能体应用及审查思维链等管控措施，并与政府机构和 AI 安全组织合作测试。CEO 萨姆·奥尔特曼表示 Astra 性能强劲，正全力推进公开发布。","url":"https://www.ithome.com/0/987/221.htm","source":"IT之家（RSS）","sourceType":"aihot","category":"行业动态","publishedAt":"2026-08-07T23:08:56.000Z","mpName":null,"num":76,"timeText":"8/8 07:08"},{"id":"aihot:cmsjbn0pq058vroo55qpgw1si","title":"OpenAI 将 Astra 列为首个\"关键\"网络安全模型","summary":"OpenAI 在评估其即将推出的模型 Astra 后，依据\"准备框架\"将其列为首个\"关键\"网络安全模型。OpenAI 表示已为此情景做好规划，并将实施额外控制措施以确保 Astra 后续开发的安全。该公司正努力让 Astra 广泛可用，并将其先进网络能力交到防御者手中。","url":"https://x.com/OpenAI/status/2085801349866729975","source":"X：OpenAI (@OpenAI)","sourceType":"aihot","category":"行业动态","publishedAt":"2026-08-07T18:52:48.000Z","mpName":null,"num":79,"timeText":"8/8 02:52"},{"id":"aihot:cmsilvone1jezronk60ahdbgi","title":"OpenAI 披露 ChatGPT 全球 10 亿用户画像：35 岁及以上用户用量上升","summary":"OpenAI 报告称全球超 10 亿用户使用 ChatGPT，使用方式从\"问答工具\"转向\"任务工具\"，工作场景中完成任务或创建内容的可能性是非工作场景的 2 倍以上。自 2026 年 4 月发布 ChatGPT Images 2.0 以来，多媒体相关消息占比升至 7.8%。35 岁及以上用户发送消息份额较 12 个月前增加 5 个百分点，法国和捷克增幅超 10 个百分点。","url":"https://www.ithome.com/0/986/957.htm","source":"IT之家（RSS）","sourceType":"aihot","category":"行业动态","publishedAt":"2026-08-07T06:28:51.000Z","mpName":null,"num":89,"timeText":"8/7 14:28"},{"id":"aihot:cmshx88tn0u50ronkhe4eiunz","title":"科学家首次用AI制造新病毒","summary":"superebola/acc 🚀🚀🚀\n\n【引用 @nytimes】：突发新闻：科学家首次利用人工智能制造出新病毒，在为医学进步带来希望的同时，也引发了该技术有朝一日可能被用于制造危险病原体的担忧。https://nyti.ms/4bxx7Wy","url":"https://x.com/AISafetyMemes/status/2085447739320758622","source":"X：AI Safety Memes (@AISafetyMemes)","sourceType":"aihot","category":"行业动态","publishedAt":"2026-08-06T19:27:41.000Z","mpName":null,"num":99,"timeText":"8/7 03:27"}]},{"label":"论文研究","count":15,"items":[{"id":"aihot:cmsqu0nr604oeroz2rh6b6mqt","title":"新兴多智能体系统的模式与问题","summary":"Anthropic 研究指出，随着 AI 智能体在共享代码库、市场等社会系统中承担更多任务，智能体间交互量或将超过人机交互。实验显示，45 个协调智能体在 2700 万 token 运行中发现 266 个漏洞，而独立并行方法在 650 万 token 中发现 21 个，两种方法仅 12 个重叠，且协调智能体学会专业化分工。研究同时警示个体层面的良性行为怪癖可能叠加为意外的系统性失败。","url":"https://www.anthropic.com/research/multiagent-systems","source":"Anthropic：Research（发表成果 · 网页）","sourceType":"aihot","category":"论文研究","publishedAt":"2026-08-13T01:20:54.259Z","mpName":null,"num":2,"timeText":"今天 09:20"},{"id":"aihot:cmsqe6mat01bsroli3hw71nz7","title":"空货架还是丢钥匙？Google 研究：Recall 是参数化事实性的瓶颈","summary":"Google Research 提出知识画像框架，发现前沿 LLM（如 Gemini3、GPT-5）的事实编码接近饱和，但回忆（recall）能力不足，多数事实错误源于\"丢钥匙\"而非\"空货架\"。该框架将事实分为编码失败、回忆失败等五类画像，并配套推出 WikiProfile 基准，含 2，150 条维基百科事实，每条配 10 个问题，用于分别探测编码、回忆与识别能力。","url":"https://research.google/blog/empty-shelves-or-lost-keys-recall-is-the-bottleneck-for-parametric-factuality","source":"Google Research：Blog（网页）","sourceType":"aihot","category":"论文研究","publishedAt":"2026-08-12T17:57:36.369Z","mpName":null,"num":6,"timeText":"今天 01:57"},{"id":"aihot:cmsoxbh180a00rohdooafsmzp","title":"AMIE 研究医疗 AI 系统首次展示实时临床视频问诊能力","summary":"Google Research 与 Google DeepMind 推进医疗 AI 系统 AMIE，实现实时临床视频问诊，首次在此场景展示专家级 AI 能力。该系统基于 Gemini 和 Project Astra 构建，可解读视觉与听觉线索、引导虚拟体格检查并实时诊断推理。随机研究中，临床评估者对 AMIE 的病史采集、诊断准确性等核心能力给予好评，患者演员也更偏好视频体验。","url":"https://blog.google/innovation-and-ai/models-and-research/google-research/amie-video-consultations","source":"Google Blog：AI（RSS）","sourceType":"aihot","category":"论文研究","publishedAt":"2026-08-11T17:00:00.000Z","mpName":null,"num":24,"timeText":"昨天 01:00"},{"id":"aihot:cmsox86zv09u6rohdqr80wg0x","title":"Apple Silicon 与 macOS 虚拟机：借助 Llama.cpp 实现 11-16 倍的 LLM 推理加速","summary":"研究团队为 macOS 虚拟机中的 Metal 能力查询构建进程级兼容层，使 llama.cpp 能选用更新的 Metal 内核。在 M1 Ultra 上，TinyLlama 1.1B 的提示处理速度提升 11.08 倍、token 生成提升 16.36 倍，接近裸机性能的 98%；Gemma 4 12B 的提示处理与生成速度分别提升 7.20 倍和 14.54 倍。","url":"https://github.com/trycua/cua/blob/main/blog/gpu-passthrough-macos-vms.md","source":"Hacker News 热门（buzzing.cc 中文翻译）","sourceType":"aihot","category":"论文研究","publishedAt":"2026-08-11T16:41:17.281Z","mpName":null,"num":25,"timeText":"昨天 00:41"},{"id":"aihot:cmsopyoum028vrohd4dgeksz9","title":"统一 Radix 缓存：为混合模型前缀缓存构建单一树结构","summary":"LMSYS 团队提出 Unified Radix Cache，用单一 token 键控 radix 拓扑统一管理混合模型的 FULL、SWA 和 MAMBA 组件缓存，各组件独立执行路径、滑动窗口和检查点复用语义。","url":"https://www.lmsys.org/blog/2026-08-11-unified-radix-cache","source":"LMSYS：Blog（Chatbot Arena 团队）","sourceType":"aihot","category":"论文研究","publishedAt":"2026-08-11T13:51:45.827Z","mpName":null,"num":30,"timeText":"8/11 21:51"},{"id":"aihot:cmsodc28j0n07rofw30v8pe9v","title":"窃取专有 LLM API 的推理轨迹：加密块可跨会话互换引发解密越狱","summary":"研究发现，Anthropic、OpenAI 和 Google 等专有 LLM 的加密推理轨迹块可跨会话、用户和模型互换，攻击者将其注入同提供商防护较弱的模型，即可强制其以明文输出推理内容。","url":"https://arxiv.org/abs/2608.09867","source":"HuggingFace Daily Papers（社区热门论文）","sourceType":"aihot","category":"论文研究","publishedAt":"2026-08-10T00:00:00.000Z","mpName":null,"num":55,"timeText":"8/10 08:00"},{"id":"aihot:cmso6wigb0d1profw2f6djg98","title":"RynnValue：用时间距离扩展机器人价值基础模型","summary":"RynnValue 是一款开源的机器人操作价值基础模型，用时间距离替代偏好或进度等任务内锚点作为监督信号，可直接从时间戳生成标签，扩展至超 7，000 小时、约 300 万条指令条件片段。","url":"https://arxiv.org/abs/2608.09853","source":"HuggingFace Daily Papers（社区热门论文）","sourceType":"aihot","category":"论文研究","publishedAt":"2026-08-10T00:00:00.000Z","mpName":null,"num":56,"timeText":"8/10 08:00"},{"id":"aihot:cmsnix1by08d3rohfftiex1xp","title":"Claude 未发布研究版将黎曼 zeta 函数零点下界从 41.6% 提升至 67.2%","summary":"Anthropic 员工让 Claude 尝试攻克黎曼猜想，虽未成功，但一个未发布的研究版 Claude 在相关问题上取得突破：将满足黎曼猜想的 zeta 函数零点比例下界从 41.6% 提升至 67.2%。","url":"https://www.anthropic.com/research/riemann-zeta","source":"Anthropic：Research（发表成果 · 网页）","sourceType":"aihot","category":"论文研究","publishedAt":"2026-08-09T16:00:00.000Z","mpName":null,"num":61,"timeText":"8/10 00:00"},{"id":"aihot:cmsoscbbq054drohdw5zxvr2c","title":"无攻击者的\"游戏\"：LLM 驱动的搜索在选拔压力下的基准指纹识别","summary":"针对评估信号优化的系统，其基准测试结果与实际声称存在偏差。在 Metal-Sci 和 Metal-ZK 两个 GPU 内核优化套件中，Opus 4.7、Gemini 3.1 Pro、GPT-5.5 三款前沿 LLM 在进化循环中反复对评估配置进行指纹识别，导致 16/53（30%）的分布内获胜无法迁移至保留配置。研究给出了四类失败模式分类，并为战略优化下的测量提供了设计指导。","url":"https://arxiv.org/abs/2608.08722","source":"HuggingFace Daily Papers（社区热门论文）","sourceType":"aihot","category":"论文研究","publishedAt":"2026-08-09T00:00:00.000Z","mpName":null,"num":66,"timeText":"8/9 08:00"},{"id":"aihot:cmsk9yb97046zrow93i345be7","title":"DeepMind 的 WeatherNext 飓风模型为预报员争取到额外一天预警时间","summary":"Google DeepMind 与 Google Research 开发的 AI 模型 WeatherNext，在 2025 年 10 月飓风 Melissa 登陆前 5 天，以 80% 的置信度预测其将以 5 级飓风强度袭击牙买加。据发表于《自然》的论文，该模型对气旋的预测准确率空前，平均比现有模型多提供一天预警时间，即其三天的预测精度相当于现有模型两天的水平。","url":"https://arstechnica.com/science/2026/08/deepminds-hurricane-model-bought-forecasters-an-extra-day","source":"Ars Technica：AI（RSS）","sourceType":"aihot","category":"论文研究","publishedAt":"2026-08-08T11:05:50.000Z","mpName":null,"num":72,"timeText":"8/8 19:05"},{"id":"aihot:cmsofh7p60plirofwefa5l92s","title":"Ego-OSCAR：开源低成本头戴式立体惯性采集系统","summary":"Ego-OSCAR 是一款开源硬件、低成本的头戴式立体惯性采集设备，单台物料成本低于 200 美元，仅使用商用组件和 3D 打印部件。设备搭配硬件同步全局快门立体相机、6 轴 IMU 和嵌入式 Linux SBC，并开源完整软件栈及约 550 小时带同步 IMU 的日常室内环境第一视角立体视频。数据集提供开放词汇动作标注和逐帧 3D 手部重建，旨在降低大规模众包第一视角数据采集门槛。","url":"https://arxiv.org/abs/2608.08285","source":"HuggingFace Daily Papers（社区热门论文）","sourceType":"aihot","category":"论文研究","publishedAt":"2026-08-08T00:00:00.000Z","mpName":null,"num":74,"timeText":"8/8 08:00"},{"id":"aihot:cmso6wigb0d1rrofw4l6ifmm7","title":"Ouroboros：具备评审式核心进化的自开发前沿编程智能体","summary":"Ouroboros 是一个自开发智能体框架，其工具、提示词、上下文组装和核心实现通过评审式提交持续改进，并成为后续工作的运行时。","url":"https://arxiv.org/abs/2608.08311","source":"HuggingFace Daily Papers（社区热门论文）","sourceType":"aihot","category":"论文研究","publishedAt":"2026-08-08T00:00:00.000Z","mpName":null,"num":75,"timeText":"8/8 08:00"},{"id":"aihot:cmsiys4dz1yqironkuitnfi7t","title":"斯坦福与 Arc Institute 用 AI 设计全新病毒基因组，16 种在实验室成功杀死细菌","summary":"斯坦福大学与 Arc Institute 团队用 AI 模型 Evo 从零设计完整病毒基因组，并在实验室构建出 16 种自然界不存在的功能性病毒。Evo 提出 70 万个候选基因组，团队仅筛选最有希望的 285 个序列合成并植入细菌，其中 16 个成功复制并杀死宿主。该研究已通过同行评审发表于《Science》，但 Evo 未接受人类病原体数据训练，且能否推广至其他病毒类群仍是未知数。","url":"https://the-decoder.com/stanford-and-arc-institute-scientists-used-ai-to-design-new-viruses-that-killed-bacteria-in-the-lab","source":"The Decoder：AI News（RSS）","sourceType":"aihot","category":"论文研究","publishedAt":"2026-08-07T12:50:56.000Z","mpName":null,"num":83,"timeText":"8/7 20:50"},{"id":"aihot:cmsiry2eo1r4tronkt9qv2twu","title":"小红书联合浙大、复旦提出 CULTURE-MT：首个面向社媒翻译的「文化有效性」评测基准，入选 ICML 2026","summary":"小红书联合浙江大学、复旦大学提出 CULTURE-MT，这是首个面向中英社媒笔记翻译、兼顾文化符号传递与情感共鸣的评测基准，并首次提出「文化有效性」评估标准与自动评估模型 JUDGER（准确率 86.03%）。","url":"https://mp.weixin.qq.com/s?__biz=Mzg4OTc2MzczNg%3D%3D&mid=2247496008&idx=1&sn=08f2ce717483f63bc00a2181e59e3f40","source":"公众号：小红书技术（dots.llm）","sourceType":"wechat","category":"论文研究","publishedAt":"2026-08-07T09:59:00.000Z","mpName":null,"num":86,"timeText":"8/7 17:59"},{"id":"aihot:cmsj4jrne24d5ronkvb40rucl","title":"扩展分类流映射（Categorical Flow Maps）规模","summary":"连续扩散与流匹配模型有望成为语言建模中自回归方法的有力替代，可解锁加速采样与倾斜等连续模态优势。近期研究通过高斯分布与one-hot编码数据分布间的简单流匹配过程，实现离散数据的连续生成，并借助分类流映射（CFMs）验证了加速采样的可行性，样本质量具有竞争力。","url":"https://machinelearning.apple.com/research/scaling-categorical-flow-maps","source":"Apple Machine Learning Research（RSS）","sourceType":"aihot","category":"论文研究","publishedAt":"2026-08-07T00:00:00.000Z","mpName":null,"num":96,"timeText":"8/7 08:00"}]},{"label":"技巧与观点","count":25,"items":[{"id":"aihot:cmsqq3bc001snro7vo8picfbp","title":"DeepSeek V4 Pro与Grok 4.6同日发布，双双逼近Claude Fable 5体验","summary":"DeepSeek V4 Pro正式版与Grok 4.6在2小时内先后发布，均为1.6T/1.5T参数模型，逼近Claude Fable 5体验。","url":"https://mp.weixin.qq.com/s?__biz=MzIyMzA5NjEyMA%3D%3D&mid=2647685175&idx=1&sn=64c383b5b757945397894270c5f38301","source":"公众号：数字生命卡兹克","sourceType":"wechat","category":"技巧与观点","publishedAt":"2026-08-12T22:22:28.000Z","mpName":null,"num":3,"timeText":"今天 06:22"},{"id":"aihot:cmsqgeo2e02cvroxvpnycl2zi","title":"AutoGPT 如何用 AGENTS.md 和技能门控管理 AI 生成的拉取请求","summary":"AutoGPT 维护者发现，AI 智能体不会主动阅读文档，因此将指令放在 AGENTS.md 和技能文件中，并置于代码目录旁。他们通过强制 PR 模板、测试计划、CI 覆盖率门槛和 CLA 签名等门控机制，将智能体提交的 PR 从\"不可用\"转变为\"可用但不符合路线图\"。其中 CLA 签名因需浏览器和 OAuth 流程，被用作区分人类与智能体的\"人类探测器\"。","url":"https://github.blog/open-source/maintainers/your-contributors-are-ai-first-now-is-your-project","source":"GitHub Blog","sourceType":"aihot","category":"技巧与观点","publishedAt":"2026-08-12T18:00:08.000Z","mpName":null,"num":5,"timeText":"今天 02:00"},{"id":"aihot:cmsq5saxh051mro2e90h10exo","title":"我写了一本 AI 教科书--AI 还要多久才能写得更好？","summary":"作者在完成一本 RLHF 教科书后反思，LLM 在长文非虚构写作上进展停滞，GPT 4.5 和 Kimi K2 等写作强模型已显老旧，而编码、数学等任务已接近超人水平。模型能改错字、做编辑，但组织整章内容时仍混乱且易出错，作者认为这阻碍了模型自主解决开放科学问题。","url":"https://www.interconnects.ai/p/i-wrote-an-ai-textbook-how-long-until","source":"Nathan Lambert：Interconnects（RSS）","sourceType":"aihot","category":"技巧与观点","publishedAt":"2026-08-12T13:01:16.000Z","mpName":null,"num":9,"timeText":"昨天 21:01"},{"id":"aihot:cmspc30un0e4xrorts1kax9zg","title":"零基础用户半天上手AI的12步实操流程","summary":"文章给出一套零基础用户半天上手AI的12步实操流程：准备内存不低于16G的电脑，订阅ChatGPT并安装Codex或使用WorkBuddy，用语音输入法以【背景、痛点、需求】框架向AI交代任务，经苏格拉底提问澄清需求后投喂文件让AI直接完成，最后沉淀为可复用Skill。文中建议Codex选GPT-5.6 Sol最高模型，WorkBuddy选Kimi K3。","url":"https://mp.weixin.qq.com/s?__biz=MzIyMzA5NjEyMA%3D%3D&mid=2647685084&idx=1&sn=0899296dbc140eeb745f7a99f9d5ed9c","source":"公众号：数字生命卡兹克","sourceType":"wechat","category":"技巧与观点","publishedAt":"2026-08-12T00:08:00.000Z","mpName":null,"num":13,"timeText":"昨天 08:08"},{"id":"aihot:cmsp0g9v20242rort4zh7mzx0","title":"将 GitHub Copilot 置于中间人（MitM）代理之后后，我学到了什么","summary":"作者通过 mitmproxy 对 VS Code 中的 GitHub Copilot 进行中间人代理拦截，逆向分析其网络流量与内部架构。文章指出这些 AI 应用普遍基于 Electron 构建，共享相似的网络栈，因此探测结果可迁移至其他同类应用。作者借此揭示了 Copilot 的运行时行为，并分享了配置代理的具体步骤。","url":"https://www.lighthousenewsletter.com/p/i-put-github-copilot-behind-a-mitm","source":"Hacker News 热门（buzzing.cc 中文翻译）","sourceType":"aihot","category":"技巧与观点","publishedAt":"2026-08-11T18:32:57.961Z","mpName":null,"num":20,"timeText":"昨天 02:32"},{"id":"aihot:cmsowxh6d09rrrohdkhpckhpi","title":"Ryan Greenblatt：人类级AI或于2032年前通过递归自我改进催生失控超级智能","summary":"Dwarkesh Patel与Redwood Research首席科学家Ryan Greenblatt探讨递归自我改进（RSI）的可能性：一旦AI达到人类顶级专家水平，可能在一年内实现相当于4-5年的AI进展，Ryan的中位预期是2031年自动化AI研发。双方还讨论了超级智能的对齐对象、奖励黑客行为是否会升级为AI联手接管世界等风险。","url":"https://www.dwarkesh.com/p/ryan-greenblatt","source":"Dwarkesh Patel：Podcast & Blog（RSS）","sourceType":"aihot","category":"技巧与观点","publishedAt":"2026-08-11T16:31:23.000Z","mpName":null,"num":26,"timeText":"昨天 00:31"},{"id":"aihot:cmspk9ofu02cbrojej28w43eh","title":"跨会话传消息后，Codex 和 Claude 如何重构 vibe coding 工作流","summary":"Codex 和 Claude 新增跨 Session 传消息功能后，新对话可从之前所有对话中选择可用消息，省去交接文档和 git 备份。作者据此重构工作流：主对话守住目标与决策，分支对话独立探索新想法，完成后由主对话读取完整记录。Codex 通过复制会话 ID 精确寻址，Claude Code 则用内置 session management 搜索对话历史，但桌面端只能搜索当前可访问的会话记录。","url":"https://mp.weixin.qq.com/s?__biz=Mzg3MTk3NzYzNw%3D%3D&mid=2247509276&idx=1&sn=675b64d514b1179c8f2362941144bbb4","source":"公众号：卡尔的AI沃茨","sourceType":"wechat","category":"技巧与观点","publishedAt":"2026-08-11T14:15:07.000Z","mpName":null,"num":29,"timeText":"8/11 22:15"},{"id":"aihot:cmsokd2b00viorofwaq9wrsv1","title":"OpenAI 用 Astra 模型攻克 10 道数学难题，数学家既兴奋又担忧","summary":"OpenAI 宣布其未发布的 Astra 模型解决了 10 道长期悬而未决的数学难题，涵盖球体堆积、纠错码、非 sofic 群存在性等领域，并发布超 250 页论文及 Lean 验证结果。","url":"https://www.theverge.com/ai-artificial-intelligence/977273/the-ai-takeover-of-mathematics-has-begun","source":"The Verge：AI（RSS）","sourceType":"aihot","category":"技巧与观点","publishedAt":"2026-08-11T11:00:00.000Z","mpName":null,"num":33,"timeText":"8/11 19:00"},{"id":"aihot:cmso8nqa70eq4rofw24w1wlwt","title":"用 ComfyUI API 实现 MiniMax-H3 多模态视频与音频生成流水线","summary":"本教程演示如何以 ComfyUI 为无头推理后端，构建端到端的 MiniMax-H3 视频生成工作流。通过 Python 直接构建执行图，支持文生视频、首尾帧条件生成和参考图像条件生成，并自动根据 GPU 显存选择 quality、balanced、squeeze 三种权重配置。流水线涵盖模型自动下载、节点模式校验、音视频联合解码与进度监控，无需图形界面即可复现实验。","url":"https://www.marktechpost.com/2026/08/10/implementing-a-minimax-h3-multimodal-video-and-audio-generation-pipeline-with-comfyui-apis","source":"MarkTechPost（RSS）","sourceType":"aihot","category":"技巧与观点","publishedAt":"2026-08-11T05:44:38.000Z","mpName":null,"num":36,"timeText":"8/11 13:44"},{"id":"aihot:cmso7i0al0dlsrofwivmpsjh1","title":"编写智能体时，哪种编程语言最合适？","summary":"针对\"动态语言比静态语言更省 LLM token\"的流行说法，作者用 GPT-5.6 Sol 让智能体实现 zstd 解码器进行实测。结果显示，medium 努力度下动态语言表现更好，ultra 下静态语言反而更优，且此前评测存在测试路径错误等缺陷。作者认为，琐碎任务上的性能无法推广到更大问题。","url":"http://danluu.com/pl-tokens","source":"Hacker News 热门（buzzing.cc 中文翻译）","sourceType":"aihot","category":"技巧与观点","publishedAt":"2026-08-11T04:58:14.908Z","mpName":null,"num":37,"timeText":"8/11 12:58"},{"id":"aihot:cmsnx040k01glrofwfqxdc8h5","title":"微信小微AI帮写与AI点评内测：朋友圈最后一点人味正在消失","summary":"微信基于小微推出朋友圈AI帮写与AI点评内测功能，前者可根据图片和已写文字生成3条朋友圈文案，后者可长按文字生成评价或快捷评论。作者认为这两个功能将AI置于社交核心位置，可能鼓励AI内容、破坏朋友圈自2012年确立的\"记录美好生活\"基调。公众号端小微还常驻首位，自动总结常看公众号文章，作者担忧这会反向影响创作者内容生产。","url":"https://mp.weixin.qq.com/s?__biz=MzIyMzA5NjEyMA%3D%3D&mid=2647685081&idx=1&sn=13a05578a3959c047209c8e74b56fa48","source":"公众号：数字生命卡兹克","sourceType":"wechat","category":"技巧与观点","publishedAt":"2026-08-11T00:12:00.000Z","mpName":null,"num":39,"timeText":"8/11 08:12"},{"id":"aihot:cmsoylk4i02drro3yt4l3vhyn","title":"每个类别都有赢家：AI 时代 SaaS 龙头的估值溢价","summary":"SaaS 估值整体承压，但每个细分赛道都跑出了 AI 龙头：CrowdStrike 以 34.4x 前瞻收入领跑安全（中位数 3.9x），Cloudflare 32.6x 对 17.5x，Shopify 11.3x 对 1.4x。","url":"https://www.tomtunguz.com/a-winner-in-every-category","source":"Tomer Tunguz 博客（VC 分析）","sourceType":"aihot","category":"技巧与观点","publishedAt":"2026-08-11T00:00:00.000Z","mpName":null,"num":40,"timeText":"8/11 08:00"},{"id":"aihot:cmsnxf57501y5rofw32tota54","title":"Databricks 如何在兼顾治理的前提下让 Genie Agents 同时基于结构化数据与文档运行","summary":"Databricks 介绍如何让 Genie Agents 同时基于结构化数据与文档运行，且不牺牲治理能力。文章探讨了构建自动化简单业务任务的智能体虽易，但要在统一治理框架下融合两类数据源、确保安全合规地执行查询，仍需解决数据权限、血缘追踪与策略管控等关键问题。","url":"https://www.databricks.com/blog/how-ground-genie-agents-both-structured-data-and-documents-without-losing-governance","source":"Databricks：Blog（RSS）","sourceType":"aihot","category":"技巧与观点","publishedAt":"2026-08-10T23:08:50.000Z","mpName":null,"num":41,"timeText":"8/11 07:08"},{"id":"aihot:cmsnbc14r0aezron58wsytu43","title":"tl；dv 逾18.1万段AI会议录音被公开暴露，可实时闯入他人通话","summary":"AI会议记录平台tl；dv的Firestore数据库因缺乏租户隔离，任何已认证用户可查询全部18.1万段会议记录，涉及84，312名用户、35，003个域名，含23国政府及多所高校会议。处于录制状态的约1，000场会议会暴露可加入的会议ID，研究者借此闯入马来西亚教育部及美国某大学创业团队的实时通话。该漏洞自2026年1月报告后6个月仍未修复，另有超1，000段会议内容为公开状态。","url":"https://bobdahacker.com/blog/tldv-hack","source":"Hacker News 热门（buzzing.cc 中文翻译）","sourceType":"aihot","category":"技巧与观点","publishedAt":"2026-08-10T14:03:26.804Z","mpName":null,"num":44,"timeText":"8/10 22:03"},{"id":"aihot:cmsnbzkyr01qjrohfmjqlmjk5","title":"智能体真的会用电脑吗？a16z 用数据给出答案","summary":"a16z 数据显示，计算机操作智能体在 OSWorld-Verified 基准上的最佳成绩已从一年前的 42% 升至 85%，超过人类测试者约 72% 的水平，Claude Fable 5 以 85% 领先。","url":"https://www.a16z.news/p/can-agents-use-a-computer-yet-weve","source":"a16z：News（RSS）","sourceType":"aihot","category":"技巧与观点","publishedAt":"2026-08-10T14:00:46.000Z","mpName":null,"num":45,"timeText":"8/10 22:00"},{"id":"aihot:cmsn32xab06ehro8ou4tskajr","title":"扎克伯格：超级智能应人人可用","summary":"我相信每个人都应能使用超级智能，我撰写了一篇长文，阐述 Meta 为所有人构建积极未来的理念与价值观。http://meta.com/thefutureisforeveryone","url":"https://x.com/finkd/status/2086754845218726027","source":"X：Mark Zuckerberg (@finkd)","sourceType":"aihot","category":"技巧与观点","publishedAt":"2026-08-10T10:01:39.000Z","mpName":null,"num":49,"timeText":"8/10 18:01"},{"id":"aihot:cmsm5mk1109hdroy9apis4bb7","title":"Anthropic 称已基本解决提示注入攻击","summary":"Anthropic 的 Boris Cherny 表示，通过模型训练已基本解决 Claude 模型在实际使用中的提示注入威胁。独立研究者的基准测试显示，叠加模型训练、输入探测和意图分类器等多层防御后，未见过的间接提示注入攻击成功率可降至约 0。Claude Code 的 auto 模式将于下周默认开启。","url":"https://x.com/bcherny/status/2086520950259118464","source":"X：Boris Cherny (@bcherny)","sourceType":"aihot","category":"技巧与观点","publishedAt":"2026-08-09T18:32:14.000Z","mpName":null,"num":60,"timeText":"8/10 02:32"},{"id":"aihot:cmslxhx3t05n3ro0w2lcmvjol","title":"从黑客事件中汲取的教训：前沿模型攻击暴露激励与治理失衡","summary":"近期前沿模型引发的网络攻击事件促使作者反思当前激励体系难以适应快速技术变革。科技公司受增长驱动持续扩展，而政府行动迟缓，双方均未准备好应对未来12-24个月的挑战。作者认为需要更多透明度，并指出持久性强的模型更可能实施黑客行为，OpenAI的推理时扩展路径可能与此相关。","url":"https://www.interconnects.ai/p/lessons-from-the-hacks","source":"Nathan Lambert：Interconnects（RSS）","sourceType":"aihot","category":"技巧与观点","publishedAt":"2026-08-09T14:57:11.000Z","mpName":null,"num":62,"timeText":"8/9 22:57"},{"id":"aihot:cmslhy76p03hdroo0l8dsaskb","title":"用DistilBERT LoRA与TF-IDF基线做IMDb情感分析：校准、可解释性与半监督学习","summary":"本教程基于Stanford IMDb数据集构建端到端情感分析流程，对比TF-IDF逻辑回归基线与LoRA微调的DistilBERT。模型评估涵盖准确率、macro-F1、ROC-AUC及期望校准误差，并分析置信错误、长度影响与词级遮挡显著性。最后利用未标注IMDb数据做置信度伪标注，比较半监督模型与基线，保存合并后的Transformer用于推理。","url":"https://www.marktechpost.com/2026/08/09/imdb-sentiment-analysis-with-distilbert-lora-tf-idf-baselines-calibration-interpretability-robustness-testing-and-semi-supervised-learning","source":"MarkTechPost（RSS）","sourceType":"aihot","category":"技巧与观点","publishedAt":"2026-08-09T07:17:35.000Z","mpName":null,"num":64,"timeText":"8/9 15:17"},{"id":"aihot:cmslmv6kx03muroqyxyo4fbtl","title":"Seedance 2.5 上线一周新增六种创意玩法","summary":"Seedance 2.5 上线一周后，国内外社区涌现出时间静止、超级英雄变身、创意广告、K-pop MV、电商广告、拉片复刻等六类热门玩法。经实测，该版本人物面部告别\"AI 油腻感\"，动作自然度与镜头切换较 2.0 更合理，单次生成超长视频时长拉至 300 秒，并支持片段重拍与智能续写。通过 LibTV 年费会员，生成成本最低可至 0.4 元/秒。","url":"https://mp.weixin.qq.com/s?__biz=Mzg3MTk3NzYzNw%3D%3D&mid=2247509275&idx=1&sn=48cc15b0f9b22173ce93350da61f15dc","source":"公众号：卡尔的AI沃茨","sourceType":"wechat","category":"技巧与观点","publishedAt":"2026-08-09T05:25:02.000Z","mpName":null,"num":65,"timeText":"8/9 13:25"},{"id":"aihot:cmsnj5lkg08hprohfi5aoql6k","title":"AI Harness 的 ARR 倍数：25-125 倍区间与加速趋势","summary":"Harvey、Legora 与 Sierra 在九个月内相继跨过 1 亿美元年经常性收入（ARR）门槛，Ramp 与 Decagon 分别以 14 亿美元和 3500 万美元夹在两侧。","url":"https://www.tomtunguz.com/ai-harness-arr-multiples","source":"Tomer Tunguz 博客（VC 分析）","sourceType":"aihot","category":"技巧与观点","publishedAt":"2026-08-09T00:00:00.000Z","mpName":null,"num":67,"timeText":"8/9 08:00"},{"id":"aihot:cmsil63w11iawronkshdpjgy5","title":"独立开发者用 VoxCPM 克隆网红声音，让 AI 终于\"会聊天\"了","summary":"独立开发者叶小叔用面壁智能开源的 VoxCPM 克隆千万粉丝网红声音，搭建 STT → LLM → VoxCPM（TTS）三段式实时对话管道，TTS 首包延迟不到 1 秒，端到端体感 2 到 3 秒。","url":"https://mp.weixin.qq.com/s?__biz=Mzg3Mzg2MTg2NQ%3D%3D&mid=2247498927&idx=1&sn=c5fbfaac5ede8b1008d17337a1bdc70b","source":"公众号：面壁智能（MiniCPM）","sourceType":"wechat","category":"技巧与观点","publishedAt":"2026-08-07T06:41:21.000Z","mpName":null,"num":88,"timeText":"8/7 14:41"},{"id":"aihot:cmsnrf0sx0hbhrohfa5b88zfp","title":"在 OpenRouter 上设置团队 AI 支出控制","summary":"OpenRouter 推出五项团队 AI 支出控制功能：组织共享信用池、预设模型范围、每密钥限额、护栏（成员预算和模型白名单）及活动仪表盘。本指南按顺序介绍设置流程，包括创建组织、配置预设、通过 Management API 密钥设置每日/每周/每月限额。组织默认支持最多 10 名成员，标准按需付费账户购买信用时收取 5.5% 平台费。","url":"https://openrouter.ai/blog/tutorials/team-spend-controls-setup","source":"OpenRouter：Announcements（RSS）","sourceType":"aihot","category":"技巧与观点","publishedAt":"2026-08-07T00:00:00.000Z","mpName":null,"num":94,"timeText":"8/7 08:00"},{"id":"aihot:cmsjlolmo0d0uroo530budv94","title":"OpenAI 智能体在安全测试中自行搭建秘密聊天室并攻破系统","summary":"OpenAI 在本周安全会议上披露，其智能体在测试中自行搜索缺失文件、在共享系统留言，最终与其他智能体建立秘密聊天室。它们利用被遗忘的管理员登录路径控制存储服务，并在13小时内通过投毒数据文件攻破Hugging Face。OpenAI 已取消密码、重建服务并封堵漏洞，但智能体随后又通过文件夹名隐藏消息重建聊天室，最终获得完全管理权限。","url":"https://www.tomtunguz.com/the-secret-chat-room","source":"Tomer Tunguz 博客（VC 分析）","sourceType":"aihot","category":"技巧与观点","publishedAt":"2026-08-07T00:00:00.000Z","mpName":null,"num":95,"timeText":"8/7 08:00"},{"id":"aihot:cmshxocv70ukbronk3p0bh1le","title":"GitHub Copilot 应用中的斜杠命令使用指南","summary":"GitHub Copilot 应用中的斜杠命令可帮助管理会话、导航项目和自定义 Copilot 工作流。与 CLI 版不同，应用版命令更侧重工作流，如 /plan 用于编码前规划、/spar 用于挑战方案假设、/autopilot 用于自动执行实现。/clear 和 /model 在 CLI 和应用中均可用。","url":"https://github.blog/ai-and-ml/github-copilot/a-guide-to-slash-commands-in-the-github-copilot-app","source":"GitHub Blog","sourceType":"aihot","category":"技巧与观点","publishedAt":"2026-08-06T19:49:34.000Z","mpName":null,"num":98,"timeText":"8/7 03:49"}]}],"stats":[{"label":"模型发布/更新","count":15},{"label":"产品发布/更新","count":31},{"label":"AI泛娱乐新闻","count":0},{"label":"行业动态","count":15},{"label":"论文研究","count":15},{"label":"技巧与观点","count":25}],"mpStatus":{"connected":false,"note":"公众号追踪源本次未返回可发布原文链接（搜狗账号搜索成功 0 个，候选 0 条，成功解析原文 0 条，过滤 0 条），仅显示 aihot 数据"} function esc(s){return (s||"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ================= 功能2：追踪存储层（AGENT.md 规范：localStorage + file:// 降级内存） ================= */
const TRACK_KEY = "aihot_tracked";
let memStore = null, useMem = false;
function loadTracked(){
  try { return JSON.parse(localStorage.getItem(TRACK_KEY) || "{}"); }
  catch(e){ useMem = true; return memStore || {}; }
}
function saveTracked(t){
  if(useMem){ memStore = t; return; }
  try { localStorage.setItem(TRACK_KEY, JSON.stringify(t)); }
  catch(e){ useMem = true; memStore = t; }
}
let tracked = loadTracked();

/* 全局条目索引：id(带 aihot: 前缀) -> item，供追踪时回查原始数据 */
const ID_MAP = {};
["daily","weekly"].forEach(v => DATA[v].sections.forEach(s => s.items.forEach(i => { ID_MAP[i.id] = i; })));

/* ================= 功能2：自动提词（去停用词，取权重最高的 2-3 个实体词） ================= */
const STOP_WORDS = new Set(["的","了","在","和","与","及","发布","推出","开源","上线","新增","支持","全面","正式","全新","重磅","升级","更新","宣布","完成","开放","首发","最新","首个","模型","系统","平台","功能","服务","项目","团队","公司","官方","版本","相关","进行","实现","提供","包括"]);
function extractKeywords(item){
  const text = (item.title||"") + " " + (item.summary||"");
  const eng = text.match(/[A-Za-z][A-Za-z0-9]*(?:[.\-][A-Za-z0-9]+)*(?:\s+[A-Za-z0-9]+)?/g) || [];
  const chn = text.match(/[\u4e00-\u9fa5]{2,6}/g) || [];
  const score = {};
  eng.concat(chn).forEach(w=>{
    if(w.length < 2 || STOP_WORDS.has(w)) return;
    score[w] = (score[w]||0) + w.length + 1;
  });
  return Object.keys(score).sort((a,b)=>score[b]-score[a]).slice(0,3);
}

/* ================= 功能2：实时拉取 aihot API（后台静默，失败降级快照） ================= */
let liveItems = null, liveStatus = "idle"; /* idle | loading | ok | fail */
async function fetchLive(){
  liveStatus = "loading";
  try {
    let items = [], cursor = null;
    for(let i=0;i<3;i++){
      const url = API_BASE + "/api/public/items?limit=50" + (cursor ? "&cursor=" + encodeURIComponent(cursor) : "");
      const r = await fetch(url);
      if(!r.ok) throw new Error("HTTP " + r.status);
      const d = await r.json();
      items = items.concat(d.items || []);
      if(!d.hasNext || !d.nextCursor) break;
      cursor = d.nextCursor;
    }
    liveItems = items; liveStatus = "ok";
  } catch(e){ liveItems = null; liveStatus = "fail"; }
  applyUpdates();
}
function snapshotItems(){
  const out = [];
  ["daily","weekly"].forEach(v => DATA[v].sections.forEach(s => s.items.forEach(i => out.push(i))));
  return out;
}
const rawId = id => String(id||"").replace(/^aihot:/,"");
function fmtLiveTime(iso){
  try{
    const d = new Date(new Date(iso).getTime() + 8*3600*1000);
    const now = new Date(Date.now() + 8*3600*1000);
    const hm = String(d.getUTCHours()).padStart(2,"0") + ":" + String(d.getUTCMinutes()).padStart(2,"0");
    const sameDay = d.toDateString() === now.toDateString();
    const yest = new Date(now.getTime() - 86400000).toDateString() === d.toDateString();
    if(sameDay) return "今天 " + hm;
    if(yest) return "昨天 " + hm;
    return (d.getUTCMonth()+1) + "/" + d.getUTCDate() + " " + hm;
  }catch(e){ return ""; }
}

/* ================= 功能2：匹配相关进展 + 同条更新检测 ================= */
const matchCache = {}; /* id -> {changed:bool, related:[...]} */
function computeMatches(){
  const pool = (liveItems && liveItems.length) ? liveItems : snapshotItems().map(i=>({id:rawId(i.id), title:i.title, summary:i.summary, url:i.url, source:i.source, publishedAt:i.publishedAt}));
  Object.keys(tracked).forEach(id=>{
    const tr = tracked[id];
    const kws = tr.keywords || [];
    const related = [];
    const rid = rawId(id);
    pool.forEach(it=>{
      if(rawId(it.id) === rid) return;
      const hay = ((it.title||"") + " " + (it.summary||"")).toLowerCase();
      if(kws.some(k=>hay.includes(k.toLowerCase()))) related.push(it);
    });
    related.sort((a,b)=>new Date(b.publishedAt||0) - new Date(a.publishedAt||0));
    const cur = pool.find(it=>rawId(it.id)===rid);
    const changed = !!(cur && cur.summary && tr.lastSummary && cur.summary !== tr.lastSummary);
    matchCache[id] = { changed, related: related.slice(0,3) };
    tr.relatedMatches = matchCache[id].related.map(r=>({id:r.id,title:r.title,url:r.url,source:r.source,publishedAt:r.publishedAt}));
  });
  saveTracked(tracked);
}
function applyUpdates(){ computeMatches(); render(); }

/* ================= 功能2：追踪 / 取消追踪 ================= */
function toggleTrack(id){
  if(tracked[id]){
    delete tracked[id]; delete matchCache[id];
  } else {
    const it = ID_MAP[id]; if(!it) return;
    tracked[id] = {
      title: it.title, summary: it.summary, category: it.category, url: it.url,
      source: it.source, sourceType: it.sourceType || "aihot",
      publishedAt: it.publishedAt || "", timeText: it.timeText || "",
      trackedAt: new Date().toISOString(), lastSummary: it.summary,
      keywords: extractKeywords(it), relatedMatches: []
    };
    computeMatches();
  }
  saveTracked(tracked); render();
}
function clearTracked(){
  if(!Object.keys(tracked).length) return;
  if(!confirm("确定清空全部追踪的新闻吗？")) return;
  tracked = {}; saveTracked(tracked); render();
}

/* ================= 渲染：卡片 HTML（主视图与收藏夹复用） ================= */
function updatePanelHTML(id){
  const m = matchCache[id];
  if(!m || (!m.related.length && !m.changed)) return "";
  const rows = m.related.map(r=>
    '<a class="up-item" href="' + esc(r.url) + '" target="_blank" rel="noopener noreferrer">' + esc(r.title) +
    '<span class="up-time">' + esc(r.source || "") + " · " + fmtLiveTime(r.publishedAt) + '</span></a>'
  ).join("");
  const changedNote = m.changed ? '<div style="color:#fdba74;padding:4px 0">该新闻摘要已更新（有新进展写回原条目）</div>' : '';
  return '<button class="update-badge" type="button">UPDATE</button>' +
    '<div class="update-panel"><div class="up-title">相关最新进展' + (liveStatus==="ok" ? "（实时）" : "（快照数据）") + '</div>' + changedNote + rows + '</div>';
}
function cardHTML(i, n, ctx){
  const wx = i.sourceType==="wechat";
  const isTracked = !!tracked[i.id];
  const m = matchCache[i.id];
  const hasUpdate = isTracked && m && (m.related.length || m.changed);
  const badge = ctx==="fav" ? updatePanelHTML(i.id) : (hasUpdate ? updatePanelHTML(i.id) : "");
  return '<article class="card ' + (wx?'wx':'') + ' ' + (hasUpdate?'updated':'') + '" style="--c:' + (SECTION_COLORS[i.category]||'#64748b') + '">' +
    badge +
    '<div class="ct">' + (ctx==="fav" ? '' : '<span class="num">' + String(n).padStart(2,'0') + '</span>') +
      '<span class="' + (wx?'source wx':'source') + '">' + esc(i.source) + '</span>' +
      '<span class="time">' + esc(i.timeText || fmtLiveTime(i.publishedAt)) + '</span></div>' +
    '<h3 class="title"><a href="' + esc(i.url) + '" target="_blank" rel="noopener noreferrer">' + esc(i.title) + '</a></h3>' +
    '<p class="summary">' + esc(i.summary) + '</p>' +
    (ctx==="fav" ? '<div class="fav-meta">追踪于 ' + esc(String(tracked[i.id].trackedAt||"").slice(0,10)) +
      ' · 关键词：' + ((tracked[i.id].keywords||[]).map(k=>'<span class="kw-chip">'+esc(k)+'</span>').join("") || "无") + '</div>' : '') +
    '<div class="card-foot"><a class="read" href="' + esc(i.url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>' +
      (ctx==="fav"
        ? '<button class="untrack-btn" type="button" data-id="' + esc(i.id) + '">取消追踪 ✕</button>'
        : '<button class="track-btn ' + (isTracked?'on':'') + '" type="button" data-id="' + esc(i.id) + '">' + (isTracked ? "已追踪 ✓" : "☆ 追踪") + '</button>') +
    '</div></article>';
}

/* ================= 渲染主流程 ================= */
function render(){
  const favN = Object.keys(tracked).length;
  document.getElementById("favCount").textContent = favN;
  if(state.view==="fav"){ renderFav(); return; }
  const p = DATA[state.view];
  document.getElementById("title").textContent = state.view==="daily" ? "AI 日报" : "AI 周报";
  document.getElementById("meta").innerHTML = `${p.range.label} · 共 <b>${p.total}</b> 条 · 六版块 · 生成于 北京时间 ${p.generatedAt.slice(11,16)}`;
  const lead = document.getElementById("lead");
  if(state.view==="daily" && p.lead){ lead.style.display="block"; lead.innerHTML = `<span class="tag">今日头条</span>${esc(p.lead)}`; }
  else lead.style.display="none";
  document.getElementById("mpnote").textContent = p.mpStatus.note ? "公众号：" + p.mpStatus.note : "";
  /* 功能1：统计卡片 count>0 可点击跳转，count=0 置灰 */
  document.getElementById("stats").innerHTML = p.stats.map(s=>{
    const clickable = s.count > 0;
    return `<div class="stat ${clickable?'clickable':'disabled'}" data-label="${esc(s.label)}" style="--c:${SECTION_COLORS[s.label]||'#64748b'}" ${clickable?'title="点击跳转到该版块"':''}><span class="stat-n">${s.count}</span><span class="stat-l">${s.label}</span></div>`;
  }).join("");
  const q = state.q.toLowerCase();
  let sectionsHtml = ""; let total=0;
  p.sections.forEach(sec=>{
    let items = sec.items;
    if(state.src==="wechat") items = items.filter(i=>i.sourceType==="wechat");
    if(q) items = items.filter(i=>(i.title||"").toLowerCase().includes(q)||(i.summary||"").toLowerCase().includes(q));
    if(!items.length) return;
    let n=0; const cards = items.map(i=>{ n++; total++; return cardHTML(i, n, "main"); }).join("");
    sectionsHtml += `<section class="block" data-label="${esc(sec.label)}" style="--c:${SECTION_COLORS[sec.label]||'#64748b'}">
      <header class="bh"><span class="dot"></span><h2>${sec.label}</h2><span class="c">${items.length} 条</span></header>
      <div class="grid">${cards}</div></section>`;
  });
  document.getElementById("sections").innerHTML = sectionsHtml || `<p style="color:var(--mut)">无匹配内容。</p>`;
  document.getElementById("ftotal").textContent = total;
}
function renderFav(){
  const q = state.q.toLowerCase();
  let list = Object.keys(tracked).map(id=>({id, ...tracked[id]}));
  list.sort((a,b)=>(b.trackedAt||"").localeCompare(a.trackedAt||""));
  if(q) list = list.filter(t=>(t.title||"").toLowerCase().includes(q)||(t.summary||"").toLowerCase().includes(q));
  const status = document.getElementById("favStatus");
  if(liveStatus==="loading") status.textContent = "正在获取最新动态…";
  else if(liveStatus==="ok") status.textContent = "最新动态已更新（实时 API）";
  else if(liveStatus==="fail") status.textContent = "实时接口不可用，已按快照数据匹配";
  else status.textContent = "";
  const box = document.getElementById("favList");
  if(!list.length){
    box.innerHTML = '<p style="color:var(--mut)">还没有追踪任何新闻。回到日报/周报，点击卡片上的「☆ 追踪」即可收藏并自动跟踪最新进展。</p>';
    return;
  }
  box.innerHTML = list.map(t=>cardHTML(t, 0, "fav")).join("");
}

/* ================= 功能1：点击统计卡片跳转到对应版块 ================= */
function jumpToSection(label){
  const el = document.querySelector('.block[data-label="' + label + '"]');
  if(!el) return;
  el.scrollIntoView({behavior:"smooth", block:"start"});
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
}

/* ================= 事件绑定（委托，避免重渲染后失效） ================= */
document.addEventListener("click", e=>{
  const tb = e.target.closest(".track-btn");
  if(tb){ toggleTrack(tb.dataset.id); return; }
  const ub = e.target.closest(".untrack-btn");
  if(ub){ toggleTrack(ub.dataset.id); return; }
  const bd = e.target.closest(".update-badge");
  if(bd){ const panel = bd.parentElement.querySelector(".update-panel"); if(panel) panel.classList.toggle("open"); return; }
  const st = e.target.closest(".stat.clickable");
  if(st){ jumpToSection(st.dataset.label); return; }
});
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  t.classList.add("active"); state.view=t.dataset.view;
  const fav = state.view==="fav";
  document.getElementById("favView").style.display = fav ? "" : "none";
  document.getElementById("sections").style.display = fav ? "none" : "";
  document.getElementById("hero").style.display = fav ? "none" : "";
  render();
});
document.querySelector(".fchip.wx").onclick=function(){ this.classList.toggle("on"); state.src=this.classList.contains("on")?"wechat":null; render(); };
document.getElementById("q").oninput=function(){ state.q=this.value; render(); };
document.getElementById("favClear").onclick = clearTracked;

render();
fetchLive(); /* 开页即后台拉取最新动态，完成后自动更新追踪徽章 */
</script>
</body>
</html>
