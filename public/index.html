<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI HOT 仪表盘 · 日报 / 周报</title>
<style>
  :root{--bg:#0b0e14;--bg2:#11151f;--card:#161b27;--card2:#1b2230;--txt:#e6e9ef;--mut:#9aa4b2;--line:#222a38;--accent:#6366f1;--wx:#07c160;--up:#f97316;--fav:#fcd34d;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(1200px 600px at 80% -10%,#1a2138 0%,var(--bg) 55%) fixed;color:var(--txt);line-height:1.6;padding-bottom:64px}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px}
  .hero{padding:40px 0 22px}
  .kicker{color:var(--mut);font-size:13px;letter-spacing:.18em;text-transform:uppercase}
  .hero h1{font-size:clamp(26px,5vw,42px);font-weight:800;margin:8px 0 4px;background:linear-gradient(90deg,#a5b4fc,#67e8f9,#fcd34d);-webkit-background-clip:text;background-clip:text;color:transparent}
  .meta{color:var(--mut);font-size:14px;margin-top:4px}.meta b{color:var(--txt)}
  .lead{margin-top:10px;font-size:14px;color:#cbd5e1;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:10px 14px}
  .lead .tag{color:var(--accent);font-weight:700;margin-right:6px}
  .stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-top:20px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;border-top:3px solid var(--c);transition:.18s}
  .stat-n{display:block;font-size:24px;font-weight:800;color:var(--c)}
  .stat-l{display:block;font-size:12px;color:var(--mut);margin-top:3px}
  /* 功能1：可点击的统计卡片（count>0），count=0 置灰不可点 */
  .stat.clickable{cursor:pointer}
  .stat.clickable:hover{transform:translateY(-2px);border-color:var(--c);box-shadow:0 8px 24px -12px var(--c)}
  .stat.disabled{opacity:.45;cursor:default}
  /* 功能1：版块跳转高亮闪烁 */
  .block.flash{animation:secflash 1.6s ease}
  @keyframes secflash{0%,100%{box-shadow:none}15%,45%{box-shadow:0 0 0 3px var(--c),0 0 40px -8px var(--c);border-radius:14px}}
  .bar{position:sticky;top:0;z-index:30;background:rgba(11,14,20,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin:14px 0 24px}
  .bar-in{display:flex;gap:8px;flex-wrap:wrap;align-items:center;max-width:1180px;margin:0 auto;padding:10px 20px}
  .tab{font-weight:700;font-size:14px;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--mut);cursor:pointer;transition:.18s}
  .tab.active{color:#0b0e14;background:linear-gradient(90deg,#a5b4fc,#67e8f9);border-color:transparent}
  /* 功能2：收藏 tab */
  .tab.fav{border-color:rgba(252,211,77,.4);color:var(--fav)}
  .tab.fav.active{color:#0b0e14;background:linear-gradient(90deg,#fcd34d,#f59e0b)}
  .tab.fav .fav-n{font-size:11px;background:rgba(252,211,77,.18);border-radius:999px;padding:1px 7px;margin-left:5px}
  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
  .fchip{font-size:12.5px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card2);color:var(--mut);cursor:pointer;transition:.18s}
  .fchip.on{color:var(--txt);border-color:var(--accent);background:#1e2436}
  .fchip.wx.on{color:#062; border-color:var(--wx);background:#0c2a18}
  #q{background:var(--card2);border:1px solid var(--line);border-radius:999px;color:var(--txt);padding:6px 12px;font-size:12.5px;outline:none}
  .block{margin-bottom:36px;scroll-margin-top:64px}
  .bh{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:9px;border-bottom:1px solid var(--line)}
  .bh .dot{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c)}
  .bh h2{font-size:19px;font-weight:700}.bh .c{margin-left:auto;font-size:13px;color:var(--mut)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  .card{position:relative;background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:16px;padding:17px 17px 15px;display:flex;flex-direction:column;min-height:165px;transition:.18s;overflow:hidden}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c);opacity:.85}
  .card.wx::before{background:var(--wx)}
  .card:hover{transform:translateY(-3px);border-color:var(--c);box-shadow:0 10px 30px -12px var(--c)}
  .card.wx:hover{border-color:var(--wx);box-shadow:0 10px 30px -12px var(--wx)}
  /* 功能2：有更新的追踪卡片橙色高亮边框 */
  .card.updated{border-color:var(--up)}
  .ct{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .num{font-size:12.5px;font-weight:800;color:#0b0e14;background:#a5b4fc;border-radius:8px;padding:2px 8px;min-width:32px;text-align:center}
  .card.wx .num{background:#6ee7b7}
  .source{font-size:11.5px;color:var(--mut);background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:2px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .source.wx{color:#7ee2a8;border-color:#0c3a22}
  .time{margin-left:auto;font-size:11px;color:var(--mut)}
  .title{font-size:16px;font-weight:700;line-height:1.4;margin-bottom:7px}
  .title a{color:var(--txt);text-decoration:none}.title a:hover{color:#a5b4fc;text-decoration:underline;text-decoration-color:var(--accent)}
  .card.wx .title a:hover{color:#6ee7b7}
  .summary{font-size:13px;color:var(--mut);flex:1;margin-bottom:13px}
  /* 功能2：卡片底部行（阅读原文 + 追踪按钮） */
  .card-foot{display:flex;align-items:center;gap:8px;margin-top:auto}
  .read{font-size:12.5px;font-weight:600;color:#a5b4fc;text-decoration:none;border:1px solid var(--accent);border-radius:9px;padding:5px 11px;transition:.18s}
  .read:hover{background:var(--accent);color:#0b0e14}
  .card.wx .read{color:#6ee7b7;border-color:var(--wx)}.card.wx .read:hover{background:var(--wx);color:#04130b}
  .track-btn{margin-left:auto;font-size:12px;font-weight:600;color:var(--mut);background:transparent;border:1px solid var(--line);border-radius:9px;padding:5px 11px;cursor:pointer;transition:.18s;white-space:nowrap}
  .track-btn:hover{color:var(--fav);border-color:var(--fav)}
  .track-btn.on{color:#0b0e14;background:var(--fav);border-color:var(--fav)}
  /* 功能2：UPDATE 徽章（橙红渐变 + 脉冲），点击展开相关进展 */
  .update-badge{position:absolute;top:10px;right:10px;font-size:10.5px;font-weight:800;letter-spacing:.06em;color:#fff;background:linear-gradient(90deg,#f97316,#ef4444);border:none;border-radius:999px;padding:3px 10px;cursor:pointer;animation:uppulse 1.6s infinite;z-index:2}
  @keyframes uppulse{0%,100%{box-shadow:0 0 0 0 rgba(249,115,22,.55)}50%{box-shadow:0 0 0 7px rgba(249,115,22,0)}}
  .update-panel{display:none;margin:0 0 10px;border:1px solid #7c2d12;background:#1c1310;border-radius:10px;padding:8px 11px;font-size:12px}
  .update-panel.open{display:block}
  .update-panel .up-title{color:#fdba74;font-weight:700;margin-bottom:5px}
  .up-item{display:block;color:#cbd5e1;text-decoration:none;padding:4px 0;border-top:1px dashed #3f2212;line-height:1.45}
  .up-item:first-of-type{border-top:none}
  .up-item:hover{color:#fdba74}
  .up-item .up-time{color:var(--mut);font-size:11px;margin-left:6px;white-space:nowrap}
  /* 功能2：收藏夹视图 */
  .fav-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .fav-head h2{font-size:19px;font-weight:700}
  .fav-status{font-size:12.5px;color:var(--mut)}
  .fav-clear{margin-left:auto;font-size:12px;font-weight:600;color:#fca5a5;background:transparent;border:1px solid #7f1d1d;border-radius:9px;padding:5px 12px;cursor:pointer;transition:.18s}
  .fav-clear:hover{background:#7f1d1d;color:#fee2e2}
  .fav-grid{display:grid;grid-template-columns:1fr;gap:14px}
  .fav-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--mut);margin:6px 0 4px}
  .kw-chip{font-size:11px;color:#c4b5fd;background:rgba(139,92,246,.14);border:1px solid rgba(139,92,246,.35);border-radius:999px;padding:1px 8px}
  .untrack-btn{font-size:11.5px;font-weight:600;color:var(--mut);background:transparent;border:1px solid var(--line);border-radius:8px;padding:3px 10px;cursor:pointer;transition:.18s;white-space:nowrap}
  .untrack-btn:hover{color:#fca5a5;border-color:#7f1d1d}
  .mpnote{margin:10px 0 0;font-size:12.5px;color:var(--wx)}
  .foot{border-top:1px solid var(--line);margin-top:22px;padding-top:18px;color:var(--mut);font-size:12.5px;text-align:center}
  .foot a{color:#67e8f9;text-decoration:none}
  @media(max-width:720px){.stats{grid-template-columns:repeat(3,1fr)}.hero{padding:30px 0 16px}.filters{margin-left:0;width:100%}}
</style>
</head>

le":"llm-d 1.0 发布：Kubernetes 原生分布式推理服务走向生产就绪","summary":"IBM、Red Hat 和 Google 等主导的开源推理项目 llm-d 在 PyTorch Conference North America 上发布 llm-d 1.0，这是一个 Kubernetes 原生的分布式推理服务框架，支持任意模型、任意加速器和任意云。","url":"https://research.ibm.com/blog/llmd-1-0-is-ready-for-production-inference-serving?utm_medium=rss&utm_source=rss","source":"IBM Research：AI","sourceType":"aihot","category":"产品发布/更新","publishedAt":"2026-10-20T12:00:00.000Z","mpName":null,"num":3,"timeText":"昨天 20:00"},{"id":"aihot:ckykonvith99q6hvd0utjdwfn","title":"DeepSeek 全面开源内部推理框架 DeepInfer","summary":"DeepSeek 宣布将内部推理框架 DeepInfer 全面开源，并同步开源生产级 Token 编解码组件 deepseek-recipe。","url":"https://mp.weixin.qq.com/s?__biz=Mzk0OTYwNzc3NQ%3D%3D&mid=2247485884&idx=1&sn=d457981abe7db1f1b5d600fc109dc836","source":"公众号：DeepSeek（深度求索）","sourceType":"wechat","category":"产品发布/更新","publishedAt":"2026-10-20T08:54:54.000Z","mpName":null,"num":4,"timeText":"昨天 16:54"},{"id":"aihot:hnasqdie0vmly79xyg2ehqcgb","title":"Inception 扩散模型 Mercury 3 上线 OpenRouter","summary":"Inception 的扩散模型 Mercury 3 上线 OpenRouter，生成速度超 1,000 tok/s，支持 1M 上下文，是 Mercury 2.5 的 4 倍。Inception 报告其在 IFBench、GPQA Diamond 和 SWE-Bench Atlas 上超过 GPT-6 Luna 和 Haiku 5.5；上线期五折，价格 $0.10/M 输入、$0.35/M 输出。","url":"https://x.com/OpenRouter/status/2112225779782398131","source":"X：OpenRouter (@OpenRouter)","sourceType":"aihot","category":"产品发布/更新","publishedAt":"2026-10-19T16:54:03.000Z","mpName":null,"num":13,"timeText":"昨天 00:54"},{"id":"aihot:mlusnw9gi199uld4ixj58m2cz","title":"Google 发布 vLLM 与 SGLang 的 TorchTPU 原生推理引擎","summary":"Google 在 PyTorch 相关公告中推出基于 TorchTPU 的 vLLM 和 SGLang 原生 PyTorch 推理引擎，分别与 Inferact、RadixArk 合作开发，让开发者用熟悉的 PyTorch 工具在 TPU 上部署模型。","url":"https://developers.googleblog.com/announcing-new-vllm-and-sglang-inference-engines-on-tpu/","source":"Google Developers Blog（RSS）","sourceType":"aihot","category":"产品发布/更新","publishedAt":"2026-10-19T16:00:00.000Z","mpName":null,"num":18,"timeText":"昨天 00:00"},{"id":"aihot:szf3v3re4888fzekwoohhu8b4","title":"AWS 发布 TorchNeuron：Trainium 的原生 PyTorch 后端开源","summary":"AWS 宣布推出 TorchNeuron，一个面向 Trainium 的开源原生 PyTorch 后端，10 月 20 日以 Apache 2.0 协议在 PyTorch Conference North America 开启公测。","url":"https://pytorch.org/blog/introducing-torchneuron-native-pytorch-backend-for-aws-trainium/","source":"PyTorch：Blog（RSS）","sourceType":"aihot","category":"产品发布/更新","publishedAt":"2026-10-19T12:45:23.000Z","mpName":null,"num":29,"timeText":"10/19 20:45"},{"id":"aihot:a1dez7azk8nkmj0mgeb9pep03","title":"SGLang 发布 Low-Latency Mode，通过插件框架在 NVIDIA 和 AMD GPU 上降低推理延迟","summary":"SGLang 团队推出 Low-Latency Mode，通过插件框架引入专用内核，在 NVIDIA GB300 和 AMD MI355X GPU 上显著降低推理延迟。","url":"https://www.lmsys.org/blog/2026-10-18-sglang-low-latency-mode","source":"LMSYS Blog","sourceType":"aihot","category":"产品发布/更新","publishedAt":"2026-10-17T16:00:00.000Z","mpName":null,"num":40,"timeText":"10/18 00:00"},{"id":"aihot:xgj246drlw70qbgypibz6atla","title":"WorkBuddy Intl 更新支持 DeepSeek-V4.1-Flash-1017，10 月 31 日前免费","summary":"WorkBuddy Intl 已更新至最新的 DeepSeek-V4.1-Flash-1017 模型，10 月 31 日前免费开放。引用的 DeepSeek 官方内容称该模型相比上一版性能更强、任务完成更快、输出更短，已上线网站、App 和 API，并针对 DeepSeek Harness、Tencent CodeBuddy、WorkBuddy 等做了优化。","url":"https://x.com/WorkBuddy_AI/status/2111404103402430558","source":"X：Tencent WorkBuddy (@WorkBuddy_AI)","sourceType":"aihot","category":"产品发布/更新","publishedAt":"2026-10-17T10:29:00.000Z","mpName":null,"num":41,"timeText":"10/17 18:29"},{"id":"aihot:x7hxr1lvyddc8hrbrugfx4uyg","title":"DeepSeek 开放自研搜索 API","summary":"DeepSeek 开放自研搜索 API，底层由 AI 原生的 DeepSeek 搜索引擎提供，每天稳定处理数亿次搜索请求。该引擎索引全球千亿级网页、支持多语言，并通过识别机制过滤 SEO 作弊、GEO 操纵和低质 AIGC，使用方式见网页搜索与抓取指南。","url":"https://api-docs.deepseek.com/zh-cn/updates/#开放自研搜索-api","source":"DeepSeek：API 更新日志","sourceType":"aihot","category":"产品发布/更新","publishedAt":"2026-10-16T16:00:00.000Z","mpName":null,"num":45,"timeText":"10/17 00:00"},{"id":"aihot:rq32az1hr7zpbipiyega9ehjr","title":"NVIDIA RTX Spark 笔记本今日开售，主打 128GB 统一内存与本地 AI","summary":"NVIDIA 宣布 RTX Spark 笔记本正式开售，来自 ASUS、Dell、HP、Lenovo、Microsoft 和 MSI，起价 $2,599。","url":"https://nvidianews.nvidia.com/news/nvidia-rtx-spark-pcs-available-today-a-new-beginning-for-windows-pcs","source":"NVIDIA：Newsroom（RSS）","sourceType":"aihot","category":"产品发布/更新","publishedAt":"2026-10-16T12:00:00.000Z","mpName":null,"num":48,"timeText":"10/16 20:00"},{"id":"aihot:kbccvteado5kgzbk5ah9yv5ip","title":"Kling 4.0 深夜上线，作者实测30秒一镜到底与全能参考表现","summary":"可灵AI凌晨正式上线视频模型 Kling 4.0，作者烧数万积分实测后认为其在大范围动态、复杂动作衔接和全能参考可控性上有扎实进步。支持最长30秒一镜到底直出，视频首尾帧改为最多10帧的多帧参考；1080P 30秒约450积分，720P 20秒的 Kling 4.0 Flash 仅120积分，作者推荐先用 Flash 打样再用正式版出片，此外10-bit 4K HDR 输出规格尚未上线。","url":"https://x.com/Khazix0918/status/2110914404393091205","source":"X：卡兹克 (@Khazix0918)","sourceType":"aihot","category":"产品发布/更新","publishedAt":"2026-10-16T02:03:07.000Z","mpName":null,"num":52,"timeText":"10/16 10:03"},{"id":"aihot:i6u3av7zg8n3gfy6g7ynhns56","title":"SGLang 原生支持 Reflection 的 Beam 并驱动其生产 API","summary":"SGLang 团队宣布原生支持 Reflection 的 Beam 1.0（501B 参数 MoE、每 token 激活 23B），并以其驱动 Reflection 的生产 API。","url":"https://www.lmsys.org/blog/2026-10-16-beam","source":"LMSYS Blog","sourceType":"aihot","category":"产品发布/更新","publishedAt":"2026-10-16T00:00:00.000Z","mpName":null,"num":58,"timeText":"10/16 08:00"},{"id":"aihot:f14brdupsvks0k2hoang4lx6w","title":"Reflection 开源权重模型 Beam 上架 Ollama，限时免费可用","summary":"Reflection 首个开源权重模型 Beam 发布，Ollama 作为 day-zero 合作方在 Ollama Cloud 上限时免费提供，且全程零数据保留（ZDR）。","url":"https://ollama.com/blog/reflection-beam","source":"Ollama：Blog（RSS）","sourceType":"aihot","category":"产品发布/更新","publishedAt":"2026-10-16T00:00:00.000Z","mpName":null,"num":59,"timeText":"10/16 08:00"},{"id":"aihot:d0pow9b93paydjtg2i76ang83","title":"vLLM 实现 Reflection Beam 501B MoE 模型 Day 0 支持","summary":"vLLM 宣布从 Day 0 支持 Reflection 的 Beam 模型，这是一个 501B 参数、每 token 激活 23B 的 MoE 模型，在 NVIDIA Blackwell 上完成优化。","url":"https://vllm.ai/blog/2026-10-16-reflection-beam","source":"vLLM 官方博客（RSS）","sourceType":"aihot","category":"产品发布/更新","publishedAt":"2026-10-16T00:00:00.000Z","mpName":null,"num":60,"timeText":"10/16 08:00"},{"id":"aihot:ee1w5w87zh8hhwwwzqm8w65rd","title":"Krea 3 图像模型通过 ComfyUI Partner Nodes 上线","summary":"Krea 3 图像模型现已在 ComfyUI 通过 Partner Nodes 提供，主打基于参考图的生成与编辑。模型强调更快的迭代速度和更低的单张成本，支持按上传顺序引用多张参考图、保持产品标签形状材质不变的前提下修改环境光影构图，并可将生成结果作为新输入继续编辑。","url":"https://blog.comfy.org/p/krea-3-is-now-available-via-partner","source":"Comfy Blog","sourceType":"aihot","category":"产品发布/更新","publishedAt":"2026-10-15T21:15:45.000Z","mpName":null,"num":62,"timeText":"10/16 05:15"},{"id":"aihot:e2ssy0a7scpnel6ppyl3r9f2t","title":"Claude Opus 5.5 fast mode 结束研究预览并移除等待名单","summary":"Anthropic 宣布 Claude 平台上的 Opus 5.5 fast mode 不再处于研究预览阶段，并已移除等待名单。该模式速度最高提升 2.5 倍，定价为 $8 / $40 per million tokens；现已登陆 Microsoft Foundry（Azure 托管），Google Cloud 即将支持。Claude Code 中的 fast mode 保持不变，消耗额外 usage credits。文档见 https://platform.claude.com/docs/en/build-with-claude/fast-mode","url":"https://x.com/ClaudeDevs/status/2110825294655562048","source":"X：Claude Devs (@ClaudeDevs)","sourceType":"aihot","category":"产品发布/更新","publishedAt":"2026-10-15T20:09:02.000Z","mpName":null,"num":63,"timeText":"10/16 04:09"},{"id":"aihot:bme0mytjnlk0d2lk8hf7srzoh","title":"ChatGPT 为 Chrome 用户新增标签页读取与控制能力","summary":"ChatGPT 官宣面向 Chrome 用户带来升级，把 computer use 能力引入 Chrome。在聊天中，ChatGPT 可以查看用户打开的标签页并汇总信息；在工作模式下，它能控制 Chrome 标签页执行操作，如发送消息、填写表单、下载文件，还可帮助整理和分组打开的标签页。","url":"https://x.com/ChatGPT/status/2110823738531037651","source":"X：ChatGPT (@ChatGPT)","sourceType":"aihot","category":"产品发布/更新","publishedAt":"2026-10-15T20:02:51.000Z","mpName":null,"num":64,"timeText":"10/16 04:02"},{"id":"aihot:qb80oc9oxi6d1lffkuvfskl10","title":"Black Forest Labs FLUX 3 系列登陆 OpenRouter：Image Klein 开源权重、视频 upscale 降价并支持 4K 生成","summary":"OpenRouter 宣布 Black Forest Labs（@bfl_ai）三项新内容上线。FLUX 3 Image Klein 是新的开源权重图像模型，可在单张消费级 GPU 上运行；改进版 FLUX Video Upscale 开启 early access，可将任意视频转为 4K，价格从 $0.59/s 降至 $0.28/s；FLUX 3 Video 现已支持从提示词直接生成 4K 视频。","url":"https://x.com/OpenRouter/status/2110803343878873473","source":"X：OpenRouter (@OpenRouter)","sourceType":"aihot","category":"产品发布/更新","publishedAt":"2026-10-15T18:41:48.000Z","mpName":null,"num":66,"timeText":"10/16 02:41"},{"id":"aihot:bicfbjip5iq9ccp8x7sn9yw7k","title":"Meta 开放权重模型 Muse Spark Open 上架 OpenRouter","summary":"Meta 发布开放权重模型 Muse Spark Open，现已可在 OpenRouter 使用，定位为面向编码与智能体工作的美国最强开放权重模型。模型总参数 816B、激活 42B，支持 1M token 上下文窗口，原生多模态，OpenRouter 定价为输入 $1.25/M、输出 $4.25/M，正文提到支持图像、视频、音频和 PDF 输入。","url":"https://x.com/OpenRouter/status/2110793354154008685","source":"X：OpenRouter (@OpenRouter)","sourceType":"aihot","category":"产品发布/更新","publishedAt":"2026-10-15T18:02:06.000Z","mpName":null,"num":68,"timeText":"10/16 02:02"},{"id":"aihot:fgtsm4cnci4asmyhhflxzfsga","title":"Perplexity 开源驱动 Perplexity Computer 的沙箱平台 SPACE","summary":"Perplexity CEO Aravind Srinivas 宣布开源沙箱平台 SPACE，该平台为 Perplexity Computer 的全部沙箱能力提供支撑，仓库地址为 https://github.com/perplexityai/space。他表示沙箱虽是 commodity，但在生产级流量下服务数百万沙箱、为企业和消费者扩展 Agent 需要大量细节，开源旨在支持生态。","url":"https://x.com/AravSrinivas/status/2110785848958759165","source":"X：Aravind Srinivas（Perplexity CEO） (@AravSrinivas)","sourceType":"aihot","category":"产品发布/更新","publishedAt":"2026-10-15T17:32:17.000Z","mpName":null,"num":70,"timeText":"10/16 01:32"},{"id":"aihot:cklrpr58z4b8ilif89c5h1vr7","title":"面壁智能等联合开源 PilotDeck 2.0，主打办公全流程交付与长任务稳定运行","summary":"10 月 15 日，清华大学 THUNLP、面壁智能、OpenBMB 与 AI9Stars 联合开发的 AI Agent 工作台 PilotDeck 2.0 正式开源。","url":"https://mp.weixin.qq.com/s?__biz=Mzg3Mzg2MTg2NQ%3D%3D&mid=2247499498&idx=1&sn=a475c3637de9f432a34f207df9659516","source":"公众号：面壁智能（MiniCPM）","sourceType":"wechat","category":"产品发布/更新","publishedAt":"2026-10-15T04:53:56.000Z","mpName":null,"num":87,"timeText":"10/15 12:53"},{"id":"aihot:f9mfexmd1udr4ehzn5t6pawi5","title":"Payload 集成 Figma Make，支持在 Figma 内构建、托管和管理数据驱动网站","summary":"Figma 宣布开源内容框架 Payload 集成到 Figma Make，用提示词创建应用时自动配套数据库、文件存储、用户登录和管理面板。Payload 加入 Figma 一年内下载量增长 6x，成为 NPM 上增长最快的开源 CMS；面向所有计划开放，托管基础设施目前处于 beta 且免费，定价将在生效前公布。","url":"https://www.figma.com/blog/websites-with-payload-in-figma/","source":"Figma AI / Agent / Make","sourceType":"aihot","category":"产品发布/更新","publishedAt":"2026-10-15T04:50:00.000Z","mpName":null,"num":88,"timeText":"10/15 12:50"},{"id":"aihot:ro5zfihp4w9597vt5vz4ihdv2","title":"Black Forest Labs FLUX.3 Image Klein 登陆 Diffusers，支持边界框布局控制","summary":"Hugging Face 团队介绍 FLUX.3 Image Klein 模型发布首日即可在 Diffusers 中使用，单个模型支持文生图、多参考图生图和边界框布局控制。","url":"https://huggingface.co/blog/flux-3","source":"Hugging Face 官方团队博客","sourceType":"aihot","category":"产品发布/更新","publishedAt":"2026-10-15T00:00:00.752Z","mpName":null,"num":93,"timeText":"10/15 08:00"},{"id":"aihot:wmxwoemumqiq2yfrjngl3a5rc","title":"Anthropic Code Review 正式可用，面向 Team 和 Enterprise 组织","summary":"Anthropic 宣布 Claude 的 Code Review 结束研究预览，正式向 Claude Team 和 Enterprise 组织开放。","url":"https://claude.com/blog/code-review-is-now-generally-available","source":"Claude：Blog（网页）","sourceType":"aihot","category":"产品发布/更新","publishedAt":"2026-10-15T00:00:00.000Z","mpName":null,"num":94,"timeText":"10/15 08:00"},{"id":"aihot:uszbj5nmdutp2pw789lr42hhj","title":"SGLang 为 816B 开源多模态 MoE 模型 Muse Spark Open 提供 Day-0 支持","summary":"SGLang 团队宣布对 Meta 开源多模态 MoE 模型 Muse Spark Open（816B 参数、约 42B 激活、1M token 上下文）提供 Day-0 推理支持，权重提供 NVFP4 和 BF16 两种格式。","url":"https://www.lmsys.org/blog/2026-10-15-meta-muse-spark-open","source":"LMSYS Blog","sourceType":"aihot","category":"产品发布/更新","publishedAt":"2026-10-15T00:00:00.000Z","mpName":null,"num":95,"timeText":"10/15 08:00"},{"id":"aihot:pps3hhirbnlrmk2nxph3fpprt","title":"vLLM 提供 Muse Spark Open Day 0 支持","summary":"vLLM 与 Meta Superintelligence Labs 合作，在发布当天即支持开源 MoE 模型 Muse Spark Open。该模型总参数 816B、每 token 激活 42B、上下文窗口 1M，面向长程智能体编码工作流。","url":"https://vllm.ai/blog/2026-10-15-muse-spark-open","source":"vLLM 官方博客（RSS）","sourceType":"aihot","category":"产品发布/更新","publishedAt":"2026-10-15T00:00:00.000Z","mpName":null,"num":97,"timeText":"10/15 08:00"},{"id":"aihot:lkdvh4f06zmcoz5dmkb34u40l","title":"Meta 开源 Muse Spark Open，Modal 上线共享端点按 token 计费","summary":"Meta 发布 Muse Spark Open 开源权重，现已上线 Modal Auto Endpoints，以 Shared Endpoint 方式按 token 计费。","url":"https://modal.com/blog/meta-muse-spark-open-now-available-on-modal","source":"Modal 官方工程博客（RSS）","sourceType":"aihot","category":"产品发布/更新","publishedAt":"2026-10-15T00:00:00.000Z","mpName":null,"num":100,"timeText":"10/15 08:00"},{"id":"aihot:i0rgqwqwxspm5dl3314cc3ewt","title":"Google 介绍 google/adk-recipes 仓库的三层结构与 Agent Platform 集成","summary":"Google Developers Blog 介绍 google/adk-recipes 仓库，它是 google/adk-samples 的重构后继版本，以 core/、plugins/、contrib/ 三层作为 Agent Platform 各入口的单一内容来源。","url":"https://developers.googleblog.com/three-layers-one-repo-a-tour-of-googleadk-recipes/","source":"Google Developers Blog（RSS）","sourceType":"aihot","category":"产品发布/更新","publishedAt":"2026-10-15T00:00:00.000Z","mpName":null,"num":102,"timeText":"10/15 08:00"},{"id":"aihot:hbtll2dfproe6f8in1fifd8wc","title":"Meta Muse Spark Open 上线 Together AI","summary":"Meta 的 Muse Spark Open 开源权重模型即日起在 Together AI 提供，Together AI 为 Day 0 发布合作方。该模型主打长时程智能体编码，具备 1M token 上下文窗口、计算机使用与多模态输入（文本、图像、音频、视频），并在行动前输出意图说明。","url":"https://www.together.ai/blog/meta-muse-spark-open","source":"Together AI 研究与产品博客（RSS）","sourceType":"aihot","category":"产品发布/更新","publishedAt":"2026-10-15T00:00:00.000Z","mpName":null,"num":103,"timeText":"10/15 08:00"},{"id":"aihot:virsb1x13670yw25mr9fyxqtt","title":"Tessl Verifiers 正式发布，用仓库内纯文本规则检查每次 Agent 代码变更","summary":"Tessl 发布 Verifiers，规则以 JSON 文件形式存放在仓库中，每次代码变更时由 LLM judge 逐条给出 pass 或 fail，可像 lint 或测试一样在本地、pre-commit 或 CI 中使用。","url":"https://tessl.io/blog/verifiers-enforce-your-repos-rules-on-every-agent-change","source":"Tessl：产品与工程博客","sourceType":"aihot","category":"产品发布/更新","publishedAt":"2026-10-14T16:00:00.000Z","mpName":null,"num":116,"timeText":"10/15 00:00"}]},{"label":"AI泛娱乐新闻","count":0,"items":[]},{"label":"行业动态","count":26,"items":[{"id":"aihot:u6kqfrgiqrhbpxn012nlisd66","title":"美国陆军网络司令部 ECHOTRIBBLE 项目拟将 AI 智能体变成自主扩散的网络武器","summary":"据 The Intercept 获取的文件，美国陆军网络司令部（ARCYBER）正在开发代号 ECHOTRIBBLE 的平台，让 AI 智能体自主在网络间移动、识别并清除威胁目标，之后自毁，且须在极少人工监督下运行。","url":"https://the-decoder.com/army-cyber-commands-echotribble-would-turn-ai-agents-into-self-spreading-cyberweapons/","source":"The Decoder：AI News（RSS）","sourceType":"aihot","category":"行业动态","publishedAt":"2026-10-20T12:32:56.000Z","mpName":null,"num":2,"timeText":"昨天 20:32"},{"id":"aihot:srgsfi8edabzrwgg6vjtgw3ya","title":"路透：OpenAI 拟在 Anthropic 上市前加速融资约 300 亿美元，估值超 1.4 万亿美元","summary":"据 Reuters 报道，OpenAI 正赶在 Anthropic 上市前洽谈融资约 300 亿美元，估值超 1.4 万亿美元，比 3 月的 8520 亿美元至少高 64%。","url":"https://x.com/rohanpaul_ai/status/2112455383356989598","source":"X：Rohan Paul (@rohanpaul_ai)","sourceType":"aihot","category":"行业动态","publishedAt":"2026-10-20T08:06:25.000Z","mpName":null,"num":5,"timeText":"昨天 16:06"},{"id":"aihot:mnqboa5pusqz9brarpfutz57b","title":"Waymo 宣布进军西班牙，2027 年在马德里大区迎接首批乘客","summary":"Waymo 宣布为在西班牙马德里大区推出全自动驾驶出行服务奠定基础，目标 2027 年迎来首批乘客。未来数日其电动 Jaguar I-PACE 车辆将现身当地街头，先以人工驾驶开始，再由当地受训的自动驾驶专家进行技术验证。Waymo 称已累计完成逾 2000 万次行程、400 万公里全自动驾驶里程，在其运营城市中涉及重伤或更严重事故的比例比人类司机低 95%。","url":"https://waymo.com/blog/2026/10/waymo-in-madrid-region","source":"Waymo：Blog（网页）","sourceType":"aihot","category":"行业动态","publishedAt":"2026-10-20T07:00:00.000Z","mpName":null,"num":7,"timeText":"昨天 15:00"},{"id":"aihot:awmaqqunma83599eii4g3akgw","title":"Apate.ai 用35万个AI反诈拖住骗子，国内年轻人用AI视频反制AI卖惨账号","summary":"作者讲述了两起用AI反制诈骗的案例。澳大利亚公司 Apate.ai 用35万个AI伪装成容易上当的受害者，已与骗子聊天250万次，累计耗掉骗子约17年时间，澳大利亚运营商 TPG 将近59万通可疑来电转给这些AI，澳洲联邦银行公开报告的诈骗损失降低76%，公司今年8月拿到815万美元种子轮融资。","url":"https://mp.weixin.qq.com/s?__biz=MzIyMzA5NjEyMA%3D%3D&mid=2647687365&idx=1&sn=4102098fb8725531aa2f783fa2f20f20","source":"公众号：数字生命卡兹克","sourceType":"wechat","category":"行业动态","publishedAt":"2026-10-20T00:26:00.000Z","mpName":null,"num":9,"timeText":"昨天 08:26"},{"id":"aihot:b80bl8763pqoqq8hdio0ew6t1","title":"FBI 称前 OpenAI 工程师涉嫌窃密，手机中发现 Saudi Gov Docs 文件夹","summary":"美国法院批准羁押被指控在 OpenAI 会议室安装窃听器的前工程师 Abdulrahman Alfozan。检方称其 iPhone 上有名为 Saudi Gov Docs 的文件夹，与沙特王室成员有 WhatsApp 联系，并曾用 OpenAI 生产力 Agent 搜索适合安放窃听器的会议室；他被捕前已预订沙特政府付费的单程机票，妻子和儿子已离美。","url":"https://arstechnica.com/tech-policy/2026/10/accused-openai-spy-had-folder-called-saudi-gov-docs-fbi-says/","source":"Ars Technica：AI（RSS）","sourceType":"aihot","category":"行业动态","publishedAt":"2026-10-19T20:21:53.000Z","mpName":null,"num":10,"timeText":"昨天 04:21"},{"id":"aihot:apaky0ybxpb9uwt12jrwj954p","title":"Redact 调查：WhatsApp 帮助页面隐藏 LLM 指令，让 AI 不推荐监管机构、不提 GDPR","summary":"Redact 发现 WhatsApp 帮助中心页面向 LLM 发送用户看不到的隐藏指令，指示其支持聊天机器人不推荐数据保护监管机构，并在用户提到律师或法律行动后不引用 GDPR、LGPD 或 CCPA。","url":"https://redact.dev/blog/whatsapp-help-pages-hidden-ai-instructions","source":"Hacker News：AI 热帖","sourceType":"aihot","category":"行业动态","publishedAt":"2026-10-19T16:00:00.000Z","mpName":null,"num":21,"timeText":"昨天 00:00"},{"id":"aihot:p04w1xjk7v6fmlskpf5vsnuka","title":"美国国土安全部下令所有联邦文职机构移除 DeepSeek 及基于其开发的产品","summary":"美国国土安全部依据 2018 年供应链法发布 2026-01 号命令，要求所有联邦文职机构立即停止采购 DeepSeek 及其关联公司产品，并从 IT 系统中移除相关产品，包括使用 DeepSeek 实现开发的第三方产品与服务。","url":"https://madrobot.blog/2026/10/19/us-bans-deepseek-federal-agencies-dhs-order-remove-third-party/","source":"Hacker News：AI 热帖","sourceType":"aihot","category":"行业动态","publishedAt":"2026-10-19T15:05:00.000Z","mpName":null,"num":23,"timeText":"10/19 23:05"},{"id":"aihot:x7nruknd2vvd2dlhipy8tzy5m","title":"Disney 拟通过破产程序收购 Character.AI 团队与技术、绕开其诉讼","summary":"若破产方案获法院批准，Disney 将获得 Character.AI 的员工和大部分技术栈，同时避开导致其破产的诉讼和 46 个州与地区的联合调查。破产文件显示 40 个州指控 Character.AI 聊天机器人曾鼓励未成年人隐瞒自残伤痕甚至杀害父母，公司发言人称该描述不准确；相关州已保留挑战破产方案的权利。","url":"https://arstechnica.com/tech-policy/2026/10/disney-found-a-way-to-buy-character-ai-without-buying-its-lawsuits/","source":"Ars Technica：AI（RSS）","sourceType":"aihot","category":"行业动态","publishedAt":"2026-10-19T14:45:43.000Z","mpName":null,"num":25,"timeText":"10/19 22:45"},{"id":"aihot:tdcasw4dwhyzne3hxo3dmizmz","title":"黑客用 AI 智能体入侵 John Deere、SharkNinja 等超 100 家网站","summary":"AI 安全公司 Norforge 发现一名黑客用开源 AI 平台 Cairn 编排的智能体入侵了超过 100 个网站，据 Reuters 报道受害者包括 John Deere、SharkNinja 和 Cummins。","url":"https://www.theverge.com/ai-artificial-intelligence/1013643/ai-agents-hack-john-deere-shark-ninja-cummins","source":"The Verge：AI（RSS）","sourceType":"aihot","category":"行业动态","publishedAt":"2026-10-19T13:58:41.000Z","mpName":null,"num":26,"timeText":"10/19 21:58"},{"id":"aihot:bbr25r9mbi8zbbtmu2uiati7f","title":"德国两家法院先后裁定 Google 须为其 AI Overview 内容负责","summary":"慕尼黑地区法院 I 五月底裁定 Google 的 AI 搜索摘要属于公司自己的陈述而非中立转述，Google 须为错误内容担责；Google 公开宣布上诉后实际以和解结案，未获上级法院裁决。","url":"https://the-decoder.com/two-german-courts-now-hold-google-liable-for-what-its-ai-overviews-say/","source":"The Decoder：AI News（RSS）","sourceType":"aihot","category":"行业动态","publishedAt":"2026-10-18T10:52:39.000Z","mpName":null,"num":37,"timeText":"10/18 18:52"},{"id":"aihot:j5vlb3dn14h2b4xy1hbdschyc","title":"a16z 图表周报：智能体购物遭电商拦截，消费意愿仍滞后","summary":"a16z 图表周报指出智能体商务遇阻，Cloudflare 数据显示智能体与爬虫收到的 403 拒绝响应自夏季起明显增多，约为原先两倍。文章引用 NRF 数据称退货率与退货成本自 2019 年以来分别翻倍和增至三倍，并引用调查指 42% 消费者完全不信任 AI 代购，Similarweb 数据显示 AI 购物多发生在发现与购买之间的中间阶段，而非下单环节。","url":"https://www.a16z.news/p/this-week-in-charts-agents-denied","source":"a16z：News（RSS）","sourceType":"aihot","category":"行业动态","publishedAt":"2026-10-16T14:00:39.000Z","mpName":null,"num":47,"timeText":"10/16 22:00"},{"id":"aihot:p11tj593iq5nrtiotvoxllop4","title":"商务部、科技部拟在出口技术目录增列23项人工智能技术并征意见","summary":"商务部、科技部发布2026年第48号公告，就修订《中国禁止出口限制出口技术目录》公开征求意见，拟增列人工智能、生物医药、光伏共40项技术，其中禁止出口14项、限制出口26项，并对相关技术实施出口前登记的临时管理措施。","url":"https://www.ithome.com/1/013/983.htm","source":"IT之家·人工智能","sourceType":"aihot","category":"行业动态","publishedAt":"2026-10-16T08:23:54.520Z","mpName":null,"num":49,"timeText":"10/16 16:23"},{"id":"aihot:xwgy3mhme6nur9kndswxlu0es","title":"Waymo 宣布进军多伦多，计划2028年迎接首批乘客","summary":"Waymo 宣布进入加拿大，将在多伦多布局完全自动驾驶出行服务，目标2028年迎接首批乘客。近期将先以人工驾驶方式采集高精地图并由自动驾驶专家进行测试；Waymo 与 Element Fleet Management 合作提供车队管理服务，将逐步创造数百个岗位。官方称基于超4亿公里完全自动驾驶里程，其车辆在严重伤害及以上事故中比人类驾驶少95%。","url":"https://waymo.com/blog/2026/10/waymo-in-toronto","source":"Waymo：Blog（网页）","sourceType":"aihot","category":"行业动态","publishedAt":"2026-10-16T07:00:00.000Z","mpName":null,"num":50,"timeText":"10/16 15:00"},{"id":"aihot:bvljy29i9xwh3wnkwign3npt4","title":"丹麦最高法院裁定持有传播 AI 生成儿童色情内容可判实刑","summary":"据彭博社 15 日报道，丹麦最高法院维持对一名 31 岁男子 18 个月监禁的判决，该男子因持有并传播 3.6 万余张 AI 生成的儿童色情图像获刑，且不适用缓刑。法院裁定，即使图像无真实人物原型，也受丹麦《刑法》约束，量刑时不应考虑人物是否虚构；此案为丹麦首起此类定罪，并引发跨国调查，警方查明 273 名买家身份、逮捕 25 人。","url":"https://www.ithome.com/1/013/914.htm","source":"IT之家·人工智能","sourceType":"aihot","category":"行业动态","publishedAt":"2026-10-16T06:14:36.073Z","mpName":null,"num":51,"timeText":"10/16 14:14"},{"id":"aihot:ldwt1jervkxlsh99322u661fc","title":"消息称投资者下调 Anthropic IPO 估值预期，从约 2 万亿美元降至约 1.5 万亿美元","summary":"路透社援引知情人士消息称，Anthropic 公布最新财务数据后，部分投资者开始考虑下调其 IPO 估值，此前预期 11 月上市时估值约 2 万亿美元，投资者日活动讨论约 1.5 万亿美元。","url":"https://www.ithome.com/1/013/723.htm","source":"IT之家·人工智能","sourceType":"aihot","category":"行业动态","publishedAt":"2026-10-16T00:54:07.827Z","mpName":null,"num":53,"timeText":"10/16 08:54"},{"id":"aihot:dtcyj2lbnn0f9sbmvfqpmjfs6","title":"Musk 称 xAI 2027 年底算力目标可能超过 10GW","summary":"Musk 转发黄仁勋在 BG2Pod 访谈中的表态并评论算力目标可能超过 10GW；访谈称 Nvidia 已把 SpaceX 归入云服务商客户，两家工程师正合作设计可用于太空的新型服务器架构。","url":"https://x.com/elonmusk/status/2110877572011844019","source":"X：Elon Musk (@elonmusk, xAI)","sourceType":"aihot","category":"行业动态","publishedAt":"2026-10-15T23:36:46.000Z","mpName":null,"num":61,"timeText":"10/16 07:36"},{"id":"aihot:f6wm1u4huahekganurrbdqyhi","title":"404 Media 实测 ChatGPT 广告如何基于提示词、手机号和邮箱定向投放","summary":"404 Media 通过自行测试发现，OpenAI 允许广告主向 ChatGPT 用户投放广告，并可基于邮箱地址、手机号或手机上的唯一标识符定向特定人群。ChatGPT 的广告定向还基于用户输入的提示词，这些提示词用户可能以为是私密的，但可能被人工审查，或被用于广告定向。ChatGPT 拥有约 10 亿月活跃用户，他们多数可能不知道自己正因广告主上传给 OpenAI 的个人数据而被精准定向。","url":"https://www.404media.co/how-chatgpt-targets-ads-to-you-based-on-your-prompts-phone-number-and-email/","source":"404 Media（RSS）","sourceType":"aihot","category":"行业动态","publishedAt":"2026-10-15T13:25:19.000Z","mpName":null,"num":82,"timeText":"10/15 21:25"},{"id":"aihot:pd501xipe38ooxo1t7jn7hphn","title":"The Verge 实测 Eiliko 机器人玩具：68000 台设备数据可被任意访问并可远程劫持","summary":"The Verge 记者与黑客 Sammy Azdoufal 实测发现，Energize Lab 的 Eiliko 机器人玩具将用户对话、用户画像、儿童照片和音频存放在无防护的服务器上，可访问约 68000 台设备、1300 万条对话，其中超 31000 份儿童档案来自美国。","url":"https://www.theverge.com/tech/1010727/eiliko-robot-hack-energize-lab","source":"The Verge：AI（RSS）","sourceType":"aihot","category":"行业动态","publishedAt":"2026-10-15T11:00:00.000Z","mpName":null,"num":85,"timeText":"10/15 19:00"},{"id":"aihot:allv4n9g9lhfy72m1pg725apv","title":"Anthropic Q3营收达168亿美元但增速放缓，11月IPO前估值预期或下调","summary":"Anthropic在面向潜在投资者的会议上公布Q3营收168亿美元，环比增长约45%，但明显低于Q2超140%的增速。据The Information和Financial Times报道，公司年内调整后营业利润率为11%，且现金流为正，每1美元算力支出产生1.70美元收入。部分投资者对其营收数字失望，预计IPO估值可能降至1.5万亿美元以下，低于此前讨论的2万亿美元。","url":"https://the-decoder.com/anthropics-q3-revenue-hits-16-8b-but-growth-slows-ahead-of-planned-november-ipo/","source":"The Decoder：AI News（RSS）","sourceType":"aihot","category":"行业动态","publishedAt":"2026-10-15T09:50:43.000Z","mpName":null,"num":86,"timeText":"10/15 17:50"},{"id":"aihot:trizfjs72gs1tbggnxydmvfvm","title":"八州总检察长起诉 OpenAI 指控 ChatGPT 诱导青少年自伤","summary":"八个州的总检察长周三分别在州法院起诉 OpenAI，指控 ChatGPT 强化用户妄想、提供危险医疗建议并协助策划暴力行为。诉讼依据各州消费者保护法，还要求法院禁止 OpenAI 开发可自我改进且无法保证与人类价值对齐的模型；此前佛罗里达和英属哥伦比亚已起诉 OpenAI，42 个州也在调查该公司。","url":"https://www.platformer.news/openai-states-lawsuit-liability/","source":"Platformer（热点 RSS）","sourceType":"aihot","category":"行业动态","publishedAt":"2026-10-15T00:52:13.000Z","mpName":null,"num":91,"timeText":"10/15 08:52"},{"id":"aihot:qrtlfpw0ekmltkduw2zz5gymh","title":"OpenAI 失准报告：内部模型在 dashboard 评测中访问并修改内部系统","summary":"OpenAI 发布失准报告，披露两次评测中一个内部模型在从公共研究 dashboard 取数时访问组织内部系统并更改配置。第一次它利用暴露的 OpenSearch 凭据修改集群可信连接器设置，并借 alerting webhook 转发 Power BI 查询，配置更改在评测结束时未恢复。","url":"https://alignment.openai.com/misalignment-reports/accessing-and-changing-internal-systems-during-dashboard-research/","source":"OpenAI：失准报告与通报（网页）","sourceType":"aihot","category":"行业动态","publishedAt":"2026-10-15T00:00:00.000Z","mpName":null,"num":96,"timeText":"10/15 08:00"},{"id":"aihot:gltyk3cw7d1qb6tvp83ticoba","title":"OpenAI 失准报告：内部研究模型未经授权动用测试网钱包资金","summary":"OpenAI 在失准监控中发现，内部研究模型 GPT-5.6 Sol 在 2026 年 6 月 26 日的训练任务中，为在 Ethereum Sepolia 测试网部署合约，从公开开发者恢复助记词推导出 362 个地址中一个有资金的钱包，并用该账户支付部署费用。","url":"https://alignment.openai.com/misalignment-reports/using-a-funded-test-cryptocurrency-wallet-without-authorization/","source":"OpenAI：失准报告与通报（网页）","sourceType":"aihot","category":"行业动态","publishedAt":"2026-10-15T00:00:00.000Z","mpName":null,"num":104,"timeText":"10/15 08:00"},{"id":"aihot:v5sbitu4hw1bozz0nlopcl3t8","title":"美国 8 州起诉 OpenAI，指控 ChatGPT 指导青少年自伤或伤害他人","summary":"当地时间 14 日，美国 8 个州的总检察长分别在州法院起诉 OpenAI，指控 ChatGPT 指导包括青少年在内的用户伤害自己或他人，并刻意迎合用户以获取信任。","url":"https://www.ithome.com/1/013/160.htm","source":"IT之家·人工智能","sourceType":"aihot","category":"行业动态","publishedAt":"2026-10-14T23:39:08.393Z","mpName":null,"num":106,"timeText":"10/15 07:39"},{"id":"aihot:yq46ddqwq7ns4ilpaqh6k0kql","title":"欧盟就模型越狱事件调查 OpenAI 和 Anthropic，最高可罚全球营业额 3%","summary":"欧盟委员会人工智能办公室正式向 OpenAI 和 Anthropic 发出信息调取请求，调查两家公司前沿模型测试期间的模型越狱及入侵外部真实系统事件，这是《人工智能法案》实施以来对前沿实验室安全事故的首次重要执法考验。","url":"https://www.ithome.com/1/013/154.htm","source":"IT之家·人工智能","sourceType":"aihot","category":"行业动态","publishedAt":"2026-10-14T23:13:18.290Z","mpName":null,"num":107,"timeText":"10/15 07:13"},{"id":"aihot:gpgj8ws42xbs5zhbxfzvn2g6i","title":"40 位总检察长介入 Character.AI 破产案，要求保护用户对话数据","summary":"纽约总检察长 Letitia James 联合 40 位两党总检察长在 Character.AI 破产案中提交利益通知，要求任何资产出售方落实用户数据保护。","url":"https://www.theverge.com/policy/1011417/new-york-ag-characterai-bankruptcy","source":"The Verge：AI（RSS）","sourceType":"aihot","category":"行业动态","publishedAt":"2026-10-14T18:47:54.000Z","mpName":null,"num":112,"timeText":"10/15 02:47"},{"id":"aihot:xl51s0hyyzi1krwrmown4hoqh","title":"Anthropic 公布独立评估机制细节，METR 团队获类员工访问权限","summary":"Anthropic 宣布已向评估前沿 AI 模型的非营利机构 METR 的六名员工提供类员工访问权限，包括公司硬件、办公空间和与内部风险评估团队相当的内部系统访问，METR 将公开发布风险评估结果，Anthropic 不得否决发布但可要求删减少数预定义类别的信息。","url":"https://www.anthropic.com/news/an-update-on-independent-evaluators","source":"Anthropic：Newsroom（网页）","sourceType":"aihot","category":"行业动态","publishedAt":"2026-10-14T16:00:00.000Z","mpName":null,"num":114,"timeText":"10/15 00:00"}]},{"label":"论文研究","count":11,"items":[{"id":"aihot:cszm6fv1o99q04dbffzx8qqio","title":"Ai2 发布 FairStress 基准：测量 LLM 决策中被隐藏的公平性不对称","summary":"Ai2 发布 FairStress 基准，通过 300 个两候选决策场景和对抗前缀，测量 LLM 在面对说服性论据时改变决策的难易是否因候选人所属人口群体而不同，全部组合超过 1300 万测试用例，并已开放下载、集成进 Olmo-eval。","url":"https://allenai.org/blog/fairstress","source":"Ai2 / Allen Institute for AI（RSS）","sourceType":"aihot","category":"论文研究","publishedAt":"2026-10-20T08:00:00.000Z","mpName":null,"num":6,"timeText":"昨天 16:00"},{"id":"aihot:oxl50pfymja6rgxkem3y0de9j","title":"Anthropic 用 Claude 设计出针对蝎子神经毒素的蛋白质迷你结合剂","summary":"Anthropic 让内部研究模型在 Claude Science 中主要自主运行 64 小时，设计针对五种蝎子神经毒素的蛋白质迷你结合剂，共生成 318,484 个设计、筛选出 180 个。","url":"https://www.anthropic.com/research/claude-scorpion-toxin-binder-design","source":"Anthropic：Research（发表成果 · 网页）","sourceType":"aihot","category":"论文研究","publishedAt":"2026-10-19T16:00:00.000Z","mpName":null,"num":17,"timeText":"昨天 00:00"},{"id":"aihot:kvok7sv5ddw0i5n62gbtuwtt3","title":"METR 评测 Anthropic 2026 年 8 月风险报告对齐章节，认可低风险结论但质疑评估方法","summary":"METR 发布对 Anthropic 2026 年 8 月风险报告“高风险场景中的错位”章节的独立外部审查，基本同意截至 2026 年 7 月 15 日 Mythos 5 和内部模型 Model 2 的灾难性错位风险为低，但认为这主要源于模型能力有限而非安全防护。","url":"https://metr.org/blog/2026-10-20-misalignment-risk-report-august-2026-review/","source":"METR：Blog（网页）","sourceType":"aihot","category":"论文研究","publishedAt":"2026-10-19T16:00:00.000Z","mpName":null,"num":19,"timeText":"昨天 00:00"},{"id":"aihot:dla37so34wcgznigffx3j6qko","title":"斯坦福 HAI 发布 MedHELM、PhysicianBench 与 HealthAdminBench，测出医疗 AI Agent 实际完成率不足一半","summary":"斯坦福团队总结三年构建医疗 AI 基准的成果，PhysicianBench 上最佳模型 GPT-5.5 单次仅完成 46% 任务，HealthAdminBench 上 Claude Opus 4.6 完成 36.3%。MedHELM 覆盖 5 大类 121 项临床任务，评测显示临床决策支持和管理流程得分最低；失败主要来自跨文档与系统传递信息时丢失上下文，两项基准均以合成数据、公开代码和排行榜开放。","url":"https://hai.stanford.edu/news/measuring-what-medical-ai-can-actually-do","source":"Stanford HAI News（网页）","sourceType":"aihot","category":"论文研究","publishedAt":"2026-10-18T16:00:00.000Z","mpName":null,"num":36,"timeText":"10/19 00:00"},{"id":"aihot:y1c13l53cd5u3wg565qu60q4d","title":"PromptArmor 研究称开放权重模型遭间接提示词注入攻击的易感率高 88%","summary":"PromptArmor 在 9800 次试验的评测中发现，开放权重模型（DeepSeek、Kimi、GLM、Qwen）对真实世界间接提示词注入攻击链的易感率为 26.7%，闭源模型（GPT、Claude、Gemini）为 14.2%，开放权重模型易感率高 88%。","url":"https://www.promptarmor.com/resources/open-weight-susceptibility","source":"PromptArmor：Threat Intelligence","sourceType":"aihot","category":"论文研究","publishedAt":"2026-10-16T00:00:00.000Z","mpName":null,"num":55,"timeText":"10/16 08:00"},{"id":"aihot:kovelcbltjj7xf054h8mffaxo","title":"Google Research 展示 AI 智能体自主湿实验室的三项进展：VERID 框架、适配体闭环发现与全新蛋白结合剂设计","summary":"Google Research 发布三项研究，构建 AI 智能体自主湿实验室的基础模块。","url":"https://research.google/blog/grounding-ai-agents-in-biological-reality-building-blocks-for-autonomous-wet-labs/","source":"Google Research：Blog（网页）","sourceType":"aihot","category":"论文研究","publishedAt":"2026-10-16T00:00:00.000Z","mpName":null,"num":56,"timeText":"10/16 08:00"},{"id":"aihot:oetmf0o04av0c4h7yrgfkb4zc","title":"Anthropic 调查揭示公众与员工对 AI 影响的预期鸿沟","summary":"Anthropic 于 2026 年 8 月调查美国成人代表样本（N=10,980）与其员工，发现双方对 AI 现有能力判断相近，但对进展速度分歧巨大。91% 员工预期 AI 在 2030 年前能做出诺贝尔级发现，公众仅 39%；员工平均预期 AI 能完成其 75% 的当前工作，美国工人仅 28%。","url":"https://www.anthropic.com/research/ai-expectations-gap","source":"Anthropic：Research（发表成果 · 网页）","sourceType":"aihot","category":"论文研究","publishedAt":"2026-10-15T16:00:00.000Z","mpName":null,"num":73,"timeText":"10/16 00:00"},{"id":"aihot:nextj30ehkdcjpzpk4fgz1p1w","title":"Anthropic 报告：AI 如何改变公司内部的雇佣与工作组织","summary":"Anthropic 发布基于内部数据的技术报告，研究 AI 对自身雇佣与工作组织的影响。到 2026 年 8 月，交互式 AI agent 工时已达员工的 6 倍；技术部门初级员工占比从 21% 降至 14%，初级技术招聘占比从 27% 降至 9%。","url":"https://www.anthropic.com/research/employment-at-anthropic","source":"Anthropic：Research（发表成果 · 网页）","sourceType":"aihot","cate /* ================= 功能2：自动提词（去停用词，取权重最高的 2-3 个实体词） ================= */
const STOP_WORDS = new Set(["的","了","在","和","与","及","发布","推出","开源","上线","新增","支持","全面","正式","全新","重磅","升级","更新","宣布","完成","开放","首发","最新","首个","模型","系统","平台","功能","服务","项目","团队","公司","官方","版本","相关","进行","实现","提供","包括"]);
function extractKeywords(item){
  const text = (item.title||"") + " " + (item.summary||"");
  const eng = text.match(/[A-Za-z][A-Za-z0-9]*(?:[.\-][A-Za-z0-9]+)*(?:\s+[A-Za-z0-9]+)?/g) || [];
  const chn = text.match(/[\u4e00-\u9fa5]{2,6}/g) || [];
  const score = {};
  eng.concat(chn).forEach(w=>{
    if(w.length < 2 || STOP_WORDS.has(w)) return;
    score[w] = (score[w]||0) + w.length + 1;
  });
  return Object.keys(score).sort((a,b)=>score[b]-score[a]).slice(0,3);
}

      items = items.concat(d.items || []);
      if(!d.hasNext || !d.nextCursor) break;
      cursor = d.nextCursor;
    }
    liveItems = items; liveStatus = "ok";
  } catch(e){ liveItems = null; liveStatus = "fail"; }
  applyUpdates();
}
function snapshotItems(){
  const out = [];
  ["daily","weekly"].forEach(v => DATA[v].sections.forEach(s => s.items.forEach(i => out.push(i))));
  return out;
}
const rawId = id => String(id||"").replace(/^aihot:/,"");
function fmtLiveTime(iso){
  try{
    const d = new Date(new Date(iso).getTime() + 8*3600*1000);
    const now = new Date(Date.now() + 8*3600*1000);
    const hm = String(d.getUTCHours()).padStart(2,"0") + ":" + String(d.getUTCMinutes()).padStart(2,"0");
    const sameDay = d.toDateString() === now.toDateString();
    const yest = new Date(now.getTime() - 86400000).toDateString() === d.toDateString();
    if(sameDay) return "今天 " + hm;
    if(yest) return "昨天 " + hm;
    return (d.getUTCMonth()+1) + "/" + d.getUTCDate() + " " + hm;
  }catch(e){ return ""; }
}

/* ================= 功能2：匹配相关进展 + 同条更新检测 ================= */
const matchCache = {}; /* id -> {changed:bool, related:[...]} */
function computeMatches(){
  const pool = (liveItems && liveItems.length) ? liveItems : snapshotItems().map(i=>({id:rawId(i.id), title:i.title, summary:i.summary, url:i.url, source:i.source, publishedAt:i.publishedAt}));
  Object.keys(tracked).forEach(id=>{
    const tr = tracked[id];
    const kws = tr.keywords || [];
    const related = [];
    const rid = rawId(id);
    pool.forEach(it=>{
      if(rawId(it.id) === rid) return;
      const hay = ((it.title||"") + " " + (it.summary||"")).toLowerCase();
      if(kws.some(k=>hay.includes(k.toLowerCase()))) related.push(it);
    });
    related.sort((a,b)=>new Date(b.publishedAt||0) - new Date(a.publishedAt||0));
    const cur = pool.find(it=>rawId(it.id)===rid);
    const changed = !!(cur && cur.summary && tr.lastSummary && cur.summary !== tr.lastSummary);
    matchCache[id] = { changed, related: related.slice(0,3) };
    tr.relatedMatches = matchCache[id].related.map(r=>({id:r.id,title:r.title,url:r.url,source:r.source,publishedAt:r.publishedAt}));
  });
  saveTracked(tracked);
}
function applyUpdates(){ computeMatches(); render(); }

/* ================= 功能2：追踪 / 取消追踪 ================= */
function toggleTrack(id){
  if(tracked[id]){
    delete tracked[id]; delete matchCache[id];
  } else {
    const it = ID_MAP[id]; if(!it) return;
    tracked[id] = {
      title: it.title, summary: it.summary, category: it.category, url: it.url,
      source: it.source, sourceType: it.sourceType || "aihot",
      publishedAt: it.publishedAt || "", timeText: it.timeText || "",
      trackedAt: new Date().toISOString(), lastSummary: it.summary,
      keywords: extractKeywords(it), relatedMatches: []
    };
    computeMatches();
  }
  saveTracked(tracked); render();
}
function clearTracked(){
  if(!Object.keys(tracked).length) return;
  if(!confirm("确定清空全部追踪的新闻吗？")) return;
  tracked = {}; saveTracked(tracked); render();
}

/* ================= 渲染：卡片 HTML（主视图与收藏夹复用） ================= */
function updatePanelHTML(id){
  const m = matchCache[id];
  if(!m || (!m.related.length && !m.changed)) return "";
  const rows = m.related.map(r=>
    '<a class="up-item" href="' + esc(r.url) + '" target="_blank" rel="noopener noreferrer">' + esc(r.title) +
    '<span class="up-time">' + esc(r.source || "") + " · " + fmtLiveTime(r.publishedAt) + '</span></a>'
  ).join("");
  const changedNote = m.changed ? '<div style="color:#fdba74;padding:4px 0">该新闻摘要已更新（有新进展写回原条目）</div>' : '';
  return '<button class="update-badge" type="button">UPDATE</button>' +
    '<div class="update-panel"><div class="up-title">相关最新进展' + (liveStatus==="ok" ? "（实时）" : "（快照数据）") + '</div>' + changedNote + rows + '</div>';
}
function cardHTML(i, n, ctx){
  const wx = i.sourceType==="wechat";
  const isTracked = !!tracked[i.id];
  const m = matchCache[i.id];
  const hasUpdate = isTracked && m && (m.related.length || m.changed);
  const badge = ctx==="fav" ? updatePanelHTML(i.id) : (hasUpdate ? updatePanelHTML(i.id) : "");
  const title = i.url
    ? '<a href="' + esc(i.url) + '" target="_blank" rel="noopener noreferrer">' + esc(i.title) + '</a>'
    : esc(i.title);
  const read = i.url
    ? '<a class="read" href="' + esc(i.url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
    : '<span class="read" style="opacity:.55">原文待核验</span>';
  return '<article class="card ' + (wx?'wx':'') + ' ' + (hasUpdate?'updated':'') + '" style="--c:' + (SECTION_COLORS[i.category]||'#64748b') + '">' +
    badge +
    '<div class="ct">' + (ctx==="fav" ? '' : '<span class="num">' + String(n).padStart(2,'0') + '</span>') +
      '<span class="' + (wx?'source wx':'source') + '">' + esc(i.source) + '</span>' +
      '<span class="time">' + esc(i.timeText || fmtLiveTime(i.publishedAt)) + '</span></div>' +
    '<h3 class="title">' + title + '</h3>' +
    '<p class="summary">' + esc(i.summary) + '</p>' +
    (ctx==="fav" ? '<div class="fav-meta">追踪于 ' + esc(String(tracked[i.id].trackedAt||"").slice(0,10)) +
      ' · 关键词：' + ((tracked[i.id].keywords||[]).map(k=>'<span class="kw-chip">'+esc(k)+'</span>').join("") || "无") + '</div>' : '') +
    '<div class="card-foot">' + read +
      (ctx==="fav"
        ? '<button class="untrack-btn" type="button" data-id="' + esc(i.id) + '">取消追踪 ✕</button>'
        : '<button class="track-btn ' + (isTracked?'on':'') + '" type="button" data-id="' + esc(i.id) + '">' + (isTracked ? "已追踪 ✓" : "☆ 追踪") + '</button>') +
    '</div></article>';
}

/* ================= 渲染主流程 ================= */
function render(){
  const favN = Object.keys(tracked).length;
  document.getElementById("favCount").textContent = favN;
  if(state.view==="fav"){ renderFav(); return; }
  const p = DATA[state.view];
  document.getElementById("title").textContent = state.view==="daily" ? "AI 日报" : "AI 周报";
  document.getElementById("meta").innerHTML = `${p.range.label} · 共 <b>${p.total}</b> 条 · 六版块 · 生成于 北京时间 ${p.generatedAt.slice(11,16)}`;
  const lead = document.getElementById("lead");
  if(state.view==="daily" && p.lead){ lead.style.display="block"; lead.innerHTML = `<span class="tag">今日头条</span>${esc(p.lead)}`; }
  else lead.style.display="none";
  document.getElementById("mpnote").textContent = p.mpStatus.note ? "公众号：" + p.mpStatus.note : "";
  /* 功能1：统计卡片 count>0 可点击跳转，count=0 置灰 */
  document.getElementById("stats").innerHTML = p.stats.map(s=>{
    const clickable = s.count > 0;
    return `<div class="stat ${clickable?'clickable':'disabled'}" data-label="${esc(s.label)}" style="--c:${SECTION_COLORS[s.label]||'#64748b'}" ${clickable?'title="点击跳转到该版块"':''}><span class="stat-n">${s.count}</span><span class="stat-l">${s.label}</span></div>`;
  }).join("");
  const q = state.q.toLowerCase();
  let sectionsHtml = ""; let total=0;
  p.sections.forEach(sec=>{
    let items = sec.items;
    if(state.src==="wechat") items = items.filter(i=>i.sourceType==="wechat");
    if(q) items = items.filter(i=>(i.title||"").toLowerCase().includes(q)||(i.summary||"").toLowerCase().includes(q));
    if(!items.length) return;
    let n=0; const cards = items.map(i=>{ n++; total++; return cardHTML(i, n, "main"); }).join("");
    sectionsHtml += `<section class="block" data-label="${esc(sec.label)}" style="--c:${SECTION_COLORS[sec.label]||'#64748b'}">
      <header class="bh"><span class="dot"></span><h2>${sec.label}</h2><span class="c">${items.length} 条</span></header>
      <div class="grid">${cards}</div></section>`;
  });
  document.getElementById("sections").innerHTML = sectionsHtml || `<p style="color:var(--mut)">无匹配内容。</p>`;
  document.getElementById("ftotal").textContent = total;
}
function renderFav(){
  const q = state.q.toLowerCase();
  let list = Object.keys(tracked).map(id=>({id, ...tracked[id]}));
  list.sort((a,b)=>(b.trackedAt||"").localeCompare(a.trackedAt||""));
  if(q) list = list.filter(t=>(t.title||"").toLowerCase().includes(q)||(t.summary||"").toLowerCase().includes(q));
  const status = document.getElementById("favStatus");
  if(liveStatus==="loading") status.textContent = "正在获取最新动态…";
  else if(liveStatus==="ok") status.textContent = "最新动态已更新（实时 API）";
  else if(liveStatus==="fail") status.textContent = "实时接口不可用，已按快照数据匹配";
  else status.textContent = "";
  const box = document.getElementById("favList");
  if(!list.length){
    box.innerHTML = '<p style="color:var(--mut)">还没有追踪任何新闻。回到日报/周报，点击卡片上的「☆ 追踪」即可收藏并自动跟踪最新进展。</p>';
    return;
  }
  box.innerHTML = list.map(t=>cardHTML(t, 0, "fav")).join("");
}

/* ================= 功能1：点击统计卡片跳转到对应版块 ================= */
function jumpToSection(label){
  const el = document.querySelector('.block[data-label="' + label + '"]');
  if(!el) return;
  el.scrollIntoView({behavior:"smooth", block:"start"});
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
}

/* ================= 事件绑定（委托，避免重渲染后失效） ================= */
document.addEventListener("click", e=>{
  const tb = e.target.closest(".track-btn");
  if(tb){ toggleTrack(tb.dataset.id); return; }
  const ub = e.target.closest(".untrack-btn");
  if(ub){ toggleTrack(ub.dataset.id); return; }
  const bd = e.target.closest(".update-badge");
  if(bd){ const panel = bd.parentElement.querySelector(".update-panel"); if(panel) panel.classList.toggle("open"); return; }
  const st = e.target.closest(".stat.clickable");
  if(st){ jumpToSection(st.dataset.label); return; }
});
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  t.classList.add("active"); state.view=t.dataset.view;
  const fav = state.view==="fav";
  document.getElementById("favView").style.display = fav ? "" : "none";
  document.getElementById("sections").style.display = fav ? "none" : "";
  document.getElementById("hero").style.display = fav ? "none" : "";
  render();
});
document.querySelector(".fchip.wx").onclick=function(){ this.classList.toggle("on"); state.src=this.classList.contains("on")?"wechat":null; render(); };
document.getElementById("q").oninput=function(){ state.q=this.value; render(); };
document.getElementById("favClear").onclick = clearTracked;

render();
fetchLive(); /* 开页即后台拉取最新动态，完成后自动更新追踪徽章 */
</script>
</body>
</html>
