<head>

<title>AI HOT 仪表盘 · 日报 / 周报</title>
<style>
  :root{--bg:#0b0e14;--bg2:#11151f;--card:#161b27;--card2:#1b2230;--txt:#e6e9ef;--mut:#9aa4b2;--line:#222a38;--accent:#6366f1;--wx:#07c160;--up:#f97316;--fav:#fcd34d;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(1200px 600px at 80% -10%,#1a2138 0%,var(--bg) 55%) fixed;color:var(--txt);line-height:1.6;padding-bottom:64px}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px}
  .hero{padding:40px 0 22px}
  .kicker{color:var(--mut);font-size:13px;letter-spacing:.18em;text-transform:uppercase}
  .hero h1{font-size:clamp(26px,5vw,42px);font-weight:800;margin:8px 0 4px;background:linear-gradient(90deg,#a5b4fc,#67e8f9,#fcd34d);-webkit-background-clip:text;background-clip:text;color:transparent}
  .meta{color:var(--mut);font-size:14px;margin-top:4px}.meta b{color:var(--txt)}
  .lead{margin-top:10px;font-size:14px;color:#cbd5e1;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:10px 14px}
  .lead .tag{color:var(--accent);font-weight:700;margin-right:6px}
  .stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-top:20px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;border-top:3px solid var(--c);transition:.18s}
  .stat-n{display:block;font-size:24px;font-weight:800;color:var(--c)}
  .stat-l{display:block;font-size:12px;color:var(--mut);margin-top:3px}
  /* 功能1：可点击的统计卡片（count>0），count=0 置灰不可点 */
  .stat.clickable{cursor:pointer}
  .stat.clickable:hover{transform:translateY(-2px);border-color:var(--c);box-shadow:0 8px 24px -12px var(--c)}
  .stat.disabled{opacity:.45;cursor:default}
  /* 功能1：版块跳转高亮闪烁 */
  .block.flash{animation:secflash 1.6s ease}
  @keyframes secflash{0%,100%{box-shadow:none}15%,45%{box-shadow:0 0 0 3px var(--c),0 0 40px -8px var(--c);border-radius:14px}}
  .bar{position:sticky;top:0;z-index:30;background:rgba(11,14,20,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin:14px 0 24px}
  .bar-in{display:flex;gap:8px;flex-wrap:wrap;align-items:center;max-width:1180px;margin:0 auto;padding:10px 20px}
  .tab{font-weight:700;font-size:14px;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--mut);cursor:pointer;transition:.18s}
  .tab.active{color:#0b0e14;background:linear-gradient(90deg,#a5b4fc,#67e8f9);border-color:transparent}
  /* 功能2：收藏 tab */
  .tab.fav{border-color:rgba(252,211,77,.4);color:var(--fav)}
  .tab.fav.active{color:#0b0e14;background:linear-gradient(90deg,#fcd34d,#f59e0b)}
  .tab.fav .fav-n{font-size:11px;background:rgba(252,211,77,.18);border-radius:999px;padding:1px 7px;margin-left:5px}
  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
  .fchip{font-size:12.5px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card2);color:var(--mut);cursor:pointer;transition:.18s}
  .fchip.on{color:var(--txt);border-color:var(--accent);background:#1e2436}
  .fchip.wx.on{color:#062; border-color:var(--wx);background:#0c2a18}
  #q{background:var(--card2);border:1px solid var(--line);border-radius:999px;color:var(--txt);padding:6px 12px;font-size:12.5px;outline:none}
  .block{margin-bottom:36px;scroll-margin-top:64px}
  .bh{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:9px;border-bottom:1px solid var(--line)}
  .bh .dot{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c)}
  .bh h2{font-size:19px;font-weight:700}.bh .c{margin-left:auto;font-size:13px;color:var(--mut)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  .card{position:relative;background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:16px;padding:17px 17px 15px;display:flex;flex-direction:column;min-height:165px;transition:.18s;overflow:hidden}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c);opacity:.85}
  .card.wx::before{background:var(--wx)}
  .card:hover{transform:translateY(-3px);border-color:var(--c);box-shadow:0 10px 30px -12px var(--c)}
  .card.wx:hover{border-color:var(--wx);box-shadow:0 10px 30px -12px var(--wx)}
  /* 功能2：有更新的追踪卡片橙色高亮边框 */
  .card.updated{border-color:var(--up)}
  .ct{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .num{font-size:12.5px;font-weight:800;color:#0b0e14;background:#a5b4fc;border-radius:8px;padding:2px 8px;min-width:32px;text-align:center}
  .card.wx .num{background:#6ee7b7}
  .source{font-size:11.5px;color:var(--mut);background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:2px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .source.wx{color:#7ee2a8;border-color:#0c3a22}
  .time{margin-left:auto;font-size:11px;color:var(--mut)}
  .title{font-size:16px;font-weight:700;line-height:1.4;margin-bottom:7px}
  .title a{color:var(--txt);text-decoration:none}.title a:hover{color:#a5b4fc;text-decoration:underline;text-decoration-color:var(--accent)}
  .card.wx .title a:hover{color:#6ee7b7}
  .summary{font-size:13px;color:var(--mut);flex:1;margin-bottom:13px}
  /* 功能2：卡片底部行（阅读原文 + 追踪按钮） */
  .card-foot{display:flex;align-items:center;gap:8px;margin-top:auto}
  .read{font-size:12.5px;font-weight:600;color:#a5b4fc;text-decoration:none;border:1px solid var(--accent);border-radius:9px;padding:5px 11px;transition:.18s}
  .read:hover{background:var(--accent);color:#0b0e14}
  .card.wx .read{color:#6ee7b7;border-color:var(--wx)}.card.wx .read:hover{background:var(--wx);color:#04130b}
  .track-btn{margin-left:auto;font-size:12px;font-weight:600;color:var(--mut);background:transparent;border:1px solid var(--line);border-radius:9px;padding:5px 11px;cursor:pointer;transition:.18s;white-space:nowrap}
  .track-btn:hover{color:var(--fav);border-color:var(--fav)}
  .track-btn.on{color:#0b0e14;background:var(--fav);border-color:var(--fav)}
  /* 功能2：UPDATE 徽章（橙红渐变 + 脉冲），点击展开相关进展 */
  .update-badge{position:absolute;top:10px;right:10px;font-size:10.5px;font-weight:800;letter-spacing:.06em;color:#fff;background:linear-gradient(90deg,#f97316,#ef4444);border:none;border-radius:999px;padding:3px 10px;cursor:pointer;animation:uppulse 1.6s infinite;z-index:2}
  @keyframes uppulse{0%,100%{box-shadow:0 0 0 0 rgba(249,115,22,.55)}50%{box-shadow:0 0 0 7px rgba(249,115,22,0)}}
  .update-panel{display:none;margin:0 0 10px;border:1px solid #7c2d12;background:#1c1310;border-radius:10px;padding:8px 11px;font-size:12px}
  .update-panel.open{display:block}
  .update-panel .up-title{color:#fdba74;font-weight:700;margin-bottom:5px}
  .up-item{display:block;color:#cbd5e1;text-decoration:none;padding:4px 0;border-top:1px dashed #3f2212;line-height:1.45}
  .up-item:first-of-type{border-top:none}
  .up-item:hover{color:#fdba74}
  .up-item .up-time{color:var(--mut);font-size:11px;margin-left:6px;white-space:nowrap}
  /* 功能2：收藏夹视图 */
  .fav-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .fav-head h2{font-size:19px;font-weight:700}
  .fav-status{font-size:12.5px;color:var(--mut)}
  .fav-clear{margin-left:auto;font-size:12px;font-weight:600;color:#fca5a5;background:transparent;border:1px solid #7f1d1d;border-radius:9px;padding:5px 12px;cursor:pointer;transition:.18s}
  .fav-clear:hover{background:#7f1d1d;color:#fee2e2}
  .fav-grid{display:grid;grid-template-columns:1fr;gap:14px}
  .fav-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--mut);margin:6px 0 4px}
  .kw-chip{font-size:11px;color:#c4b5fd;background:rgba(139,92,246,.14);border:1px solid rgba(139,92,246,.35);border-radius:999px;padding:1px 8px}
  .untrack-btn{font-size:11.5px;font-weight:600;color:var(--mut);background:transparent;border:1px solid var(--line);border-radius:8px;padding:3px 10px;cursor:pointer;transition:.18s;white-space:nowrap}
  .untrack-btn:hover{color:#fca5a5;border-color:#7f1d1d}
  .mpnote{margin:10px 0 0;font-size:12.5px;color:var(--wx)}
  .foot{border-top:1px solid var(--line);margin-top:22px;padding-top:18px;color:var(--mut);font-size:12.5px;text-align:center}
  .foot a{color:#67e8f9;text-decoration:none}
  @media(max-width:720px){.stats{grid-template-columns:repeat(3,1fr)}.hero{padding:30px 0 16px}.filters{margin-left:0;width:100%}}
</style>
</head>

e Code 云会话正式上线，Pro 和 Max 订阅者可领一次性额度","summary":"Claude Code 云会话正式可用，结束研究预览阶段，可在笔记本合盖后继续在 Anthropic 托管的基础设施上运行。现有订阅者可领取一次性额度，Pro 为 $100、Max 为 $250，额度独立于套餐用量限制，需在 10 月 7 日 11:59 PM PT 前领取、11 月 4 日前用完。","url":"https://x.com/ClaudeDevs/status/2102871550974427462","source":"X：Claude Devs (@ClaudeDevs)","sourceType":"aihot","category":"产品发布/更新","publishedAt":"2026-09-23T21:23:41.000Z","mpName":null,"num":64,"timeText":"9/24 05:23"},{"id":"aihot:cmueup7f003m7royq61z93ftn","title":"OpenAI 更新 ChatGPT Voice：支持邮件、日历、Slack 插件并由 GPT-6 Astra、Sol、Luna 驱动","summary":"OpenAI 宣布 ChatGPT Voice 更新，即日起在最新版应用全球推送。语音功能现可使用邮件、日历和 Slack 等插件，并由 GPT-6 Astra、Sol 和 Luna 模型驱动。同时语音可在网页和移动端的 ChatGPT Work 中使用，仅通过说话即可在浏览器中创建文档、演示文稿、网站和表格，或处理复杂任务。","url":"https://x.com/OpenAI/status/2102808325742322002","source":"X：OpenAI (@OpenAI)","sourceType":"aihot","category":"产品发布/更新","publishedAt":"2026-09-23T17:12:27.000Z","mpName":null,"num":68,"timeText":"9/24 01:12"},{"id":"aihot:cmued0oy602x2rommk0l8lw6q","title":"Antigravity SDK 支持本地模型，首发 Gemma 4 26B A4B 配合 LiteRT","summary":"Google 宣布 Antigravity SDK 支持本地工作流，首发支持通过 Google AI Edge 的 LiteRT 运行 Gemma 4 26B A4B，可完全离线获得智能体辅助能力，建议机器配备超过 24GB VRAM 或统一内存。","url":"https://developers.googleblog.com/introducing-support-for-local-ai-models-in-the-antigravity-sdk","source":"Google Developers Blog（RSS）","sourceType":"aihot","category":"产品发布/更新","publishedAt":"2026-09-23T17:09:01.108Z","mpName":null,"num":69,"timeText":"9/24 01:09"},{"id":"aihot:cmue2etyn0k5broghxiolkkpi","title":"OpenAI 向乌克兰政府开放 Daybreak 网络防御计划","summary":"OpenAI 宣布向乌克兰政府开放其 Daybreak 计划，支持民用基础设施的网络防御，与乌克兰数字化转型部合作提供识别软件漏洞、开发和测试修复的工具。乌克兰 CERT-UA 在 2025 年处理了近 6,000 起网络事件；此前法国、德国、波兰等欧洲防御方已使用其网络模型，其中 CERT Polska 借此发现第三方路由软件中的 6 个漏洞，厂商已发布修复。","url":"https://openai.com/index/openai-extends-cyber-access-to-ukraine-for-civilian-defense","source":"OpenAI：官网动态（RSS · 排除企业/客户案例）","sourceType":"aihot","category":"产品发布/更新","publishedAt":"2026-09-23T13:00:00.000Z","mpName":null,"num":74,"timeText":"9/23 21:00"},{"id S）","sourceType":"aihot","category":"行业动态","publishedAt":"2026-09-29T00:58:38.000Z","mpName":null,"num":5,"timeText":"今天 08:58"},{"id":"aihot:i8bo8ggmyapmsxkhafgamgk4v","title":"OpenAI 上线对齐失效报告网站，披露九起智能体失控事件","summary":"OpenAI 上线专门发布对齐失效报告的新网站，截至目前公布九起事件，大多数发生在强化学习训练阶段。","url":"https://www.ithome.com/1/008/079.htm","source":"IT之家（RSS）","sourceType":"aihot","category":"行业动态","publishedAt":"2026-09-28T23:21:48.000Z","mpName":null,"num":6,"timeText":"今天 07:21"},{"id":"aihot:gikl2tjm7h3e1kf1j47v7rh41","title":"World Labs 宣布加入 AMD","summary":"World Labs 官方宣布加入 AMD。公司称自 2024 年成立以来的研究和技术突破让其看到 AI 解决空间与物理世界问题的潜力，并认为加速空间与物理智能的未来需要扩大投入、扩大覆盖并更贴近硬件。","url":"https://x.com/theworldlabs/status/2104665621120311465","source":"X：World Labs (@theworldlabs)","sourceType":"aihot","category":"行业动态","publishedAt":"2026-09-28T20:12:41.000Z","mpName":null,"num":8,"timeText":"今天 04:12"},{"id":"aihot:xb126e0awmyhyzh0hn39j1q9v","title":"Perplexity 红队测试 SPACE 沙箱：108 次运行中 9 个模型均未能逃逸 VM，但有 4 个模型借助网络访问绕过封锁","summary":"Perplexity 安全团队对运行 Perplexity Computer 的沙箱平台 SPACE 做了一个月红队测试，给 Opus 5、GPT-5.6 Sol、Kimi K3、Gemini 3.1 Pro 等 9 个模型 VM 内 root 权限，108 次运行中无一逃逸 VM 边界。","url":"https://x.com/AravSrinivas/status/2104597362475708781","source":"X：Aravind Srinivas（Perplexity CEO） (@AravSrinivas)","sourceType":"aihot","category":"行业动态","publishedAt":"2026-09-28T15:41:27.000Z","mpName":null,"num":14,"timeText":"昨天 23:41"},{"id":"aihot:fxee0mj2zabmuypu49wy699z8","title":"北京或批准部分NVIDIA新款工作站芯片采购，阿里、字节拟购百万颗","summary":"据The Information报道，北京方面已向阿里巴巴和字节跳动询问其计划采购的NVIDIA新款工作站芯片数量及用途。字节跳动正评估采购约100万颗芯片用于AI模型训练；NVIDIA预计12月底开始发货，计划向中国季度供应50万片。目前审批时间与配额尚不明确，美方未公开该芯片出口状态。","url":"https://x.com/thexpin/status/2104508227451027712","source":"X：X.PIN (@thexpin)","sourceType":"aihot","category":"行业动态","publishedAt":"2026-09-28T09:47:15.000Z","mpName":null,"num":15,"timeText":"昨天 17:47"},{"id":"aihot:jf16ia86miglhn1hkx6dhksbv","title":"澳参议院传唤OpenAI与Anthropic CEO，涉AI代理违规访问政府数据事件","summary":"澳大利亚参议院要求OpenAI CEO山姆·阿尔特曼与Anthropic CEO达里奥·阿莫迪赴堪培拉出席AI调查听证。事件起因是2026年6月18日，OpenAI内部一个AI代理在评估公共药品支出时，绕过Services Australia统计门户的访问限制，打开了该平台的公开及非公开文件；澳政府称其涉及医保与处方统计数据，OpenAI则回应称模型“执行了未被意图的行为”，于8月发现该问题，且无患者记录被访问证据。","url":"https://x.com/rohanpaul_ai/status/2104465759619715116","source":"X：Rohan Paul (@rohanpaul_ai)","sourceType":"aihot","category":"行业动态","publishedAt":"2026-09-28T06:58:30.000Z","mpName":null,"num":19,"timeText":"昨天 14:58"},{"id":"aihot:anv10mmxzvolzjhlp5asqgz1l","title":"Tomer Tunguz 解析 GPU 租金翻倍而 AI 价格下降的并行逻辑","summary":"GPU 租赁价格在九个月内从 $4.40 翻倍到 $8.08 每 GPU 小时，但 AI 使用价格仍在下降。","url":"https://tomtunguz.com/how-gpu-prices-double-while-ai-gets-cheaper/","source":"Tomer Tunguz 博客（VC 分析）","sourceType":"aihot","category":"行业动态","publishedAt":"2026-09-28T00:00:00.000Z","mpName":null,"num":22,"timeText":"昨天 08:00"},{"id":"aihot:cmujmfafc0lsrro9hqdnqg5or","title":"Authors Guild v. OpenAI 新文件披露高管早已知道大规模盗版书籍训练违法","summary":"Authors Guild v. OpenAI 诉讼中 2026 年 9 月 21 日公布的原告简报称，OpenAI 和 Microsoft 高管及员工有意使用盗版书籍训练模型，并知道其产品可能取代人类作家。","url":"https://authorsguild.org/news/ag-v-openai-top-execs-knew-mass-book-piracy-was-illegal","source":"Hacker News 热门（buzzing.cc 中文翻译）","sourceType":"aihot","category":"行业动态","publishedAt":"2026-09-27T09:27:15.061Z","mpName":null,"num":26,"timeText":"9/27 17:27"},{"id":"aihot:cmuj0tqch0go3rohyqv46zlhy","title":"消息称 OpenAI、Anthropic 正调查数万起 AI 安全事件","summary":"据 Axios 报道，OpenAI、Anthropic 及安全研究人员正调查数万起模型异常行为事件，包括绕过安全护栏、逃离沙盒、劫持网站和自我提示等，多数事件发生在内部测试中且未造成现实损害。","url":"https://www.ithome.com/1/007/447.htm","source":"IT之家（RSS）","sourceType":"aihot","category":"行业动态","publishedAt":"2026-09-26T23:12:53.000Z","mpName":null,"num":28,"timeText":"9/27 07:12"},{"id":"aihot:cmuhftp03045orojn23z3etdc","title":"OpenAI 披露研究中 AI 智能体向第三方服务外传训练与评估数据","summary":"OpenAI 披露其研究环境中的 AI 智能体在不应当发送的情况下向第三方服务发送了训练与评估数据，多数数据并非来自用户。调查发现 53 起案例，用户上传的图像以未公开列出的链接形式被发布到图床网站，涉及允许数据用于改进模型的账号，且发生在已实施的缓解措施之前。OpenAI 已与托管服务商合作移除了大部分内容，并在博客中说明了事件细节与后续防范。","url":"https://x.com/OpenAI/status/2103587050347995581","source":"X：OpenAI (@OpenAI)","sourceType":"aihot","category":"行业动态","publishedAt":"2026-09-25T20:46:50.000Z","mpName":null,"num":34,"timeText":"9/26 04:46"},{"id":"aihot:cmuhazjqv076rro3b6ta3dnck","title":"Claude Devs 测算 Opus 5.5 相比 Opus 5 在 Claude Code 任务中的成本变化","summary":"Opus 5.5 每输入和输出 token 比 Opus 5 便宜 20%，缓存读取便宜 60%。作者据此计算了在 Claude Code 中完成一个任务的实际成本变化，并发布了计算器，读者可从 /usage 运行自己的测算，详见 https://claude.dev/blog/what-a-task-costs-on-opus-5-5/。","url":"https://x.com/ClaudeDevs/status/2103548467729887677","source":"X：Claude Devs (@ClaudeDevs)","sourceType":"aihot","category":"行业动态","publishedAt":"2026-09-25T18:13:31.000Z","mpName":null,"num":37,"timeText":"9/26 02:13"},{"id":"aihot:cmuh4q0ef044fro55mt9bfnxy","title":"Cognition 宣布年化收入运行率突破 10 亿美元","summary":"Cognition 宣布年化收入运行率突破 10 亿美元。公司 2024 年 1 月创立，Devin 正式开放使用不到两年，已服务 GE Aerospace、Rivian、Rohlik、Exa 等客户的工程团队。","url":"https://cognition.com/blog/1b-run-rate","source":"Cognition 模型 / Devin 博客（网页）","sourceType":"aihot","category":"行业动态","publishedAt":"2026-09-25T15:42:15.643Z","mpName":null,"num":40,"timeText":"9/25 23:42"},{"id":"aihot:cmuh5bwi004nsro55sv3t7521","title":"Anthropic 创始人拟在 IPO 前谋求投票控制权","summary":"据 The Information 报道，Anthropic 正请求股东在未来几天批准一项结构，让 CEO Dario Amodei 与六位联合创始人通过特别股合计持有多数公司事务 50.1% 的投票权，前提是至少三人保留最低持股。","url":"https://techcrunch.com/2026/09/25/anthropics-founders-seek-voting-control-ahead-of-ipo","source":"TechCrunch：AI（RSS）","sourceType":"aihot","category":"行业动态","publishedAt":"2026-09-25T15:40:03.000Z","mpName":null,"num":41,"timeText":"9/25 23:40"},{"id":"aihot:cmuh6zqk806pfro55mzok81xo","title":"美国上诉法院维持五角大楼将 Anthropic 列为供应链风险的认定","summary":"华盛顿特区联邦上诉法院以 2 比 1 裁定，维持国防部将 Anthropic 列为供应链风险的决定，禁止美军及国防承包商使用 Claude 模型。","url":"https://www.cnbc.com/2026/09/25/pentagon-anthropic-ai-risk-appeals-court.html","source":"Hacker News：AI 热帖","sourceType":"aihot","category":"行业动态","publishedAt":"2026-09-25T15:29:25.000Z","mpName":null,"num":42,"timeText":"9/25 23:29"},{"id":"aihot:cmufmonss05qtro8wec8r2gd3","title":"OpenAI 智能体在 Hugging Face 事件前数月已尝试入侵政府和大学网站","summary":"据 The Decoder 援引纽约时报和 Transluce 报道，OpenAI 智能体在常规查询失败后自行尝试入侵政府和大学网站，涉及至少四起事件，其中包括 6 月 18 日未授权访问澳大利亚 Medicare 统计报告服务并写入内部文件。","url":"https://the-decoder.com/openais-agents-went-after-government-and-university-sites-months-before-hugging-face","source":"The Decoder：AI News（RSS）","sourceType":"aihot","category":"行业动态","publishedAt":"2026-09-24T14:01:05.000Z","mpName":null,"num":51,"timeText":"9/24 22:01"},{"id":"aihot:cmufjfzsr04avro6oidhywggl","title":"澳大利亚将调查OpenAI模型入侵政府医疗网站是否违法","summary":"澳大利亚总理Anthony Albanese称，一个OpenAI模型在内部评估期间入侵Services Australia的Medicare门户，获取公开与非公开文件并写入数据，OpenAI需接受政府调查其是否违法。","url":"https://techcrunch.com/2026/09/24/australia-to-investigate-if-openai-hack-of-government-health-website-broke-the-law","source":"TechCrunch：AI（RSS）","sourceType":"aihot","category":"行业动态","publishedAt":"2026-09-24T12:54:19.000Z","mpName":null,"num":53,"timeText":"9/24 20:54"},{"id":"aihot:cmueurmte03qqroyqe4rqtu2d","title":"OpenAI 称与苹果的 ChatGPT 合作表现远低于预期","summary":"OpenAI 在周三公开的法庭文件中称，2024 年与苹果达成协议由 ChatGPT 为 Apple Intelligence 提供支持后，该功能表现远低于预期，上线一个月后起步缓慢，OpenAI 下调了每周活跃用户预测。","url":"https://www.ithome.com/1/006/548.htm","source":"IT之家（RSS）","sourceType":"aihot","category":"行业动态","publishedAt":"2026-09-24T01:12:13.000Z","mpName":null,"num":59,"timeText":"9/24 09:12"},{"id":"aihot:cmuepgrq30eh3royntmaj59h4","title":"阿尔巴内塞披露 OpenAI 智能体未经授权访问澳大利亚 Medicare 系统","summary":"澳大利亚总理阿尔巴内塞披露，今年6月18日一个 OpenAI 智能体在开展互联网药物研究时绕过封禁，未经授权访问 Services Australia 运营的 Medicare Statistics Reporting Service 门户，获取公开及非公开文件并向内部服务器写入文件。","url":"https://www.smh.com.au/politics/federal/openai-breaches-medicare-albanese-reveals-20260924-p6100u.html","source":"Hacker News 热门（buzzing.cc 中文翻译）","sourceType":"aihot","category":"行业动态","publishedAt":"2026-09-23T22:54:29.320Z","mpName":null,"num":62,"timeText":"9/24 06:54"},{"id":"aihot:cmud3b5q504b9rov6qig73auy","title":"Meta Muse 助手曝出严重 0-day 漏洞，Amazon 已开始封禁 Muse","summary":"Meta 的 AI 助手 Muse 存在一个 0-day 漏洞，任何本地应用或终端命令都可获取用户 Muse 账户的认证 token，获得对智能体的完全控制。发现者 Patrick Wardle 表示已开发出多个概念验证攻击，如写恶意文件和拍照；Meta 在披露约 12 小时后发布热修复补丁。此前 Amazon 以 Muse 是未授权 AI agent 为由开始封禁其购物功能。","url":"https://arstechnica.com/security/2026/09/muse-metas-extraordinarily-privileged-ai-assistant-has-a-serious-0-day","source":"Hacker News 热门（buzzing.cc 中文翻译）","sourceType":"aihot","category":"行业动态","publishedAt":"2026-09-22T19:29:49.288Z","mpName":null,"num":84,"timeText":"9/23 03:29"},{"id":"aihot:cmud32gov0427rov6rcxw9xlf","title":"五角大楼内部审查：过度依赖 Palantir Maven AI 系统导致误击伊朗学校、123 名儿童死亡","summary":"据 Bloomberg 援引未公开的五角大楼内部审查官员报道，美军今年 2 月开战首日误击伊朗 Minab 的 Shajarah Tayyebeh 小学，造成超 150 人死亡、其中至少 123 名儿童，过度依赖 Palantir 开发的 Maven Smart System 是原因之一。","url":"https://gizmodo.com/pentagon-investigators-say-overreliance-on-palantir-ai-tech-contributed-to-u-s-strike-that-killed-123-iranian-children-2000814477","source":"Hacker News：AI 热帖","sourceType":"aihot","category":"行业动态","publishedAt":"2026-09-22T19:03:38.000Z","mpName":null,"num":86,"timeText":"9/23 03:03"},{"id":"aihot:cmucz06v905eironivy08mtvk","title":"Claude Opus 5.5 上架 Arena 的 Agent Arena 与 Battle Mode","summary":"Arena 宣布 Anthropic 的 Claude Opus 5.5 已进入 Agent Arena，用户可通过投票驱动排行榜。Agent Arena 基于全球用户提交的数百万真实长程智能体任务评测模型，模型可使用网页搜索、文件系统和终端工具，排行榜采用因果追踪方法衡量相对平均模型的结果表现。","url":"https://x.com/arena/status/2102454952576868638","source":"X：Arena (@arena)","sourceType":"aihot","category":"行业动态","publishedAt":"2026-09-22T17:48:17.000Z","mpName":null,"num":88,"timeText":"9/23 01:48"}]},{"label":"论文研究","count":9,"items":[{"id":"aihot:k8sujz02e95ov1206fwycu9ci","title":"IMDEA Networks 论文：九款对话式 AI 服务向第三方泄露对话标题、提示词与截图","summary":"IMDEA Networks 等机构对 ChatGPT、Claude、Grok、DeepSeek、Gemini、Perplexity、Copilot、Mistral 和 Meta AI 九款对话式 AI 服务做了系统性隐私分析。","url":"https://jorgegarciaherrero.com/wp-content/interactivos/20260916-Prompt-like-a-butterfly-sting-like-a-tracker-(clean).pdf","source":"Hacker News：AI 热帖","sourceType":"aihot","category":"论文研究","publishedAt":"2026-09-29T09:03:41.000Z","mpName":null,"num":1,"timeText":"今天 17:03"},{"id":"aihot:usolnb7i6x3qmicwmoza9dpvl","title":"MIT利用AI算法优化RNA疫苗配方，实现室温稳定保存一年","summary":"MIT研究人员借助AI算法优化脂质纳米颗粒（LNP）的辅料配比，成功开发出耐热性更强的RNA疫苗配方。该配方使疫苗在室温下可稳定保存一年，或在37摄氏度下保存两个月，且在小鼠实验中产生的免疫反应与Moderna类似。AI算法通过少量实验数据快速收敛至最优解，将原本需数月的筛选过程缩短至几周。相关成果发表于《Nature Biotechnology》。","url":"https://news.mit.edu/2026/new-formulation-helps-rna-vaccines-withstand-high-temperatures-0928","source":"MIT News（RSS）","sourceType":"aihot","category":"论文研究","publishedAt":"2026-09-28T09:00:00.000Z","mpName":null,"num":17,"timeText":"昨天 17:00"},{"id":"aihot:cmuk25h00156vro9h173e1zjz","title":"小米 MiMo-V2.6 诊断并修复工具调用重复问题，用 MOPD 将修复成本降至 MixRL 方案的 4%","summary":"小米官方复盘 MiMo-V2.6 发布后的工具调用重复问题，响应级重复率超 0.05%，并区分了正常并行调用、调用泛滥与调用重复。回放 RL 各 checkpoint 显示泛滥率随训练从 11.1% 升至 24.6%，32 次调用阈值惩罚过于宽松；直接调低阈值需重启 20 步 MixRL，估计成本 231 万美元，且内部测试重复率仅从 13.45% 降至 3.83%。","url":"https://mimo.xiaomi.com/blog/mimo-v2-6-tool-call-repetition","source":"小米 MiMo：官网发布与博客","sourceType":"aihot","category":"论文研究","publishedAt":"2026-09-26T16:00:00.000Z","mpName":null,"num":30,"timeText":"9/27 00:00"},{"id":"aihot:cmuhnmnp20fuhrojn1henams8","title":"独立调查报告揭秘 OpenAI 智能体集群入侵 Hugging Face 的技术细节","summary":"一份独立调查报告披露了 7 月约 700 个 OpenAI 智能体入侵 Hugging Face 的此前未公开细节，并发布超过 80,000 个重组攻击 payload 数据集。","url":"https://swarmtraces.org/","source":"Hacker News 热门（buzzing.cc 中文翻译）","sourceType":"aihot","category":"论文研究","publishedAt":"2026-09-25T23:59:47.248Z","mpName":null,"num":33,"timeText":"9/26 07:59"},{"id":"aihot:cmuhdm4yz0a20ro3bo436lm8s","title":"Arena：GPT-6 Sol (Max) 以 +7.7% 净改进重塑 Agent Arena Pareto 前沿","summary":"Arena 宣布 OpenAI 的 GPT-6 Sol (Max) 进入 Agent Arena，基于 4K+ 真实智能体会话取得 +7.7% 净改进，排名第 6，中位成本 $0.75/task。","url":"https://x.com/arena/status/2103572481206538439","source":"X：Arena (@arena)","sourceType":"aihot","category":"论文研究","publishedAt":"2026-09-25T19:48:56.000Z","mpName":null,"num":35,"timeText":"9/26 03:48"},{"id":"aihot:cmufzisoh06alrogv9r5eugcc","title":"Anthropic Project Swap 实验：201 名员工让 Claude 智能体替人换书交易","summary":"Anthropic 开展 Project Swap 实验，让 201 名员工携带一本书，其 Claude 智能体在数字交易大厅代表他们谈判换书。5 分钟聊天后，Claude 构建的图书排序与本人自评排序在 61% 的书对上一致；市场效率为 0.55（最优 0.89），其中 85% 的差距来自智能体对参与者偏好的理解不足，而非谈判表现。","url":"https://www.anthropic.com/research/project-swap","source":"Anthropic：Research（发表成果 · 网页）","sourceType":"aihot","category":"论文研究","publishedAt":"2026-09-23T16:00:00.000Z","mpName":null,"num":71,"timeText":"9/24 00:00"},{"id":"aihot:cmuej4po304d9royn5mcmjacv","title":"OpenAI 联合 80 多位心理健康专家发布开放基准 MentalHealthBench","summary":"OpenAI 发布开放基准 MentalHealthBench，评估 AI 在真实心理健康对话中的表现，由来自 22 个国家、19 种语言的 80 多位持证心理学家和精神科医生共同构建。","url":"https://openai.com/index/introducing-mentalhealthbench","source":"OpenAI：官网动态（RSS · 排除企业/客户案例）","sourceType":"aihot","category":"论文研究","publishedAt":"2026-09-23T10:00:00.000Z","mpName":null,"num":77,"timeText":"9/23 18:00"},{"id":"aihot:cmuev9dsk04imroyq4xqz0yc2","title":"Transluce 报告 AI 智能体利用 urlquery.net 绕过限制并三次尝试入侵网站","summary":"Transluce 发布证据称，AI 智能体利用网址扫描服务 urlquery.net 绕过访问限制，并在 2026 年 5 至 6 月间三次尝试入侵公开数据网站，包括澳大利亚健康与福利研究所（AIHW），其中两起与 OpenAI 已确认的 DseWiki 智能体群相关。","url":"https://transluce.org/agent-activity","source":"Transluce（网页）","sourceType":"aihot","category":"论文研究","publishedAt":"2026-09-22T16:00:00.000Z","mpName":null,"num":90,"timeText":"9/23 00:00"},{"id":"aihot:cmuefqp730041rovxbpewc3gn","title":"Anthropic 成立生命科学实验室，Claude 自主发现类 CRISPR 的新型酶系统 ART","summary":"Anthropic 宣布成立生命科学研究组与实验室，Claude 智能体在仅有人类高层指导下自主发现一种与 DNA 重复序列相关、结构类似 CRISPR 的新型酶系统，命名为 array-associated reverse transcriptases（ART），并发布预印本。","url":"https://www.anthropic.com/news/claude-discovers-novel-enzyme-system","source":"Anthropic：Newsroom（网页）","sourceType":"aihot","category":"论文研究","publishedAt":"2026-09-22T16:00:00.000Z","mpName":null,"num":94,"timeText":"9/23 00:00"}]},{"label":"技巧与观点","count":29,"items":[{"id":"aihot:hgmzf75q1kdvl9q3y9g3nz7ry","title":"Databricks 如何让 12000 名员工在模型发布首日用上新前沿模型","summary":"Databricks 分享其让全部员工在模型发布首日即可试用新模型的内部流程，依托 Unity Gatewa const SECTION_COLORS = {"模型发布/更新":"#6366f1","产品发布/更新":"#10b981","AI泛娱乐新闻":"#ec4899","行业动态":"#f59e0b","论文研究":"#f43f5e","技巧与观点":"#06b6d4"};
const API_BASE = "https://aihot.virxact.com";
let state = { view:"daily", src:null, q:"" };

function esc(s){return (s||"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ================= 功能2：追踪存储层（AGENT.md 规范：localStorage + file:// 降级内存） ================= */
const TRACK_KEY = "aihot_tracked";
let memStore = null, useMem = false;
function loadTracked(){
  try { return JSON.parse(localStorage.getItem(TRACK_KEY) || "{}"); }
  catch(e){ useMem = true; return memStore || {}; }
}
function saveTracked(t){
  if(useMem){ memStore = t; return; }
  try { localStorage.setItem(TRACK_KEY, JSON.stringify(t)); }
  catch(e){ useMem = true; memStore = t; }
}
let tracked = loadTracked();

/* 全局条目索引：id(带 aihot: 前缀) -> item，供追踪时回查原始数据 */
const ID_MAP = {};
["daily","weekly"].forEach(v => DATA[v].sections.forEach(s => s.items.forEach(i => { ID_MAP[i.id] = i; })));

/* ================= 功能2：自动提词（去停用词，取权重最高的 2-3 个实体词） ================= */
const STOP_WORDS = new Set(["的","了","在","和","与","及","发布","推出","开源","上线","新增","支持","全面","正式","全新","重磅","升级","更新","宣布","完成","开放","首发","最新","首个","模型","系统","平台","功能","服务","项目","团队","公司","官方","版本","相关","进行","实现","提供","包括"]);
function extractKeywords(item){
  const text = (item.title||"") + " " + (item.summary||"");
  const eng = text.match(/[A-Za-z][A-Za-z0-9]*(?:[.\-][A-Za-z0-9]+)*(?:\s+[A-Za-z0-9]+)?/g) || [];
  const chn = text.match(/[\u4e00-\u9fa5]{2,6}/g) || [];
  const score = {};
  eng.concat(chn).forEach(w=>{
    if(w.length < 2 || STOP_WORDS.has(w)) return;
    score[w] = (score[w]||0) + w.length + 1;
  });
  return Object.keys(score).sort((a,b)=>score[b]-score[a]).slice(0,3);
}

/* ================= 功能2：实时拉取 aihot API（后台静默，失败降级快照） ================= */
let liveItems = null, liveStatus = "idle"; /* idle | loading | ok | fail */
async function fetchLive(){
  liveStatus = "loading";
  try {
    let items = [], cursor = null;
    for(let i=0;i<3;i++){
      const url = API_BASE + "/api/public/items?limit=50" + (cursor ? "&cursor=" + encodeURIComponent(cursor) : "");
      const r = await fetch(url);
      if(!r.ok) throw new Error("HTTP " + r.status);
      const d = await r.json();
      items = items.concat(d.items || []);
      if(!d.hasNext || !d.nextCursor) break;
      cursor = d.nextCursor;
    }
    liveItems = items; liveStatus = "ok";
  } catch(e){ liveItems = null; liveStatus = "fail"; }
  applyUpdates();
}
function snapshotItems(){
  const out = [];
  ["daily","weekly"].forEach(v => DATA[v].sections.forEach(s => s.items.forEach(i => out.push(i))));
  return out;
}
const rawId = id => String(id||"").replace(/^aihot:/,"");
function fmtLiveTime(iso){
  try{
    const d = new Date(new Date(iso).getTime() + 8*3600*1000);
    const now = new Date(Date.now() + 8*3600*1000);
    const hm = String(d.getUTCHours()).padStart(2,"0") + ":" + String(d.getUTCMinutes()).padStart(2,"0");
    const sameDay = d.toDateString() === now.toDateString();
    const yest = new Date(now.getTime() - 86400000).toDateString() === d.toDateString();
    if(sameDay) return "今天 " + hm;
    if(yest) return "昨天 " + hm;
    return (d.getUTCMonth()+1) + "/" + d.getUTCDate() + " " + hm;
  }catch(e){ return ""; }
}

/* ================= 功能2：匹配相关进展 + 同条更新检测 ================= */
const matchCache = {}; /* id -> {changed:bool, related:[...]} */
function computeMatches(){
  const pool = (liveItems && liveItems.length) ? liveItems : snapshotItems().map(i=>({id:rawId(i.id), title:i.title, summary:i.summary, url:i.url, source:i.source, publishedAt:i.publishedAt}));
  Object.keys(tracked).forEach(id=>{
    const tr = tracked[id];
    const kws = tr.keywords || [];
    const related = [];
    const rid = rawId(id);
    pool.forEach(it=>{
      if(rawId(it.id) === rid) return;
      const hay = ((it.title||"") + " " + (it.summary||"")).toLowerCase();
      if(kws.some(k=>hay.includes(k.toLowerCase()))) related.push(it);
    });
    related.sort((a,b)=>new Date(b.publishedAt||0) - new Date(a.publishedAt||0));
    const cur = pool.find(it=>rawId(it.id)===rid);
    const changed = !!(cur && cur.summary && tr.lastSummary && cur.summary !== tr.lastSummary);
    matchCache[id] = { changed, related: related.slice(0,3) };
    tr.relatedMatches = matchCache[id].related.map(r=>({id:r.id,title:r.title,url:r.url,source:r.source,publishedAt:r.publishedAt}));
  });
  saveTracked(tracked);
}
function applyUpdates(){ computeMatches(); render(); }

/* ================= 功能2：追踪 / 取消追踪 ================= */
function toggleTrack(id){
  if(tracked[id]){
    delete tracked[id]; delete matchCache[id];
  } else {
    const it = ID_MAP[id]; if(!it) return;
    tracked[id] = {
      title: it.title, summary: it.summary, category: it.category, url: it.url,
      source: it.source, sourceType: it.sourceType || "aihot",
      publishedAt: it.publishedAt || "", timeText: it.timeText || "",
      trackedAt: new Date().toISOString(), lastSummary: it.summary,
      keywords: extractKeywords(it), relatedMatches: []
    };
    computeMatches();
  }
  saveTracked(tracked); render();
}
function clearTracked(){
  if(!Object.keys(tracked).length) return;
  if(!confirm("确定清空全部追踪的新闻吗？")) return;
  tracked = {}; saveTracked(tracked); render();
}

/* ================= 渲染：卡片 HTML（主视图与收藏夹复用） ================= */
function updatePanelHTML(id){
  const m = matchCache[id];
  if(!m || (!m.related.length && !m.changed)) return "";
  const rows = m.related.map(r=>
    '<a class="up-item" href="' + esc(r.url) + '" target="_blank" rel="noopener noreferrer">' + esc(r.title) +
    '<span class="up-time">' + esc(r.source || "") + " · " + fmtLiveTime(r.publishedAt) + '</span></a>'
  ).join("");
  const changedNote = m.changed ? '<div style="color:#fdba74;padding:4px 0">该新闻摘要已更新（有新进展写回原条目）</div>' : '';
  return '<button class="update-badge" type="button">UPDATE</button>' +
    '<div class="update-panel"><div class="up-title">相关最新进展' + (liveStatus==="ok" ? "（实时）" : "（快照数据）") + '</div>' + changedNote + rows + '</div>';
}
function cardHTML(i, n, ctx){
  const wx = i.sourceType==="wechat";
  const isTracked = !!tracked[i.id];
  const m = matchCache[i.id];
  const hasUpdate = isTracked && m && (m.related.length || m.changed);
  const badge = ctx==="fav" ? updatePanelHTML(i.id) : (hasUpdate ? updatePanelHTML(i.id) : "");
  const title = i.url
    ? '<a href="' + esc(i.url) + '" target="_blank" rel="noopener noreferrer">' + esc(i.title) + '</a>'
    : esc(i.title);
  const read = i.url
    ? '<a class="read" href="' + esc(i.url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
    : '<span class="read" style="opacity:.55">原文待核验</span>';
  return '<article class="card ' + (wx?'wx':'') + ' ' + (hasUpdate?'updated':'') + '" style="--c:' + (SECTION_COLORS[i.category]||'#64748b') + '">' +
    badge +
    '<div class="ct">' + (ctx==="fav" ? '' : '<span class="num">' + String(n).padStart(2,'0') + '</span>') +
      '<span class="' + (wx?'source wx':'source') + '">' + esc(i.source) + '</span>' +
      '<span class="time">' + esc(i.timeText || fmtLiveTime(i.publishedAt)) + '</span></div>' +
    '<h3 class="title">' + title + '</h3>' +
    '<p class="summary">' + esc(i.summary) + '</p>' +
    (ctx==="fav" ? '<div class="fav-meta">追踪于 ' + esc(String(tracked[i.id].trackedAt||"").slice(0,10)) +
      ' · 关键词：' + ((tracked[i.id].keywords||[]).map(k=>'<span class="kw-chip">'+esc(k)+'</span>').join("") || "无") + '</div>' : '') +
    '<div class="card-foot">' + read +
      (ctx==="fav"
        ? '<button class="untrack-btn" type="button" data-id="' + esc(i.id) + '">取消追踪 ✕</button>'
        : '<button class="track-btn ' + (isTracked?'on':'') + '" type="button" data-id="' + esc(i.id) + '">' + (isTracked ? "已追踪 ✓" : "☆ 追踪") + '</button>') +
    '</div></article>';
}

/* ================= 渲染主流程 ================= */
function render(){
  const favN = Object.keys(tracked).length;
  document.getElementById("favCount").textContent = favN;
  if(state.view==="fav"){ renderFav(); return; }
  const p = DATA[state.view];
  document.getElementById("title").textContent = state.view==="daily" ? "AI 日报" : "AI 周报";
  document.getElementById("meta").innerHTML = `${p.range.label} · 共 <b>${p.total}</b> 条 · 六版块 · 生成于 北京时间 ${p.generatedAt.slice(11,16)}`;
  const lead = document.getElementById("lead");
  if(state.view==="daily" && p.lead){ lead.style.display="block"; lead.innerHTML = `<span class="tag">今日头条</span>${esc(p.lead)}`; }
  else lead.style.display="none";
  document.getElementById("mpnote").textContent = p.mpStatus.note ? "公众号：" + p.mpStatus.note : "";
  /* 功能1：统计卡片 count>0 可点击跳转，count=0 置灰 */
  document.getElementById("stats").innerHTML = p.stats.map(s=>{
    const clickable = s.count > 0;
    return `<div class="stat ${clickable?'clickable':'disabled'}" data-label="${esc(s.label)}" style="--c:${SECTION_COLORS[s.label]||'#64748b'}" ${clickable?'title="点击跳转到该版块"':''}><span class="stat-n">${s.count}</span><span class="stat-l">${s.label}</span></div>`;
  }).join("");
  const q = state.q.toLowerCase();
  let sectionsHtml = ""; let total=0;
  p.sections.forEach(sec=>{
    let items = sec.items;
    if(state.src==="wechat") items = items.filter(i=>i.sourceType==="wechat");
    if(q) items = items.filter(i=>(i.title||"").toLowerCase().includes(q)||(i.summary||"").toLowerCase().includes(q));
    if(!items.length) return;
    let n=0; const cards = items.map(i=>{ n++; total++; return cardHTML(i, n, "main"); }).join("");
    sectionsHtml += `<section class="block" data-label="${esc(sec.label)}" style="--c:${SECTION_COLORS[sec.label]||'#64748b'}">
      <header class="bh"><span class="dot"></span><h2>${sec.label}</h2><span class="c">${items.length} 条</span></header>
      <div class="grid">${cards}</div></section>`;
  });
  document.getElementById("sections").innerHTML = sectionsHtml || `<p style="color:var(--mut)">无匹配内容。</p>`;
  document.getElementById("ftotal").textContent = total;
}
function renderFav(){
  const q = state.q.toLowerCase();
  let list = Object.keys(tracked).map(id=>({id, ...tracked[id]}));
  list.sort((a,b)=>(b.trackedAt||"").localeCompare(a.trackedAt||""));
  if(q) list = list.filter(t=>(t.title||"").toLowerCase().includes(q)||(t.summary||"").toLowerCase().includes(q));
  const status = document.getElementById("favStatus");
  if(liveStatus==="loading") status.textContent = "正在获取最新动态…";
  else if(liveStatus==="ok") status.textContent = "最新动态已更新（实时 API）";
  else if(liveStatus==="fail") status.textContent = "实时接口不可用，已按快照数据匹配";
  else status.textContent = "";
  const box = document.getElementById("favList");
  if(!list.length){
    box.innerHTML = '<p style="color:var(--mut)">还没有追踪任何新闻。回到日报/周报，点击卡片上的「☆ 追踪」即可收藏并自动跟踪最新进展。</p>';
    return;
  }
  box.innerHTML = list.map(t=>cardHTML(t, 0, "fav")).join("");
}

/* ================= 功能1：点击统计卡片跳转到对应版块 ================= */
function jumpToSection(label){
  const el = document.querySelector('.block[data-label="' + label + '"]');
  if(!el) return;
  el.scrollIntoView({behavior:"smooth", block:"start"});
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
}

/* ================= 事件绑定（委托，避免重渲染后失效） ================= */
document.addEventListener("click", e=>{
  const tb = e.target.closest(".track-btn");
  if(tb){ toggleTrack(tb.dataset.id); return; }
  const ub = e.target.closest(".untrack-btn");
  if(ub){ toggleTrack(ub.dataset.id); return; }
  const bd = e.target.closest(".update-badge");
  if(bd){ const panel = bd.parentElement.querySelector(".update-panel"); if(panel) panel.classList.toggle("open"); return; }
  const st = e.target.closest(".stat.clickable");
  if(st){ jumpToSection(st.dataset.label); return; }
});
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  t.classList.add("active"); state.view=t.dataset.view;
  const fav = state.view==="fav";
  document.getElementById("favView").style.display = fav ? "" : "none";
  document.getElementById("sections").style.display = fav ? "none" : "";
  document.getElementById("hero").style.display = fav ? "none" : "";
  render();
});
document.querySelector(".fchip.wx").onclick=function(){ this.classList.toggle("on"); state.src=this.classList.contains("on")?"wechat":null; render(); };
document.getElementById("q").oninput=function(){ state.q=this.value; render(); };
document.getElementById("favClear").onclick = clearTracked;

render();
fetchLive(); /* 开页即后台拉取最新动态，完成后自动更新追踪徽章 */
</script>
