# AI HOT 仪表盘 · 定时更新静态快照并部署到 GitHub Pages
#
# 触发方式：
#   1. 定时：每天北京时间 08:00（cron 使用 UTC，0 0 = UTC 00:00 = 北京 08:00）
#   2. 手动：仓库 Actions 页 → 选中本工作流 → "Run workflow" 按钮
#
# 流程：
#   checkout → 生成静态快照（抓 aihot API → 渲染 public/index.html）
#   → 校验数据 → 提交回仓库（contents: write）→ 部署到 GitHub Pages
#
# 固定访问链接：https://wadeliuastro.github.io/AI-HOT/
# 前置条件：仓库 Settings → Pages → Source 选择 "GitHub Actions"

name: 定时更新静态快照并部署

on:
  schedule:
    # 每天北京时间 08:00 = UTC 00:00（GitHub cron 固定为 UTC 时区）
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      deploy:
        description: "是否部署到 GitHub Pages（false 则只生成并提交快照）"
        type: boolean
        default: true

# GITHUB_TOKEN 需要写权限才能把生成的文件提交回仓库；
# pages/id-token 权限是官方 Pages 部署 action（deploy-pages）必需
permissions:
  contents: write
  pages: write
  id-token: write

# 防止上一次运行还没结束、下一次定时触发时并发冲突
concurrency:
  group: ai-hot-snapshot
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 生成静态快照
        run: python3 scripts/build_snapshot.py --out public/index.html

      - name: 校验快照（日报/周报均有数据且 JSON 合法）
        run: |
          python3 - <<'EOF'
          import json
          html = open("public/index.html", encoding="utf-8").read()
          start = html.index("const DATA = ") + len("const DATA = ")
          data = json.loads(html[start: html.index(";\n", start)])
          for view in ("daily", "weekly"):
              p = data[view]
              assert p["total"] > 0, f"{view} 无数据"
              print(f"{view}: total={p['total']} range={p['range']['label']}")
          EOF

      - name: 提交快照回仓库（若内容有变化）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          if git diff --cached --quiet; then
            echo "快照无变化，跳过提交"
          else
            git commit -m "chore: 更新 AI HOT 静态快照 [skip ci]"
            git push
          fi

      - name: 准备 Pages 产物（站点根目录）
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.deploy == 'true') }}
        run: |
          mkdir -p _site
          cp public/index.html _site/index.html

      - name: 上传 Pages 产物
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.deploy == 'true') }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 部署到 GitHub Pages
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.deploy == 'true') }}
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 显示固定访问链接
        if: ${{ steps.deployment.outputs.page_url != '' }}
        run: |
          echo "### ✅ 看板已更新，固定访问链接：" >> $GITHUB_STEP_SUMMARY
          echo "[AI HOT 仪表盘](https://wadeliuastro.github.io/AI-HOT/)" >> $GITHUB_STEP_SUMMARY